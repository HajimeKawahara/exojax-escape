decisions:
- id: exploratory_prescribed_sed
  revision: '1'
  question: What use is justified for this stellar-input extension?
  scope: Current code and retained finite experiments, while atmospheric adequacy remains unknown.
  options:
  - id: exploratory
    description: Use for controlled incident-spectrum sensitivity and numerical development.
  - id: physical_inference
    description: Treat the atmosphere as validated for physical posterior inference.
  selected: exploratory
  reasons:
  - The new conversion and paired-field API have current numerical evidence and preserve the default path
    on tested samples, so controlled incident-spectrum experiments are justified.
  - The PHOENIX proxy strongly changes the populations and source but has mixed residual outcomes, and
    its optically thick columns still require coupled internal radiation. This supports further model
    development rather than physical inference.
  - Keep current physical adequacy unknown with direct follow-ups for the incident UV/averaging uncertainties
    and matched internal radiation-plus-population comparison. Historical provider claims remain attached
    to their reviewed source snapshots.
  basis:
  - kind: assessment
    id: mapping_review
    sha256: 26ddeb8aebc00cd4bc802439c62ddf69bd0ac0fdb465833ad84bb6ed74d87c17
  - kind: assessment
    id: response_review
    sha256: caad97ade0614969a89dc569d60e9aeadd2da06d7fd455ba45cee8b9273fe525
  - kind: assessment
    id: physical_review
    sha256: 3b69a9e4f52041ed91f8a349ab0bcc3e24d4d5b2f94b0d9f5a7a55e98714aabf
  limitations:
  - No physical adequacy, recovered Zhang input, global optimum or NUTS readiness is established.
  - Incident photospheric absorption is distinct from internally attenuated and diffuse planetary radiation.
  reconsider_when:
  - Matched internal radiation/population controls and an adequate observation operator support a declared
    physical error budget.
  - A revised stellar UV spectrum or sampling treatment changes the recorded comparison.
  subject: stellar_input_implementation
  context: intended_use
