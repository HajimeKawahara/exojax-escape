assessments:
- id: mapping_review
  subject: stellar_input_implementation
  context: mapping
  method:
    id: scoped_stellar_input_review
    revision: '1'
    description: Review current source identity, executed tests and finite experiment outputs; keep physical
      adequacy distinct from numerical checks.
  evidence:
  - definition
  - verification
  reasons:
  - The current 27-test execution passes. The surface-flux helper recovers diluted Planck occupation from
    F_nu=pi B_nu, preserves the dilution derivative, and exposes invalid grids, negative flux and outside-coverage
    queries. Paired-array tests check default-blackbody equivalence, mismatched/invalid inputs and complete-spectrum
    derivatives.
  - The actual PHOENIX-field spectrum has finite forward and reverse derivatives in the retained line
    amplitude, continuum amplitude, mass-loss and kinetic-temperature directions. The largest finite-difference
    error divided by tolerance is 0.000213 for rtol 0.003, atol 1e-7 and coordinate step 1e-4; the reverse/forward
    comparison also passes.
  - Current Equation and Binding definitions are pinned separately from the historical provider contracts.
    The shared-field method's JAX decorator leaves its automatic static-declaration check unknown; direct
    source review and retained runtime tests support only the declared mapping scope.
  kind: evidence_support
  claim: field_mapping
  claim_revision: '1'
  status: supported
  origin: reviewed
  equation_pins:
  - id: surface_occupation
    revision: '1'
    sha256: 29c13fb9ddc3622689734b08cc508e68f4bca96c5dc6cebac76b104cda5f77fb
  - id: shared_occupation_map
    revision: '1'
    sha256: eb6f4542cc10f872dd46e64324606f78c8e8dc82fa73e25e462e8880b0a6283c
  binding_pins:
  - id: surface_flux_conversion
    sha256: c372a907852fa0f8f3482cdcd2dafea1df75350933d8395a43c9af5ed41f7c13
  - id: shared_prescribed_fields
    sha256: 8405543950387baec313ca6f55f3a2356ee66e6c2ba0075abce1eadd92dc89e5
- id: response_review
  subject: stellar_input_implementation
  context: sampled_response
  method:
    id: scoped_stellar_input_review
    revision: '1'
    description: Review current source identity, executed tests and finite experiment outputs; keep physical
      adequacy distinct from numerical checks.
  evidence:
  - experiment
  - stellar_data
  reasons:
  - At the two fixed atmospheres, replacing the complete blackbody input with the PHOENIX proxy lowers
    the source brightness at 1.8 Rp from 7628 to 4517 K and from 7658 to 4789 K. The normalized residual
    RMS changes from 1.831930 to 2.363925 and from 3.746029 to 2.434607, respectively. These mixed outcomes
    and the weak resulting profiles do not demonstrate a repaired or fitted atmosphere.
  - Separate line-only and continuum-only substitutions, shifts, smoothing, rotation and explicit tail
    changes are retained. Line-only substitution with the original blackbody continuum gives particularly
    poor RMS 43.591 and 24.970; it is a deliberately mixed diagnostic boundary, not a realistic stellar
    spectrum.
  - At the two PHOENIX cases, continuum quadrature 48 versus 96/192, layers 128 versus 256 and atom nmax
    15 versus 20 all remain below 0.1 supplied observational uncertainty at every sampled pixel. The largest
    declared refinement difference is 0.025523 sigma; no baseline is refitted for these numerical differences.
    The criterion is a numerical scale, not a physical model-error allowance or continuous-domain guarantee.
  - Frozen-profile optical-depth calculations retain the radius, velocity and finite 3 Rp outer-boundary
    conventions. At about 1.8 Rp, PHOENIX radial-Doppler Ly-beta depths are 1.057e6 and 7.368e5, while
    positive pure-H bound-free depths at that frequency are 1.757e-7 and 9.613e-7. This demonstrates strong
    modeled resonance opacity at those samples, not the internally scattered radiation field or a complete
    metal/H-minus opacity budget.
  kind: evidence_support
  claim: sampled_sed_response
  claim_revision: '1'
  status: supported
  origin: reviewed
  equation_pins: []
  binding_pins: []
- id: physical_review
  subject: stellar_input_implementation
  context: intended_use
  method:
    id: scoped_stellar_input_review
    revision: '1'
    description: Review current source identity, executed tests and finite experiment outputs; keep physical
      adequacy distinct from numerical checks.
  evidence:
  - definition
  - stellar_data
  - experiment
  reasons:
  - A synthetic LTE photospheric spectrum is a more structured incident proxy, but its exact stellar UV
    field, planet-view rotation and layer/angle-dependent line averaging are not validated. Spectral sampling
    and missing-tail sensitivities are finite diagnostics, not a recovered Zhang input.
  - The model still applies one unattenuated occupation pair in every layer. Large Ly-beta optical depths
    prevent an optically thin justification in the retained columns, but do not determine the mean intensity,
    frequency redistribution, diffuse radiation or final H-alpha error.
  - The full PHOENIX substitution lowers source brightness and excited columns without recovering the
    observed profile at the fixed material states. No self-consistent radiation/population/thermal-pressure
    feedback or adequate processed-observation likelihood has been established.
  - The historical provider test_radiation_feedback FollowUp remains open. Its old source/test mismatches
    against this changed working tree are preserved; earlier numerical support is not silently repinned
    to the new implementation.
  kind: evidence_support
  claim: atmospheric_adequacy
  claim_revision: '1'
  status: unknown
  origin: reviewed
  equation_pins: []
  binding_pins: []
follow_ups:
- id: couple_internal_radiation
  target_kind: assessment
  target: physical_review
  action: At matched density, temperature and incident spectrum, couple frequency-dependent internal radiation
    and statistical equilibrium, including Lyman scattering/conversion and diffuse fields; compare the
    same observer spectrum.
  requires:
  - A declared physical error budget and applicable parameter domain distinct from numerical tolerances.
  - Independent thin/thick controls and converged radiation/population comparisons.
  completion: Retain evidence and a new scoped Assessment. Keep the historical provider test_radiation_feedback
    FollowUp open until its own completion conditions are satisfied.
  sources:
  - mceg/contracts/escape.nlte_spectrum.yaml
- id: constrain_incident_uv
  target_kind: assessment
  target: physical_review
  action: Assess stellar UV uncertainty, missing tails, planet-view rotation and layer-dependent line-profile
    averaging before interpreting an inferred atmosphere.
  requires:
  - Appropriate stellar parameters/spectrum and explicit angular/velocity conventions.
  completion: Record a supported scope or a restricted-use Decision with quantitative uncertainty and
    reconsideration conditions.
  sources:
  - doc/stellar_radiation.tex
follow_up_resolutions: []
equations:
- id: surface_occupation
  revision: '1'
  latex: \eta_\nu=\frac{Wc^2}{2\pi h\nu^3}\,\mathcal I[\{\nu_k,F^{\star}_{\nu,k}\}](\nu),\qquad J_\nu=WF^{\star}_\nu/\pi
  description: Piecewise-linear interpolation of outward-hemisphere surface flux and conversion to diluted
    photon occupation.
  scope: Positive finite vacuum frequencies on the supplied increasing grid, nonnegative finite surface
    flux and dilution. The library does not complete missing spectral tails.
  symbols:
    frequency:
      latex: \nu
      description: Query vacuum frequency
      unit: Hz
    grid:
      latex: \{\nu_k\}
      description: Increasing vacuum surface-frequency grid
      unit: Hz
    flux:
      latex: \{F^{\star}_{\nu,k}\}
      description: Outward-hemisphere stellar surface flux density
      unit: erg s^-1 cm^-2 Hz^-1
    dilution:
      latex: W
      description: Solid-angle dilution
      unit: dimensionless
    occupation:
      latex: \eta_\nu
      description: Already-diluted photon occupation
      unit: dimensionless
  assumptions:
  - Uniform stellar disk with I_nu=F_nu/pi. No bolometric renormalization, second dilution, attenuation
    or diffuse radiation.
  - Outside-coverage queries and invalid grids/flux/dilution produce NaN rather than implicit extrapolation.
  evidence:
  - definition
- id: shared_occupation_map
  revision: '1'
  latex: (\{n_i(r)\},n_e(r),n_p(r))=\mathcal S[n_{\rm H}(r),T(r);\{\eta^{\rm line}_{ul}\},\{\eta^{\rm
    cont}_{q}\}],\quad\partial_r\eta^{\rm line}_{ul}=\partial_r\eta^{\rm cont}_{q}=0
  description: Existing local charge/statistical equilibrium driven by one shared pair of prescribed occupation
    arrays.
  scope: The supplied arrays replace both blackbody arrays together and already include dilution. The
    default blackbody path is retained when neither is supplied.
  symbols:
    line_field:
      latex: \eta^{\rm line}_{ul}
      description: Occupation on atom.line_frequency_hz
      unit: dimensionless
    continuum_field:
      latex: \eta^{\rm cont}_{q}
      description: Occupation on continuum_frequency_hz
      unit: dimensionless
  assumptions:
  - Density, temperature and Parker velocity are prescribed; no ionization-pressure or energy feedback.
  - The caller owns spectral interpolation and any profile averaging. Populations do not return an updated
    internal radiation field.
  evidence:
  - definition
