schema_version: '0.4'
model:
  id: escape.stellar_radiation
  name: Tabulated stellar surface flux driving a prescribed-field hydrogen atmosphere
  description: A differentiable incident-spectrum input extension and controlled SED experiment, with
    atmospheric accuracy unresolved.
  implementation:
    repository: https://github.com/HajimeKawahara/exojax-escape
    revision: New stellar-input implementation on base 5898d68; current selected-file SHA256 identities
      define this Subject.
    entry_points:
    - src/escape/stellar_radiation.py:surface_flux_occupation
    - src/escape/nlte_forward.py:HydrogenNLTEForwardModel.population_profiles
    - src/escape/nlte_forward.py:HydrogenNLTEForwardModel.spectrum
    - examples/stellar_halpha.py:occupation_fields
assumptions:
- statement: One imposed occupation pair illuminates all layers. An LTE stellar atmosphere is a proxy
    for the incident boundary, not a solved planetary radiation field.
  evidence:
  - definition
  - stellar_data
domains:
- kind: scientific_applicability
  status: unknown
  description: Intended atmospheric and observational applicability remains unverified.
  conditions: []
  evidence:
