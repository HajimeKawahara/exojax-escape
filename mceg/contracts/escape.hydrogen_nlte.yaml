decisions:
- id: atom_truncation
  revision: '1'
  question: Which hydrogen states are represented in the first implementation?
  scope: First local NLTE stage; not a convergence-selected atom.
  options:
  - id: six_nl
    description: Resolve 1s,2s,2p,3s,3p,3d plus p/e.
  - id: larger_atom
    description: Include higher states and explicit cascade convergence.
  selected: six_nl
  reasons:
  - Separate the metastable 2s reservoir and the three H-alpha branches while keeping the first rate system
    small.
  limitations:
  - Higher-level cascades and n=3 l mixing are omitted.
  reconsider_when:
  - Change the level set when a larger-atom comparison shows materially different populations or branch
    strengths.
  basis:
  - kind: assessment
    id: physical_review
    sha256: eee429dc1f5f27ae1e86e450398e0ef92a3cbeb2c4c0c1d8e73b6768bfc0f221
  - kind: evidence
    id: nl_atomic_tables
    sha256: 2b33d0a7a759d6b20845ae90ff30e477adbf32741adcb99e09bdde1b0ef28ab7
  subject: nlte_implementation_v1
  context: nlte_formulation_v1
- id: radiation_closure
  revision: '1'
  question: How is radiation coupled to the local populations?
  scope: Prescribed-field, local equilibrium stage.
  options:
  - id: external
    description: Prescribe photon occupations and continuum irradiation.
  - id: coupled
    description: Solve population-dependent internal radiation and transport.
  selected: external
  reasons:
  - A fixed radiation field isolates the rate equations and their implicit derivatives before adding radiation
    feedback.
  limitations:
  - Ly-alpha trapping, continuum shielding, transfer feedback and population advection are omitted.
  reconsider_when:
  - Introduce an independently tested radiation closure and check reaction times against flow times.
  basis:
  - kind: assessment
    id: physical_review
    sha256: eee429dc1f5f27ae1e86e450398e0ef92a3cbeb2c4c0c1d8e73b6768bfc0f221
  subject: nlte_implementation_v1
  context: nlte_formulation_v1
- id: atomic_approximations
  revision: '1'
  question: Which bound-free and forbidden-transition approximations are adopted?
  scope: Rates for the truncated atom.
  options:
  - id: minimal
    description: Use Kramers Gaunt-one cross sections, matched Milne recombination, inverse three-body
      rates and one-way 2s decay.
  - id: extended
    description: Use resolved cross sections, higher-state recombination and inverse two-photon processes.
  selected: minimal
  reasons:
  - Matched inverse one-photon and collisional processes provide controlled checks of the initial solver.
  limitations:
  - This does not establish atomic-data accuracy or a full Planck-LTE limit.
  reconsider_when:
  - Replace approximations after source-specific accuracy comparisons or when inverse two-photon processes
    matter.
  basis:
  - kind: assessment
    id: physical_review
    sha256: eee429dc1f5f27ae1e86e450398e0ef92a3cbeb2c4c0c1d8e73b6768bfc0f221
  - kind: evidence
    id: ionization_and_kramers
    sha256: 2b86e742843d0e4cf8050157aeba71403d4c84f0ea5fe0e0e9a02abfb006d16d
  - kind: evidence
    id: sublevel_mixing
    sha256: e90a55a7d4b50a575efed0c989711a2d4bd750284b474ec7b8e1762a0bdae588
  subject: nlte_implementation_v1
  context: nlte_formulation_v1
- id: temperature_domain
  revision: '1'
  question: Which temperatures are admitted by the initial atomic-data implementation?
  scope: Atomic-rate domain only; not an astrophysical applicability region.
  options:
  - id: intersection
    description: Restrict rates to 0.5 eV/k_B through 14000 K; default NLTE profile runs from 6000 toward
      10000 K.
  - id: extrapolate
    description: Extrapolate the adopted tables and fitted mixing rates.
  selected: intersection
  reasons:
  - Use the intersection of the adopted tabulation and fit ranges; leave the historical 4500 K path unchanged.
  limitations:
  - The interval is an input restriction, not evidence that the atmosphere lies there.
  reconsider_when:
  - Extend the domain only with reviewed rates or explicit extrapolation evidence.
  basis:
  - kind: assessment
    id: physical_review
    sha256: eee429dc1f5f27ae1e86e450398e0ef92a3cbeb2c4c0c1d8e73b6768bfc0f221
  - kind: evidence
    id: nl_atomic_tables
    sha256: 2b33d0a7a759d6b20845ae90ff30e477adbf32741adcb99e09bdde1b0ef28ab7
  - kind: evidence
    id: ionization_and_kramers
    sha256: 2b86e742843d0e4cf8050157aeba71403d4c84f0ea5fe0e0e9a02abfb006d16d
  subject: nlte_implementation_v1
  context: nlte_formulation_v1
- id: halpha_branches
  revision: '1'
  question: How do resolved populations enter the existing unresolved H-alpha transfer?
  scope: Three H-alpha branches evaluated at one shared line profile and the only supported NIST center.
  options:
  - id: branch_sum
    description: Weight each allowed branch by its actual lower and upper nl populations before summing
      extinction and emissivity.
  - id: shell_ratio
    description: Collapse n2 and n3 to statistical shell weights before computing opacity.
  selected: branch_sum
  reasons:
  - Nonstatistical 2s/2p and n=3 populations must retain their individual branch strengths.
  limitations:
  - The common profile and center omit component-dependent shape; the observer-ray formal solver does
    not supply an internal radiation field.
  - Using one H-alpha center removes nl-population-dependent component shifts across an approximately
    5.32 km/s branch span. The inherited unresolved-line natural-width prescription omits branch-specific
    upper-plus-lower lifetimes (roughly 4-16 times larger than that prescription). Precise centroids and
    damping wings are not established.
  reconsider_when:
  - Use resolved profiles when component structure, widths or transfer feedback become relevant.
  basis:
  - kind: assessment
    id: physical_review
    sha256: eee429dc1f5f27ae1e86e450398e0ef92a3cbeb2c4c0c1d8e73b6768bfc0f221
  - kind: evidence
    id: nl_atomic_tables
