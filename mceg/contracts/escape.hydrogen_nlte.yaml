- id: ionization_and_kramers
  kind: literature
  summary: Hydrogen ionization fits and Kramers bound-free approximation for a reduced escape atom.
  sources:
  - https://arxiv.org/html/1910.00267v1
  scope: 'Appendix: bound-free approximation and Table 2 a*T^b*exp(c/T) electron-ionization fits, documented
    to about 20 percent on 4000-14000 K. This is not a matched atmosphere benchmark.'
  provenance:
    role: secondary
    location: Appendix, photoionization cross section and Table 2
    inspection: partial
    note: Adopted formulas and fit range inspected; underlying atomic-data accuracy is inherited rather
      than independently established.
- id: sublevel_mixing
  kind: literature
  summary: Temperature-dependent electron and proton 2s-to-2p mixing fits.
  sources:
  - https://arxiv.org/html/2304.07352v1
  scope: Huang et al. Eqs. 12-13, summed for pure H with ne=np; reverse coefficient set by the adopted
    level energies and statistical weights.
  provenance:
    role: secondary
    location: Equations 12-13 and their stated temperature domain
    inspection: partial
    note: Fit expressions inspected; original collision calculations and errors are not independently
      established.
