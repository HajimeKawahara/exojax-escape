schema_version: '0.4'
model:
  id: escape.hydrogen_nlte
  name: Prescribed-field six-state hydrogen statistical equilibrium
  description: Six resolved nl states, local ionization/excitation balance and implicit derivatives. Radiation,
    temperature and wind molecular weight remain prescribed; this is not a Cloudy or Zhang atmosphere
    reproduction.
  implementation:
    repository: https://github.com/HajimeKawahara/exojax-escape
    revision: d744ef84d3c0b1fbe4bc9e5ccc4b5ce0de16c12d
    entry_points: &id001
    - src/escape/hydrogen_nlte.py:_bound_ratios
    - src/escape/hydrogen_nlte.py:solve_statistical_equilibrium
    - src/escape/hydrogen_rates.py:bound_bound_radiative_rates
    - src/escape/hydrogen_rates.py:bound_free_rates
    - src/escape/hydrogen_rates.py:collision_rates
    - src/escape/hydrogen_rates.py:hydrogen_rate_coefficients
    - src/escape/hydrogen_rates.py:photoionization_cross_section
    - src/escape/nlte_forward.py:HydrogenNLTEForwardModel
    - src/escape/nlte_forward.py:halpha_coefficients
    - src/escape/hydrogen_nlte.py:relaxation_time_s
assumptions:
- statement: 'Pure hydrogen: 1s, 2s, 2p, 3s, 3p, 3d, protons and electrons. Fine structure, n>3 recombination
    cascades and n=3 l mixing are omitted.'
  evidence:
  - formulation
  - implementation
- statement: Temperature, nuclear density and radiation are inputs. Solve local equilibrium at fixed radiation;
    no shielding, trapped line field, thermal balance, population advection or variable-mu wind feedback.
  evidence:
  - formulation
  - implementation
domains:
- kind: numerical_evaluation
  status: documented
  description: Input obligations for the adopted atomic approximation and local solver, not an atmospheric
    accuracy envelope.
  conditions:
  - 'Atomic rates: 0.5 eV/k_B (about 5802.26 K) <= T <= 14000 K; scalar temperature and radiation inputs;
    fixed quadrature.'
  - 'Local solver: float64, finite nH>0, nonnegative rates, zero bound-bound diagonal, at least one positive
    photoionization rate, nonsingular fixed-ne loss matrix.'
  - Root must be bracketed in -80 <= log(ne/nH) <= 0 and pass residual, conservation, balance and positive-slope
    checks.
  evidence:
  - implementation
  - formulation
- kind: scientific_applicability
  status: unknown
  description: No matched Cloudy benchmark, level-convergence result or observational error budget establishes
    KELT-9b atmospheric accuracy.
  conditions: []
  evidence:
  - target_paper
  - formulation
