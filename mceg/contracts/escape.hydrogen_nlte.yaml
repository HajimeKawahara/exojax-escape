equations:
- id: level_rates
  revision: '1'
  latex: P_{lu}=n_e q_{lu}+\frac{g_u}{g_l}A_{ul}\bar n_{ul},\qquad P_{ul}=n_e q_{ul}+A_{ul}(1+\bar n_{ul}),\\\bar
    n_{ul}=\frac{c^2\overline J_{ul}}{2h\nu_{ul}^3}
  description: Allowed bound-bound rates, with prescribed photon occupation and Maxwellian collisions.
  scope: One-photon branches only; the one-way 2s two-photon decay is added separately.
  symbols:
    p:
      latex: P_{ij}
      description: Total rate from bound level i to j
      unit: s^-1
    occupation:
      latex: \bar n_{ul}
      description: Profile-averaged photon occupation
      unit: '1'
    q:
      latex: q_{ij}
      description: Collision coefficient; proton mixing uses ne=np
      unit: cm^3 s^-1
  assumptions:
  - No radiation feedback from the solved populations.
  - Bound-bound arrays are indexed [from, to], with zero diagonal.
  evidence:
  - formulation
  - nl_atomic_tables
- id: collision_balance
  revision: '1'
  latex: q_{lu}=\frac{8.629\times10^{-6}\Upsilon_{lu}(T)}{g_l\sqrt{T}}\exp\!\left(-\frac{\Delta E_{ul}}{k_{\rm
    B}T}\right),\qquad q_{ul}=\frac{8.629\times10^{-6}\Upsilon_{lu}(T)}{g_u\sqrt{T}}
  description: Electron excitation and de-excitation share an interpolated effective collision strength.
  scope: The adopted temperature table; mixing between degenerate 2s and 2p has its own prescription.
  symbols:
    temperature:
      latex: T
      description: Electron temperature
      unit: K
    upsilon:
      latex: \Upsilon_{lu}
      description: Dimensionless thermally averaged collision strength
      unit: '1'
    q:
      latex: q_{ij}
      description: Maxwellian electron collision coefficient
      unit: cm^3 s^-1
    rates:
      latex: \mathcal R
      description: Three returned collision-coefficient arrays
      unit: mixed cgs
  assumptions:
  - Boltzmann detailed balance constrains the inverse rate, not the accuracy of the adopted table.
  evidence:
  - formulation
  - nl_atomic_tables
  - sublevel_mixing
- id: bound_free
  revision: '1'
  latex: K_{ik}=\frac{8\pi\nu_{ik}^2}{c^2}\sigma_i(\nu_{ik}),\quad \Gamma_i=\sum_k w_{ik}K_{ik}\bar n_{ik},\\\alpha_i=\frac{1}{S_i(T)}\sum_k
    w_{ik}K_{ik}(1+\bar n_{ik})\exp\!\left(-\frac{h\nu_{ik}}{k_{\rm B}T}\right),\\S_i(T)=\frac{2}{g_i}\left(\frac{2\pi
    m_e k_{\rm B}T}{h^2}\right)^{3/2}\exp\!\left(-\frac{\chi_i}{k_{\rm B}T}\right),\quad q_i^{(3)}=q_i^{\rm
    ion}/S_i(T)
  description: Photoionization, Milne radiative recombination and inverse three-body recombination.
  scope: The same approximate cross section is used in both radiative directions, including stimulated
    recombination.
  symbols:
    gamma:
      latex: \Gamma_i
      description: Photoionization rate from level i
      unit: s^-1
    alpha:
      latex: \alpha_i
      description: Radiative recombination coefficient into level i
      unit: cm^3 s^-1
    saha:
      latex: S_i
      description: Truncated-atom Saha ratio ne*np/ni
      unit: cm^-3
    q3:
      latex: q_i^{(3)}
      description: Inverse three-body coefficient
      unit: cm^6 s^-1
    temperature:
      latex: T
      description: Electron temperature
      unit: K
    occupation:
      latex: \bar n_{ik}
      description: Prescribed continuum photon occupation
      unit: '1'
    frequency:
      latex: \nu_{ik}
      description: Continuum quadrature frequencies for level i
      unit: Hz
    weights:
      latex: w_{ik}
      description: Quadrature integration weights for dnu
      unit: Hz
  assumptions:
  - Hydrogenic Kramers cross sections with bound-free Gaunt factor one.
  - No recombination or cascades through omitted n>3 levels.
  - 'Default quadrature: 128 Gauss-Legendre nodes in log frequency per threshold through 100 eV. Harder
    spectra need a separate convergence check.'
  evidence:
  - formulation
  - ionization_and_kramers
- id: atomic_closure
  revision: '1'
  latex: \sigma_i(\nu)=\frac{2.815\times10^{29}}{N_i^{5}\nu^3}\,\mathbf 1_{h\nu\ge\chi_i},\qquad q_i^{\rm
    ion}=a_i T^{b_i}\exp(c_i/T)
  description: Kramers photoionization and the adopted electron-ionization fit.
  scope: N_i denotes the principal quantum number of bound level i; T is restricted to the adopted rate
    domain.
  symbols:
    frequency:
      latex: \nu
      description: Photon frequency
      unit: Hz
    sigma:
      latex: \sigma_i
      description: Gaunt-one bound-free cross section
      unit: cm^2
    temperature:
      latex: T
      description: Electron temperature
      unit: K
    principal:
      latex: N_i
      description: Principal quantum number of bound level i
      unit: '1'
  assumptions:
  - Cross sections are independent of orbital l at fixed n.
  - The fit coefficients and their units are tabulated in the companion document; the adopted data domain
    is restricted.
  - Ionization fits are shared by all orbital-l levels of each principal shell, including the shell-averaged
    n=3 fit.
  evidence:
  - formulation
  - ionization_and_kramers
- id: level_balance
  revision: '1'
  latex: Q_i=\sum_{j\ne i}(n_jP_{ji}-n_iP_{ij})+n_e^2\alpha_i+n_e^3q_i^{(3)}-n_i(\Gamma_i+n_eq_i^{\rm
    ion})=0,\\\sum_i n_i+n_p=n_{\rm H},\qquad n_e=n_p
  description: Local statistical equilibrium, hydrogen-nucleus conservation and pure-H charge conservation.
  scope: Six bound nl states plus one proton/electron density; no transport or energy equation.
  symbols:
    density:
      latex: n_{\rm H}
      description: Prescribed total hydrogen-nucleus density
      unit: cm^-3
    bound:
      latex: n_i
      description: Bound-level number density
      unit: cm^-3
    electron:
      latex: n_e=n_p
      description: Electron and proton number density
      unit: cm^-3
    net:
      latex: Q_i
      description: Net production of bound level i
      unit: cm^-3 s^-1
  assumptions:
  - Local reaction equilibrium neglects advection; its applicability to each outflow cell remains unvalidated.
  evidence:
  - formulation
- id: fixed_electron_system
  revision: '1'
  latex: M_{ij}=\delta_{ij}\!\left(\sum_kP_{ik}+\Gamma_i+n_eq_i^{\rm ion}\right)-P_{ji},\\M(n_e)b=n_e\alpha+n_e^2q^{(3)},\qquad
    b_i=n_i/n_e
  description: At fixed electron density the bound-level problem is one linear solve.
  scope: Nonnegative rates with zero bound-bound diagonals and a nonsingular loss matrix.
  symbols:
    electron:
      latex: n_e
      description: Trial electron density
      unit: cm^-3
    rates:
      latex: \mathcal R
      description: RateCoefficients tuple; units are recorded for each field
      unit: mixed cgs
    ratios:
      latex: b
      description: Bound-level density divided by proton density
      unit: '1'
    matrix:
      latex: M
      description: Bound-level loss matrix
      unit: s^-1
  assumptions:
  - Rows are divided by their total outgoing rate for numerical scaling; the equations are unchanged.
  evidence:
  - formulation
- id: charge_root
  revision: '1'
  latex: z=\log(n_e/n_{\rm H}),\qquad F(z)=z+\log\!\left(1+\sum_i b_i(n_{\rm H}e^z)\right)=0,\\n_e=n_p=n_{\rm
    H}e^z,\qquad n_i=n_e b_i
  description: The remaining scalar root enforces nuclear conservation without a redundant proton equation.
  scope: One cell, float64, positive nH; at least one positive photoionization rate; bracket -80 <= z
    <= 0.
  symbols:
    density:
      latex: n_{\rm H}
      description: Prescribed total hydrogen-nucleus density
      unit: cm^-3
    rates:
      latex: \mathcal R
      description: RateCoefficients tuple supplied to the solver
      unit: mixed cgs
    z:
      latex: z
      description: Log ionized fraction
      unit: '1'
    residual:
      latex: F
      description: Scalar conservation residual
      unit: '1'
  assumptions:
  - Eighty bisection iterations by default.
  - Invalid or unconverged solutions return NaN populations and explicit diagnostics.
  evidence:
  - formulation
- id: implicit_derivative
  revision: '1'
  latex: F_z\,\delta z=-F_\theta\,\delta\theta,\qquad \frac{dz}{d\theta}=-\frac{F_\theta}{F_z}
  description: Implicit differentiation uses the same residual as the converged root.
  scope: A locally isolated converged root; derivatives include electron-density feedback and the linear
    solve.
  symbols:
    z:
      latex: z
      description: Log ionized fraction
      unit: '1'
    parameters:
      latex: \theta
      description: Density, rate coefficients and their upstream parameters
      unit: parameter dependent
    residual:
      latex: F
      description: Scalar conservation residual
      unit: '1'
  assumptions:
  - jax.lax.custom_root differentiates the equations, not the bisection decisions.
  - A positive finite root slope is required by the implemented convergence diagnostics.
  evidence:
  - formulation
- id: branch_coefficients
  revision: '1'
  latex: \mathcal A=\sum_{u\to l}\frac{A_{ul}}{8\pi c\widetilde\nu_0^2}\left(\frac{g_u}{g_l}n_l-n_u\right),\qquad
    \mathcal E=\sum_{u\to l}\frac{hc\widetilde\nu_0 A_{ul}}{4\pi}n_u,\\\chi_{\widetilde\nu}=\mathcal A\phi_{\widetilde\nu},\qquad
    j_{\widetilde\nu}=\mathcal E\phi_{\widetilde\nu},\qquad \int\phi_{\widetilde\nu}\,d\widetilde\nu=1
  description: Sum the three H-alpha branches before multiplying by a shared normalized profile.
  scope: Branches 3s->2p, 3p->2s and 3d->2p use their actual nl populations; only the common NIST center
    is supported.
  symbols:
    bound:
      latex: n_i
      description: Actual nl-level number densities
      unit: cm^-3
    center:
      latex: \widetilde\nu_0
      description: Common H-alpha rest wavenumber
      unit: cm^-1
    alpha:
      latex: \mathcal A
      description: Extinction integrated over wavenumber
      unit: cm^-2
    emission:
      latex: \mathcal E
      description: Emissivity integrated over wavenumber
      unit: erg s^-1 cm^-3 sr^-1
  assumptions:
  - No statistical redistribution between nl levels is made.
  - Common-profile line transfer is evaluated only for positive integrated extinction; zero or negative
    extinction is reported through NaN spectra.
  - The shared natural width omits branch-specific upper-plus-lower lifetimes; no precise centroid or
    wing accuracy is claimed.
  evidence:
  - formulation
  - implementation
  - nl_atomic_tables
- id: relaxation_time
  revision: '1'
  latex: K_{ij}=\left.\frac{\partial Q_i}{\partial n_j}\right|_{n_{\rm H},T,J_\nu},\quad n_e=n_p=n_{\rm
    H}-\sum_i n_i,\\\tau_{\rm relax}=-\frac{1}{\max_a\operatorname{Re}\lambda_a(K)}\quad\text{if all }\operatorname{Re}\lambda_a(K)<0
  description: Slow local kinetic relaxation includes the charge response to changing bound populations.
  scope: Optional diagnostic evaluated at converged local populations; no radiation or transport feedback.
  symbols:
    density:
      latex: n_{\rm H}
      description: Fixed total hydrogen-nucleus density
      unit: cm^-3
    bound:
      latex: n_i
      description: Independent bound-level number densities
      unit: cm^-3
    rates:
      latex: \mathcal R
      description: The prescribed RateCoefficients used by the population solve
      unit: mixed cgs
    time:
      latex: \tau_{\rm relax}
      description: Slowest local damping time
      unit: s
  assumptions:
  - The reduced kinetic Jacobian has no redundant nuclear-conservation mode.
  - Nondecaying or unstable modes return infinity; invalid or nonfinite inputs return NaN.
  - Comparison with r/v is a characteristic diagnostic, not a proof that the relevant population-gradient
    transport time is long.
  evidence:
  - formulation
  - implementation
