limitations:
- statement: One-way 2s two-photon decay has no inverse two-photon absorption. No full thermodynamic Planck/Saha-LTE
    limit is claimed.
  evidence:
  - formulation
  - implementation
- statement: Kramers bound-free Gaunt factor one, limited-temperature rate fits, missing n>3 cascades
    and omitted n=3 mixing require independent accuracy and convergence assessments.
  evidence:
  - formulation
  - implementation
- statement: Radiation and wind molecular weight stay external. The diagnostic mu=1/(1+np/nH) does not
    feed back into wind dynamics.
  evidence:
  - formulation
  - implementation
- statement: H-alpha uses actual nl branch populations with one shared line profile/center. Sublevel-resolved
    spectral shape, self-consistent internal radiation and atmosphere validation remain unresolved.
  evidence:
  - formulation
  - implementation
- statement: Using one H-alpha center removes nl-population-dependent component shifts across an approximately
    5.32 km/s branch span. The inherited unresolved-line natural-width prescription omits branch-specific
    upper-plus-lower lifetimes (roughly 4-16 times larger than that prescription). Precise centroids and
    damping wings are not established.
  evidence:
  - implementation
  - nl_atomic_tables
