schema_version: '0.5'
model:
  id: escape.mathematical_model
  name: Explicit quantities and selected mathematical model connections
  description: 'Three scoped component definitions: composition-pressure wind, continuum field feedback, and
    the existing fixed-atmosphere GP inference.'
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exojax-escape
    revision: 21638588e75ba0d8bf92161a0e932d94f65c3ae1
    entry_points:
    - examples/gp_halpha.py:make_gp_problem
    - examples/gp_halpha.py:make_model
    - src/escape/atmosphere_wind.py:wind_from_profiles
    - src/escape/hydrogen_escape_probability.py:HydrogenEscapeProbabilityModel.population_state
    - src/escape/hydrogen_escape_probability.py:_replace_complete_mean
    - src/escape/hydrogen_nlte.py:_bound_system
    - src/escape/nonisothermal.py:nonisothermal_parker_velocity
    - src/escape/solar.py:SolarAtmosphereModel.evaluate_atmosphere
    - src/escape/time_gp.py:time_gp_loglike
assumptions:
- statement: These records describe selected components; external physical closures remain explicitly outside
    their scope.
  evidence:
  - source_review
- statement: MCEG is an authoring-only tool. escape imports and runtime dependencies remain independent of
    these records.
  evidence:
  - source_review
limitations:
- statement: Structure and source-location checks do not establish mathematical/code equivalence, complete
    physics, unique solutions or observational validity.
  evidence:
  - source_review
- statement: Existing solar and GP contracts, supported/contradicted/unknown assessments and readiness requirements
    retain their historical pins.
  evidence:
  - source_review
domains:
- kind: numerical_evaluation
  status: documented
  description: Recorded component assembly and finite checks of its source connections.
  conditions:
  - Positive prescribed wind profiles and the existing single-sonic-point domain.
  - Selected local-SE hydrogen continuum component; no population advection.
  - Fixed-mask conditional GP with the saved atmosphere and exposure-centre kernel.
  evidence:
  - source_review
subjects:
- id: current_source
  implementation: *id001
  selected_files:
