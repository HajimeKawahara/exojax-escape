bindings:
- id: wind_profile_connection
  equation:
    id: effective_temperature
    revision: '1'
  subject: current_source
  source: src/escape/atmosphere_wind.py
  symbol: wind_from_profiles
  arguments:
    radius_cm:
      symbol: r
    temperature_k:
      symbol: T
    mean_molecular_weight:
      symbol: mu
  note: The function constructs log(T/mu) and passes the interpolant with solver mu=1. No returned tuple component
    is inferred by Binding.
- id: wind_momentum_connection
  equation:
    id: wind_momentum
    revision: '1'
  subject: current_source
  source: src/escape/nonisothermal.py
  symbol: nonisothermal_parker_velocity
  arguments:
    radius_cm:
      symbol: r
    tidal_coefficient_s2:
      symbol: kappa
  note: temperature_fn encodes a^2 via the pressure relation. planet_mass_mj and km/s outputs require the documented
    cgs conversions; this partial declaration does not execute them.
- id: wind_continuity_connection
  equation:
    id: mass_continuity
    revision: '1'
  subject: current_source
  source: src/escape/atmosphere_wind.py
  symbol: wind_from_profiles
  arguments:
    radius_cm:
      symbol: r
    mass_loss_g_s:
      symbol: mdot
  note: density_g_cm3 uses velocity_kms*1e5 in spherical continuity. Structured outputs are documented, not
    automatically mapped.
- id: hydrogen_density_connection
  equation:
    id: hydrogen_mass_conversion
    revision: '1'
  subject: current_source
  source: src/escape/solar.py
  symbol: SolarAtmosphereModel.evaluate_atmosphere
  arguments: {}
  note: The local density argument sent to evaluate is wind.density_g_cm3/self.mass_per_h. The complete atmosphere
    residual has more equations than this excerpt.
- id: field_replacement_connection
  equation:
    id: continuum_field_selection
    revision: '1'
  subject: current_source
  source: src/escape/hydrogen_escape_probability.py
  symbol: _replace_complete_mean
  arguments:
    original:
      symbol: J_slab
  note: override is the structured (mask, complete shared J) pair. The function returns selected J, mask and
    validity; the initial Binding schema does not unpack them.
- id: continuum_rates_connection
  equation:
    id: continuum_photoionization
    revision: '1'
  subject: current_source
  source: src/escape/hydrogen_escape_probability.py
  symbol: HydrogenEscapeProbabilityModel.population_state
  arguments: {}
  note: occupation is formed from the selected continuum_mean, not transfer.mean_intensity. The photo kernel
    and local-event contribution are internal arrays; tuple/attribute data flow requires review and numerical
    tests.
- id: local_se_connection
  equation:
    id: local_bound_balance
    revision: '1'
  subject: current_source
  source: src/escape/hydrogen_nlte.py
  symbol: _bound_system
  arguments:
    electron_density:
      symbol: ne
  note: The returned matrix and source implement the balance for n_i/n_p. SolarCompositionModel.evaluate first
    adds the extra ionization and recombination inputs into RateCoefficients. Structured field unpacking is
    not inferred by Binding.
- id: native_model_connection
  equation:
    id: conditional_native_model
    revision: '1'
  subject: current_source
  source: examples/gp_halpha.py
  symbol: make_gp_problem
  arguments: {}
  note: The returned native_log_models callback scales fixed interpolated spectra by exp(log contrast), applies
    the RV offset and computes log native flux. Its two sampled parameters are explicitly connected to the
    likelihood through log_model; internal observer equations remain external.
- id: gp_likelihood_connection
  equation:
    id: gp_likelihood
    revision: '1'
  subject: current_source
  source: src/escape/time_gp.py
  symbol: time_gp_loglike
  arguments: {}
  note: The function uses the equivalent Woodbury evaluation. Inputs encode projected quantities via a prepared
    state; this declaration does not infer that algebraic equivalence.
  result: logp
- id: gp_prior_connection
  equation:
    id: conditional_planet_prior
    revision: '1'
  subject: current_source
  source: examples/gp_halpha.py
  symbol: make_model
  arguments: {}
  note: The returned nested NumPyro function samples the shared RV and log contrast. NUTS and MAP initialization
    are numerical methods, not additional model relations.
