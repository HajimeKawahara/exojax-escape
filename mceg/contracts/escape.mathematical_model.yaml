equations:
- id: effective_temperature
  revision: '1'
  latex: T_{\rm eff}(r)=T(r)/\mu(r)
  description: Convert the gas profile to the pressure-equivalent wind profile.
  scope: Sample values before Hermite interpolation; no thermochemical solution is implied.
  symbols:
    T:
      latex: T
      description: Gas kinetic temperature, not the pressure-equivalent solver profile.
      unit: K
    mu:
      latex: \mu
      description: Mean particle mass including free electrons, in proton-mass units.
      unit: '1'
    T_eff:
      latex: T_{\rm eff}
      description: Pressure-equivalent temperature T/mu passed to the wind solver with mu=1.
      unit: K
    r:
      latex: r
      description: Distance from the planet centre at atmosphere cell centres.
      unit: cm
  assumptions:
  - Interpolate log(T/mu) in log radius with the documented zero endpoint slopes and constant extension.
  evidence:
  - source_review
- id: pressure_ratio
  revision: '1'
  latex: a^2(r)=k_B T_{\rm eff}(r)/m_H
  description: Ideal-gas pressure ratio retains the composition gradient through T/mu.
  scope: The effective solver uses mu=1; gamma does not multiply this pressure ratio.
  symbols:
    a2:
      latex: a^2
      description: Isothermal pressure ratio P/rho, not the adiabatic sound speed squared.
      unit: cm^2 s^-2
    T_eff:
      latex: T_{\rm eff}
      description: Pressure-equivalent temperature T/mu passed to the wind solver with mu=1.
      unit: K
    kB:
      latex: k_B
      description: Boltzmann constant in cgs.
      unit: erg K^-1
    mH:
      latex: m_H
      description: Proton mass used by the pressure relation.
      unit: g
    r:
      latex: r
      description: Distance from the planet centre at atmosphere cell centres.
      unit: cm
  assumptions: []
  evidence:
  - source_review
- id: wind_momentum
  revision: '1'
  latex: \left(v-\frac{a^2}{v}\right)\frac{dv}{dr}=\frac{2a^2}{r}-\frac{da^2}{dr}-\frac{GM_p}{r^2}+\kappa r
  description: Steady nonisothermal radial momentum with linear effective tidal gravity.
  scope: A prescribed positive smooth pressure profile and a single regular wind critical point.
  symbols:
    v:
      latex: v
      description: Outward radial wind speed in cgs; Python wind output is in km/s.
      unit: cm s^-1
    a2:
      latex: a^2
      description: Isothermal pressure ratio P/rho, not the adiabatic sound speed squared.
      unit: cm^2 s^-2
    r:
      latex: r
      description: Distance from the planet centre at atmosphere cell centres.
      unit: cm
    GMp:
      latex: GM_p
      description: Planetary gravitational parameter.
      unit: cm^3 s^-2
    kappa:
      latex: \kappa
      description: Nonnegative linear star-planet-axis tidal coefficient.
      unit: s^-2
  assumptions:
  - The linear tide is used with spherical mass conservation; this is not full Roche geometry.
  evidence:
  - source_review
- id: wind_critical
  revision: '1'
  latex: v(r_c)^2=a^2(r_c),\qquad \frac{2a^2(r_c)}{r_c}-\left.\frac{da^2}{dr}\right|_{r_c}-\frac{GM_p}{r_c^2}+\kappa
    r_c=0
  description: Select a regular transonic point.
  scope: The wind branch and domain guards are additional declared solver choices, not a proof of global uniqueness.
  symbols:
    v:
      latex: v
      description: Outward radial wind speed in cgs; Python wind output is in km/s.
      unit: cm s^-1
    a2:
      latex: a^2
      description: Isothermal pressure ratio P/rho, not the adiabatic sound speed squared.
      unit: cm^2 s^-2
    r:
      latex: r
      description: Distance from the planet centre at atmosphere cell centres.
      unit: cm
    r_c:
      latex: r_c
      description: The selected regular transonic critical radius within the wind domain.
      unit: cm
    GMp:
      latex: GM_p
      description: Planetary gravitational parameter.
      unit: cm^3 s^-2
    kappa:
      latex: \kappa
      description: Nonnegative linear star-planet-axis tidal coefficient.
      unit: s^-2
  assumptions: []
  evidence:
  - source_review
- id: mass_continuity
  revision: '1'
  latex: \rho(r)=\frac{\dot M}{4\pi r^2v(r)}
  description: Convert steady spherical mass flux and wind speed to total mass density.
  scope: Positive radius, mass loss and velocity; no mass sources between cells.
  symbols:
    rho:
      latex: \rho
      description: Total gas mass per volume, including the adopted composition.
      unit: g cm^-3
    mdot:
      latex: \dot M
      description: Steady spherical mass-loss rate.
      unit: g s^-1
    r:
      latex: r
      description: Distance from the planet centre at atmosphere cell centres.
      unit: cm
    v:
      latex: v
      description: Outward radial wind speed in cgs; Python wind output is in km/s.
      unit: cm s^-1
  assumptions: []
  evidence:
  - source_review
- id: hydrogen_mass_conversion
  revision: '1'
  latex: n_{\rm H}(r)=\rho(r)/m_{/H}
  description: Convert total mass density to hydrogen-nucleus density.
  scope: The mass per hydrogen nucleus belongs to the selected abundance mixture.
  symbols:
    nH:
      latex: n_{\rm H}
      description: Total hydrogen-nucleus number density, not neutral-H density.
      unit: cm^-3
    rho:
      latex: \rho
      description: Total gas mass per volume, including the adopted composition.
      unit: g cm^-3
    mass_per_h:
      latex: m_{/H}
      description: Total gas mass per hydrogen nucleus for the fixed abundance mixture.
      unit: g
    r:
      latex: r
      description: Distance from the planet centre at atmosphere cell centres.
      unit: cm
  assumptions: []
  evidence:
  - source_review
- id: continuum_coefficients
  revision: '1'
  latex: (\chi_{\rm tr},j_\nu)=\mathcal C[T,n_i,n_p,n_e]
  description: Adopt the implemented continuum coefficient and effective transport closures.
  scope: 'Operator definition at population_state: bound-free/free-free, selected scattering attenuation and
    supplied composition coefficients. Atomic data and additional metal/molecular fields are fixed operator
    inputs in this excerpt.'
  symbols:
    chi:
      latex: \chi_{\rm tr}
      description: Effective transport extinction, including the selected scattering attenuation closure.
      unit: cm^-1
    j:
      latex: j_\nu
      description: Continuum emission including added composition and two-photon contributions.
      unit: erg cm^-3 s^-1 Hz^-1 sr^-1
    T:
      latex: T
      description: Gas kinetic temperature, not the pressure-equivalent solver profile.
      unit: K
    n:
      latex: n_i
      description: Absolute bound hydrogen populations in the adopted orbital/shell basis.
      unit: cm^-3
    np:
      latex: n_p
      description: Ionized hydrogen number density.
      unit: cm^-3
    ne:
      latex: n_e
      description: Electron number density from the composition state.
      unit: cm^-3
  assumptions:
  - This named operator is not an expanded specification of every atomic or molecular process.
  evidence:
  - source_review
- id: native_slab_transfer
  revision: '1'
  latex: J_{\rm slab}=\mathcal T_{\rm slab}[\chi_{\rm tr},j_\nu,J_{\rm inc},I_{\rm in}]
  description: Retain the native finite-cell slab transport diagnostic.
  scope: Formal slab transfer with angle quadrature and an external normal beam; this diagnostic can differ
    from the field used by the rates.
  symbols:
    J_slab:
      latex: J_{\rm slab}
      description: Native slab transport diagnostic retained at continuum.mean_intensity.
      unit: erg cm^-2 s^-1 Hz^-1 sr^-1
    chi:
      latex: \chi_{\rm tr}
      description: Effective transport extinction, including the selected scattering attenuation closure.
      unit: cm^-1
    j:
      latex: j_\nu
      description: Continuum emission including added composition and two-photon contributions.
      unit: erg cm^-3 s^-1 Hz^-1 sr^-1
    J_inc:
      latex: J_{\rm inc}
      description: Outer-boundary normal-beam mean intensity on the continuum grid.
      unit: erg cm^-2 s^-1 Hz^-1 sr^-1
    I_in:
      latex: I_{\rm in}
      description: Inner-boundary isotropic incoming specific intensity; it is not an outer beam mean.
      unit: erg cm^-2 s^-1 Hz^-1 sr^-1
  assumptions: []
  evidence:
  - source_review
- id: continuum_field_selection
  revision: '1'
  latex: J_{\rm used}=(1-M_\nu)J_{\rm slab}+M_\nu J_{\rm shared}
  description: Replace selected frequencies with a complete shared field, without adding it twice.
  scope: When spherical_shell_average is selected in the solar model, shared values come from that composition/radiation
    solve. With no override the mask is zero. That larger solve is an explicit external component here.
  symbols:
    J_used:
      latex: J_{\rm used}
      description: Selected continuum field actually used in photoionization and kinetic heat/cool rates.
      unit: erg cm^-2 s^-1 Hz^-1 sr^-1
    M:
      latex: M_\nu
      description: Boolean frequency mask selecting replacement by a complete shared continuum field.
      unit: '1'
    J_slab:
      latex: J_{\rm slab}
      description: Native slab transport diagnostic retained at continuum.mean_intensity.
      unit: erg cm^-2 s^-1 Hz^-1 sr^-1
    J_shared:
      latex: J_{\rm shared}
      description: Complete externally coupled shared field supplied to the override.
      unit: erg cm^-2 s^-1 Hz^-1 sr^-1
  assumptions: []
  evidence:
  - source_review
- id: continuum_pump_selection
  revision: '1'
  latex: J_{\rm pump}=(1-M_\nu)J_{\rm fwd}+M_\nu J_{\rm shared}
  description: Keep the pumping approximation distinct from the continuum rate field.
  scope: The forward mean combines attenuated illumination and the forward-diffuse approximation. Off the mask
    it is not generally the slab angular mean. Discrete line pumping uses its own line grid and finite-cell
    quadrature and is outside this component.
  symbols:
    J_pump:
      latex: J_{\rm pump}
      description: Continuum-grid pumping field after the same complete-field selection; distinct from J_used
        off the mask.
      unit: erg cm^-2 s^-1 Hz^-1 sr^-1
    M:
      latex: M_\nu
      description: Boolean frequency mask selecting replacement by a complete shared continuum field.
      unit: '1'
    J_fwd:
      latex: J_{\rm fwd}
      description: Attenuated incident plus forward-diffuse mean before continuum override.
      unit: erg cm^-2 s^-1 Hz^-1 sr^-1
    J_shared:
      latex: J_{\rm shared}
      description: Complete externally coupled shared field supplied to the override.
      unit: erg cm^-2 s^-1 Hz^-1 sr^-1
  assumptions: []
  evidence:
  - source_review
- id: continuum_photoionization
  revision: '1'
  latex: \Gamma_i=\sum_\nu K_{i\nu}\frac{J_{\rm used,\nu}}{2h\nu^3/c^2}+\Gamma_i^{\rm OTS}
  description: Use the selected continuum mean in the discrete photoionization rate.
  scope: The supplied kernel includes frequency quadrature. Optional topoff scaling is excluded from this component.
    Added composition events enter the separate extra-ionization and extra-recombination inputs of bound balance.
  symbols:
    Gamma:
      latex: \Gamma_i
      description: Hydrogen continuum plus local line-event photoionization rate per atom, before the separate
        composition additions.
      unit: s^-1
    K:
      latex: K_{i\nu}
      description: Discrete photoionization kernel including atomic cross sections, quadrature and occupation
        prefactors.
      unit: s^-1
    J_used:
      latex: J_{\rm used}
      description: Selected continuum field actually used in photoionization and kinetic heat/cool rates.
      unit: erg cm^-2 s^-1 Hz^-1 sr^-1
    h:
      latex: h
      description: Planck constant in cgs.
      unit: erg s
    nu:
      latex: \nu
      description: Continuum quadrature frequency, distinct from the discrete line-centre grid.
      unit: Hz
    c:
      latex: c
      description: Vacuum light speed in cgs.
      unit: cm s^-1
    Gamma_ots:
      latex: \Gamma_i^{\rm OTS}
      description: Hydrogen on-the-spot photoionization contribution from local line events, held explicit
        in this component.
      unit: s^-1
  assumptions: []
  evidence:
  - source_review
- id: local_bound_balance
  revision: '1'
  latex: 0={}&\sum_{j\ne i}(n_jR_{ji}-n_iR_{ij})-n_i(\Gamma_i+\Gamma_i^{\rm extra}+n_eC_i)\\&+n_p n_e(\alpha_i+\alpha_i^{\rm
    extra})+n_p n_e^2q_i
  description: Hydrogen local statistical equilibrium at a fixed composition state.
  scope: The solar path uses local SE without population advection. The extra inputs record the actual effective
    source/sink contributions added in SolarCompositionModel.evaluate. Charge/nucleus conservation, the construction
    of those composition terms, line rates and thermal closure belong to the larger solar model.
  symbols:
    n:
      latex: n_i
      description: Absolute bound hydrogen populations in the adopted orbital/shell basis.
      unit: cm^-3
    R:
      latex: R_{ij}
      description: Total bound-bound radiative and collisional rate from i to j, including selected line closures.
      unit: s^-1
    Gamma:
      latex: \Gamma_i
      description: Hydrogen continuum plus local line-event photoionization rate per atom, before the separate
        composition additions.
      unit: s^-1
    Gamma_extra:
      latex: \Gamma_i^{\rm extra}
      description: Additional per-atom source of hydrogen ionization from received photons, charge transfer
        and molecular proton production.
      unit: s^-1
    ne:
      latex: n_e
      description: Electron number density from the composition state.
      unit: cm^-3
    C:
      latex: C_i
      description: Electron collisional ionization coefficient.
      unit: cm^3 s^-1
    np:
      latex: n_p
      description: Ionized hydrogen number density.
      unit: cm^-3
    alpha:
      latex: \alpha_i
      description: Radiative recombination coefficient, including adopted induced/local-event terms.
      unit: cm^3 s^-1
    alpha_extra:
      latex: \alpha_i^{\rm extra}
      description: Additional effective recombination coefficient, including received photons, charge transfer
        and molecular proton destruction after conversion by electron density.
      unit: cm^3 s^-1
    q:
      latex: q_i
      description: Three-body recombination coefficient.
      unit: cm^6 s^-1
  assumptions: []
  evidence:
  - source_review
- id: conditional_native_model
  revision: '1'
  latex: m=\log\mathcal O[e^{\log A_p}F_{\rm saved};\Delta v]
  description: Connect the sampled RV and contrast to the native log prediction through the existing observation
    operator.
  scope: The named operator fixes phase interpolation, supplied stellar template, orbital Doppler coordinates,
    conservative eclipse mask, native wavelength sampling and continuum normalization as in make_gp_problem/make_native_flux_fast.
    Its internal equations remain in the existing observation contracts.
  symbols:
    m:
      latex: m
      description: Log native star-plus-planet model from the fixed saved atmosphere, with shared RV and contrast.
      unit: '1'
    F_saved:
      latex: F_{\rm saved}
      description: Fixed dimensionless intrinsic planet template on the saved phase/velocity grid; no atmosphere
        parameters are solved at each posterior draw.
      unit: '1'
    rv:
      latex: \Delta v
      description: One planet RV offset shared across both nights and orders.
      unit: km s^-1
    log_Ap:
      latex: \log A_p
      description: Log positive planet contrast multiplier shared across nights and orders.
      unit: '1'
  assumptions: []
  evidence:
  - source_review
- id: gp_project_data
  revision: '1'
  latex: d=CD_0^{-1/2}(y-m),\qquad G=CD_0^{-1/2}B
  description: Remove the arbitrary common spectrum from both mean and GP design.
  scope: C and D0 are fixed by the selected valid native samples; the absolute common spectrum is not recovered.
  symbols:
    d:
      latex: d
      description: The weighted time contrast of log data minus log prediction.
      unit: '1'
    C:
      latex: C
      description: Fixed orthonormal contrast rows orthogonal to the whitened common-spectrum design.
      unit: '1'
    D0:
      latex: D_0
      description: Fixed diagonal first-order log-error proxy, before the inferred white scale.
      unit: '1'
    y:
      latex: y
      description: Logarithm of archived positive ratio 1+r at the selected native samples.
      unit: '1'
    m:
      latex: m
      description: Log native star-plus-planet model from the fixed saved atmosphere, with shared RV and contrast.
      unit: '1'
    G:
      latex: G
      description: The same weighted time contrast applied to the GP design.
      unit: '1'
    B:
      latex: B
      description: Native design for time-varying grey and spectral-slope coefficients.
      unit: '1'
  assumptions: []
  evidence:
  - source_review
- id: gp_kernel
  revision: '1'
  latex: K_{j,ef}=A_j^2\left[(1+u_{ef})e^{-u_{ef}}+10^{-10}\delta_{ef}\right],\qquad u_{ef}=\sqrt3|t_e-t_f|/\ell
  description: Independent Matern-3/2 grey and slope processes with the actual training regularizer.
  scope: Off-mode blocks are zero; length is common within a night/order. The 1e-10 term is a declared finite
    numerical covariance modification, not a physical noise detection.
  symbols:
    K:
      latex: K
      description: Independent two-mode Matern covariance on exposure centres, including the training regularizer.
      unit: '1'
    A:
      latex: A_j
      description: Separate positive GP amplitudes for grey and slope coefficients.
      unit: '1'
    t:
      latex: t_e
      description: Exposure-centre times in minutes, without finite-exposure integration.
      unit: min
    ell:
      latex: \ell
      description: One positive correlation length shared by grey and slope in a night/order.
      unit: min
  assumptions: []
  evidence:
  - source_review
- id: gp_project_covariance
  revision: '1'
  latex: \Sigma=s^2I+GKG^T
  description: Marginalize the time-GP coefficients in the same contrast space.
  scope: White proxy is diagonal before projection; residual spectral and cross-order covariance is not represented.
  symbols:
    Sigma:
      latex: \Sigma
      description: Covariance in the fixed supported contrast space.
      unit: '1'
    s:
      latex: s
      description: Inferred positive scale multiplying the empirical diagonal errors.
      unit: '1'
    G:
      latex: G
      description: The same weighted time contrast applied to the GP design.
      unit: '1'
    K:
      latex: K
      description: Independent two-mode Matern covariance on exposure centres, including the training regularizer.
      unit: '1'
  assumptions: []
  evidence:
  - source_review
- id: gp_likelihood
  revision: '1'
  latex: \log p(d)=-\tfrac12\left[d^T\Sigma^{-1}d+\log|\Sigma|+R\log(2\pi)\right]
  description: Evaluate the marginalized Gaussian likelihood including the covariance determinant.
  scope: The native fixed-mask contrast measure omits only parameter-independent supplied-error constants.
  symbols:
    logp:
      latex: \log p(d)
      description: Marginal Gaussian log density in the declared fixed contrast measure.
      unit: '1'
    d:
      latex: d
      description: The weighted time contrast of log data minus log prediction.
      unit: '1'
    Sigma:
      latex: \Sigma
      description: Covariance in the fixed supported contrast space.
      unit: '1'
    rank:
      latex: R
      description: Number of supported contrast rows, sum_p max(E_p-1,0).
      unit: '1'
  assumptions: []
  evidence:
  - source_review
- id: conditional_planet_prior
  revision: '1'
  latex: \Delta v\sim\mathcal U(-15,15)\ {\rm km\,s^{-1}},\qquad \log A_p\sim\mathcal N(0,0.7^2)
  description: The two planet-parameter priors in the current conditional NUTS model.
  scope: Temperature, composition, wind and stored atmosphere spectra remain fixed; this is not full-atmosphere
    inference.
  symbols:
    rv:
      latex: \Delta v
      description: One planet RV offset shared across both nights and orders.
      unit: km s^-1
    log_Ap:
      latex: \log A_p
      description: Log positive planet contrast multiplier shared across nights and orders.
      unit: '1'
  assumptions: []
  evidence:
  - source_review
- id: conditional_noise_prior
  revision: '1'
  latex: \log s\sim\mathcal N(0,0.35^2),\quad \log A_j\sim\mathcal N(\log(300\times10^{-6}),1),\quad \log(\ell/{\rm
    min})\sim\mathcal N(\log20,1)
  description: Default independent log-normal white and GP hyperparameter priors.
  scope: Each night/order has its own noise parameters; GP amplitudes exclude zero. The documented explicit
    defaults are selected here.
  symbols:
    s:
      latex: s
      description: Inferred positive scale multiplying the empirical diagonal errors.
      unit: '1'
    A:
      latex: A_j
      description: Separate positive GP amplitudes for grey and slope coefficients.
      unit: '1'
    ell:
      latex: \ell
      description: One positive correlation length shared by grey and slope in a night/order.
      unit: min
  assumptions: []
  evidence:
  - source_review
