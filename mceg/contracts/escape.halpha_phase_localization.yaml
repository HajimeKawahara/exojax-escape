contexts:
- id: archived_two_night_phase_grid
  scope: Predeclared phase bins and exact B/C/R bands in the two archived nights; same full-data reference
    and original baseline RV/amplitude.
  settings:
    phase_edges: 0.30,0.325,0.35,0.375,0.40,0.425,0.435
    blue_kms: '[-40,-16)'
    core_kms: '[-8,8)'
    red_kms: '[16,40)'
    subbin_width_kms: 4.0
    noise_draws_per_interleave: 64
    injections_per_interleave: 256
assumptions:
- statement: Complete-band means use equal velocity-subbin, exposure and simultaneous-order weights; both orders
    must support every subbin and both edges.
  evidence:
  - protocol
  - support
limitations:
- statement: Empirical blocks include residual mean structure and fitted-nuisance suppression. Proxy intervals
    are not calibrated or simultaneous confidence intervals.
  evidence:
  - report
  - uncertainty
- statement: No complete late blue/core band is inferred from its partly observed portion. Night-specific references
    and upstream reductions are not independently recovered.
  evidence:
  - support
  - response
domains:
- kind: numerical_evaluation
  status: documented
  description: Positive archived native ratios on recorded valid support.
  conditions:
  - Primary and complementary stride-two pixels; original stellar mask 110 to 390 km/s.
  - No extrapolation into absent complete velocity bands.
  evidence:
  - protocol
  - support
claims:
- id: phase_operator_controls
  revision: '1'
  kind: numerical_verification
  statement: The recorded fixed-band maps, covariance propagation and finite native phase-band GLS satisfy
    their stated numerical controls.
  scope: Both pixel interleaves; fixed and local-refit covariance; 256 conditional injections each; finite
    rectangular native corrections, not observational-noise validation.
- id: finite_support_and_pattern
  revision: '1'
  kind: numerical_verification
  statement: The declared data selection has no complete blue support after its last first-night exposure near phase 0.39322, while its 0.3761
    to 0.3932 complete-band residual has positive blue and negative core/red signs in both orders and both
    pixel interleaves.
  scope: Exact recorded samples and fixed baseline/reference/GP. Residual signs and coverage only; no significance
    or intrinsic source-function claim.
- id: physical_phase_localization
  revision: '1'
  kind: physical_validation
  statement: The blue/core residual is uniquely identified as a statistically calibrated physical change with
    orbital phase, separated from night-specific stellar/reduction variability.
  scope: Prospective atmospheric inference beyond the finite conditional diagnostics.
