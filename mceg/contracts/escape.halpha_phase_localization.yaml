assessments:
- id: phase_operator_controls_review
  kind: evidence_support
  claim: phase_operator_controls
  claim_revision: '1'
  status: supported
  origin: reviewed
  subject: phase_diagnostics
  context: archived_two_night_phase_grid
  method:
    id: pinned_execution_and_scope_review
    revision: '1'
    description: Verify executed maps, covariances, finite controls and independent reviews; preserve the distinction
      between data patterns and calibrated physical attribution.
  evidence:
  - protocol
  - maps
  - covariance_checks
  - response
  - validation
  reasons:
  - Legacy maps, independent precision and residual response agree; unsupported rows remain unestimated.
  - Conditional covariance checks and noiseless native recovery pass at the recorded inputs; these do not certify
    the unknown extraction covariance.
- id: finite_support_and_pattern_review
  kind: evidence_support
  claim: finite_support_and_pattern
  claim_revision: '1'
  status: supported
  origin: reviewed
  subject: phase_diagnostics
  context: archived_two_night_phase_grid
  method:
    id: pinned_execution_and_scope_review
    revision: '1'
    description: Verify executed maps, covariances, finite controls and independent reviews; preserve the distinction
      between data patterns and calibrated physical attribution.
  evidence:
  - protocol
  - support
  - report
  - validation
  reasons:
  - Primary first-night complete blue/core/red counts are 58/74/83; second-night counts are 0/11/15.
  - The first-night 12-exposure candidate interval has combined B/C/R residuals +591/-585/-216 ppm and +402/-449/-223
    ppm in the two interleaves, with the same signs in each order.
  - The later partial blue statistic cannot establish a match of the complete blue peak.
- id: physical_phase_localization_review
  kind: evidence_support
  claim: physical_phase_localization
  claim_revision: '1'
  status: unknown
  origin: reviewed
  subject: phase_diagnostics
  context: archived_two_night_phase_grid
  method:
    id: pinned_execution_and_scope_review
    revision: '1'
    description: Verify executed maps, covariances, finite controls and independent reviews; preserve the distinction
      between data patterns and calibrated physical attribution.
  evidence:
  - report
  - support
  - uncertainty
  - response
  reasons:
  - The candidate blue-core residual is 1176/852 ppm with conditional errors 355/345 ppm, but fixed-planet
    block proxies span 544 to 1052 and 386 to 901 ppm; few effective blocks and unknown covariance prevent
    calibrated significance.
  - The 0.35 to 0.375 pattern is pixel-sensitive. The matched-window core night difference remains -936/-758
    ppm, but its block-proxy intervals include zero and each night retains its own reference/GP history.
  - The 17 observed native rectangular corrections are full rank only within their assumed finite basis. Complete-band
    displays have rank 12 or 15, and intrinsic phase attribution remains nonunique.
follow_ups:
- id: independent_phase_and_night_controls
  target_kind: assessment
  target: physical_phase_localization_review
  action: Use the complete 0.3761 to 0.3932 blue/core residual as a conditional diagnostic target while obtaining
    independently calibrated covariance and repeated phase/night controls.
  requires:
  - Independent stellar/telluric or pre-master data and additional repeated early-phase or eclipse controls.
  - Covariance calibration independent of the same short phase-residual segments; compare any physical revision
    on all native data.
  completion: Record new physical-localization evidence and a scoped Assessment; do not promote the present
    sign pattern or selected-phase fit to a calibrated detection.
  sources:
  - mceg/contracts/escape.halpha_data_audit.yaml
decisions:
- id: conditional_phase_targets
  revision: '1'
  question: How should the phase-resolved residual guide model work?
  scope: This fixed-atmosphere two-night diagnostic.
  options:
  - id: conditional_targets
    description: Retain complete-band conditional targets and missing-support/uncertainty limitations; keep
      all native data for model comparison.
  - id: unique_physical_transition
    description: Treat the fine-bin profile or matched-night difference as an established physical transition.
  selected: conditional_targets
  reasons:
  - Support boundaries are verified and residual signs are localized, but phase significance and intrinsic
    attribution remain unresolved.
  basis:
  - kind: assessment
    id: physical_phase_localization_review
    sha256: ec30efd0abaabc7c65fce270f93b7789a0cccfa896f37a4a7fabaf6370bede46
  limitations:
  - No new data cut, atmosphere, posterior or production likelihood is adopted; prior numerical and fit assessments
    remain unchanged.
  reconsider_when:
  - Independent covariance and repeated-phase controls establish separation from reduction and night variability.
  subject: phase_diagnostics
  context: archived_two_night_phase_grid
