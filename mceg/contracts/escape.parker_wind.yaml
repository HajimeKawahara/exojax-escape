decisions:
- id: prescribed_thermal_closure
  revision: '1'
  question: Which thermal closure is recorded for the existing wind?
  scope: Existing wind model only; records an approximation, not its validation.
  options:
  - id: prescribed_temperature
    description: Supply T(r) and constant mu as inputs.
  - id: self_consistent_energy
    description: Solve thermal balance and ionization-dependent mu.
  selected: prescribed_temperature
  reasons:
  - This describes the existing differentiable solver and isolates wind numerics before adding energy/chemistry
    coupling.
