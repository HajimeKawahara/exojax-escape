    sha256: ee930197ad3a946daa981d37e94efc270d4e5330ca08a0c65deb7acdab5d5d9c
  limitations:
  - Accuracy away from r much smaller than orbital separation and the axis is unknown.
  reconsider_when:
  - A declared target regime requires full Roche geometry or a benchmark exposes material geometric error.
  subject: wind_implementation_310a434
  context: wind_formulation
