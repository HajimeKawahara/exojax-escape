    sha256: ee930197ad3a946daa981d37e94efc270d4e5330ca08a0c65deb7acdab5d5d9c
  limitations:
  - This choice does not establish atmospheric physical accuracy.
  reconsider_when:
  - Energy/ionization coupling is implemented or a matched benchmark rejects the closure.
  subject: wind_implementation_310a434
  context: wind_formulation
- id: linear_tidal_geometry
  revision: '1'
  question: How is the existing stellar tide represented?
  scope: Existing wind model only; records an approximation, not its validation.
  options:
  - id: linear_axis_tide
    description: Add kappa r to outward acceleration while retaining spherical continuity.
  - id: full_roche_flow
    description: Solve flow with Roche geometry and an appropriate area law.
  selected: linear_axis_tide
  reasons:
  - The existing solver and tests explicitly implement the leading linear axis term.
  basis:
  - kind: assessment
    id: formulation_review
    sha256: d8f1450cca88442247f52ceb84fec67547ede79e5cc4e325bf7a8ce563a29223
  - kind: assessment
