schema_version: '0.4'
model:
  id: escape.parker_wind
  name: Prescribed-temperature Parker wind with optional linear tides
  description: Existing isothermal and nonisothermal transonic wind equations, numerical verification
    and implicit gradients. Temperature and constant mu are inputs; physical accuracy is unresolved.
  implementation: &id002
    repository: https://github.com/HajimeKawahara/exojax-escape
    revision: 310a434896e2c3339929f7a790d27721d2ea6e1a
    entry_points:
    - src/escape/parker.py:sonic_radius_cm
    - src/escape/parker.py:_log_mach
    - src/escape/parker.py:_log_mach_jvp
    - src/escape/parker.py:parker_velocity
    - src/escape/nonisothermal.py:_chebyshev_grid
    - src/escape/nonisothermal.py:nonisothermal_parker_velocity
assumptions:
- statement: Steady radial flow, ideal-gas pressure, spherical mass conservation, prescribed smooth positive
    T(r), and constant positive mu.
  evidence:
  - formulation
  - implementation
- statement: Optional nonnegative kappa adds the linear star-planet-axis tide to spherical momentum; no
    full Roche geometry or self-consistent thermal/ionization closure.
  evidence:
  - formulation
  - tidal_reference
domains:
- kind: numerical_evaluation
  status: documented
  description: Solver obligations, distinct from the discrete numerical test samples.
  conditions:
  - Float64; positive radius, mass, mu and temperature; nonnegative finite kappa.
  - Nonisothermal query radii inside the supplied positive interval; odd ngrid >=17.
  - One regular critical point and a no-tide isothermal initializer critical point inside the interval;
    nonsingular residual Jacobian for implicit derivatives.
  evidence:
  - formulation
  - implementation
- kind: scientific_applicability
  status: unknown
  description: No atmosphere-level comparison establishes the accuracy of prescribed T, fixed mu or a
    linear tide with spherical continuity.
  conditions: []
  evidence:
  - formulation
claims:
- id: formulation_correspondence
  revision: '1'
  kind: theoretical
  statement: The recorded equations and unit mappings describe the selected existing wind implementation.
  scope: Source/algebra correspondence only, including the numerical closure and output conversion.
  equations: &id001
  - id: wind_momentum
    revision: '1'
  - id: isothermal_limit
    revision: '1'
  - id: dimensionless_wind
    revision: '1'
  - id: sonic_regularity
    revision: '1'
  - id: collocation
    revision: '1'
  - id: implicit_derivative
    revision: '1'
  - id: velocity_output
    revision: '1'
- id: numerical_verification
  revision: '1'
  kind: numerical_verification
  statement: The selected wind implementations pass the retained analytic-limit, independent-ODE, regularity
    and gradient tests.
  scope: Only the exact 25 tests and their tolerances at recorded samples; no continuous parameter envelope
    or NUTS posterior guarantee.
  equations: *id001
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The adopted prescribed-temperature, fixed-mu wind and linear tide are physically adequate
    for the target escaping atmosphere.
  scope: Intended-use question; no quantitative independent atmospheric benchmark or tolerance is established.
  equations: []
evidence:
- id: formulation
  kind: theory
  summary: Provider-derived wind equations and explicit closure assumptions.
  sources:
  - doc/parker_wind.tex
  - doc/parker_wind_equations.tex
  - doc/parker_wind.pdf
  - mceg/evidence/parker_wind_20261121/review.json
  scope: Algebra/source correspondence only; no physical calibration.
  subject: wind_implementation_310a434
  context: wind_formulation
  provenance:
    role: primary
    location: Authored TeX, generated equation appendix and retained review
    inspection: inspected
    note: Continuity/momentum reduction, sonic limit, collocation, units and implicit derivative were
      compared with the pinned implementation. PDF and generated-byte checks are recorded in the review.
  artifacts:
  - source: doc/parker_wind.tex
    sha256: ee7ab19a6cc264d9b7410d2289c41535abac2ba836a216c3a5b298ad1752aba0
  - source: doc/parker_wind_equations.tex
    sha256: fb7bcec7ad13c55abe8ee472e08d295fba272c119f93b612fc1a8895369431e4
  - source: doc/parker_wind.pdf
    sha256: c32117be2c8ec042ff1ae84a0a8be5d644559c3ade965f3c902981681189bfb7
  - source: mceg/evidence/parker_wind_20261121/review.json
    sha256: fd3db6b267ee09d04b30a0e74283ebe0fbb4275918d67546b808b2d543fcfd58
- id: implementation
  kind: implementation
  summary: Pinned existing wind implementations and their numerical tests.
  sources:
  - src/escape/parker.py
  - src/escape/nonisothermal.py
  - tests/test_parker.py
  - tests/test_nonisothermal_parker.py
  scope: Source identity; this update does not change scientific code.
  subject: wind_implementation_310a434
  artifacts:
  - source: src/escape/parker.py
    sha256: 0d6b340dd3c47895117b6aa0fbf156ca9eb3f04588170ea99ef7858766004a1e
  - source: src/escape/nonisothermal.py
    sha256: 35ab60f683ca96ceda895b186406f481aad3563c6c27e7b8af1a8c4715e1c529
  - source: tests/test_parker.py
    sha256: 6117aba4be4b72fa2c96f105c3648a0945e8be0f755ddef0997795739f85c2af
  - source: tests/test_nonisothermal_parker.py
    sha256: d7a0cc937f02ae8af623690fc776ad88521964ade7887b60483859c9a8365c27
  provenance:
    role: implementation
    location: Selected files at revision 310a434896e2c3339929f7a790d27721d2ea6e1a
    inspection: inspected
    note: Source hashes match the repository revision; only the listed files define this subject.
- id: cranmer
  kind: literature
  summary: Cranmer (2004), New views of the solar wind with the Lambert W function, American Journal of
    Physics 72, 1397; DOI 10.1119/1.1775242.
  sources:
  - https://arxiv.org/pdf/astro-ph/0406176
  - https://doi.org/10.1119/1.1775242
  scope: 'Eqs9,11-16: spherical continuity, pressure law and isothermal critical/Lambert-W solution. No
    general-T or tidal validation inferred.'
  provenance:
    role: primary
    location: Eqs9,11-16
    inspection: partial
    note: Relevant primary-source equation sections inspected on 2026-11-21; generalized temperature and
      tide algebra are authored here.
- id: tidal_reference
  kind: implementation
  summary: The official p-winds isothermal tidal implementation uses the same linear stellar coefficient.
  sources:
  - https://p-winds.readthedocs.io/en/latest/_modules/parker.html
  scope: Source comparison of radius_sonic_point_tidal and structure_tidal; not a p-winds execution or
    full Roche model.
  provenance:
    role: implementation
    location: radius_sonic_point_tidal and structure_tidal
    inspection: partial
    note: Inspected 2026-11-21. The integrated potential term has coefficient 3 G Mstar/(2 a_orbit^3);
      its radial derivative supplies kappa r.
- id: wind_tests
  kind: numerical_test
  summary: 25 existing Parker/nonisothermal/tidal tests passed on CPU in float64.
  sources:
  - mceg/evidence/parker_wind_20261121/receipt.json
  - mceg/evidence/parker_wind_20261121/tests.log
  - mceg/evidence/parker_wind_20261121/tests.xml
  - mceg/evidence/parker_wind_20261121/review.json
  scope: 'Exactly the pinned tests and their samples/tolerances: analytic limits, independent sonic shooting,
    sonic regularity, parameter gradients, 129/257-node refinement and invalid-input rejection.'
  result: passed
  subject: wind_implementation_310a434
  context: wind_test_samples
  artifacts:
  - source: mceg/evidence/parker_wind_20261121/receipt.json
    sha256: 1d2b17bb1acd400ecc01a639f9e2167e55600fc0c5a058714ebd91bab696c828
  - source: mceg/evidence/parker_wind_20261121/tests.log
    sha256: aa261c3cf54ce72ff8878709bc40157d1e5627b910a2931cbff96d44139c1b7b
  - source: mceg/evidence/parker_wind_20261121/tests.xml
    sha256: 9e802da64690ad183b44132bc363240731895643f08cbdf9471bf602946643b5
  - source: mceg/evidence/parker_wind_20261121/review.json
    sha256: fd3db6b267ee09d04b30a0e74283ebe0fbb4275918d67546b808b2d543fcfd58
  provenance:
    role: primary
    location: mceg/evidence/parker_wind_20261121/receipt.json
    inspection: inspected
    note: Actual execution retained; independent shooting tests use the same prescribed-temperature ODE,
      so they establish numerical agreement rather than atmospheric physical validity.
limitations:
- statement: Independent numerical shooting solves the same reduced equations; agreement does not validate
    temperature, constant mu, tide geometry or KELT-9b spectra.
  evidence:
  - wind_tests
  - formulation
- statement: No energy balance, variable-mu feedback, multidimensional Roche flow, shocks or general multiple-critical-point
    selection is implemented.
  evidence:
  - formulation
  - implementation
subjects:
- id: wind_implementation_310a434
  implementation: *id002
  selected_files:
    src/escape/parker.py: 0d6b340dd3c47895117b6aa0fbf156ca9eb3f04588170ea99ef7858766004a1e
    src/escape/nonisothermal.py: 35ab60f683ca96ceda895b186406f481aad3563c6c27e7b8af1a8c4715e1c529
    tests/test_parker.py: 6117aba4be4b72fa2c96f105c3648a0945e8be0f755ddef0997795739f85c2af
    tests/test_nonisothermal_parker.py: d7a0cc937f02ae8af623690fc776ad88521964ade7887b60483859c9a8365c27
contexts:
- id: wind_formulation
  scope: Declared equations and implementation correspondence for both no-tide and tidal branches.
  settings:
    temperature: prescribed smooth function or positive constant
    mean_molecular_weight: constant
    geometry: spherical continuity; optional linear axis tide
    output_velocity_unit: km/s
- id: wind_test_samples
  scope: Exact samples and tolerances in the two pinned test files, not their Cartesian product.
  settings:
    tests: 25
    device: cpu
    float64: true
    nonisothermal_planet_mass_mj: 2.17
    nonisothermal_base_radius_rj: 1.9
    nonisothermal_outer_radius_rp: 32
    nonisothermal_mu: 0.6666666666666666
    nonisothermal_default_ngrid: 129
    refined_ngrid: 257
    temperature_cases: rising profiles, constant temperatures and one cooling power law; exact inputs
      in pinned tests
    tidal_case: kappa=3*(2*pi/(1.48*86400 s))^2 or zero; perturbations and invalid cases in tests
- id: target_atmosphere
  scope: Physical adequacy for hydrogen escape; not assessed by these reduced-equation tests.
  settings:
    validation: no independent atmospheric benchmark
equations:
- id: wind_momentum
  revision: '1'
  latex: 'a^2=\frac{k_{\rm B}T(r)}{\mu m_{\rm p}},\quad P=\rho a^2,\quad 4\pi r^2\rho v=\dot M,\\

    \kappa=\frac{3GM_\star}{a_{\rm orb}^3},\quad g_{\rm eff}=\frac{GM_{\rm p}}{r^2}-\kappa r,\\

    \left(v-\frac{a^2}{v}\right)\frac{dv}{dr}=\frac{2a^2}{r}-\frac{da^2}{dr}-g_{\rm eff}'
  description: Pressure, steady spherical continuity and prescribed-temperature momentum balance.
  scope: Constant mu; optional linear tide along the star-planet axis, combined with spherical continuity.
  symbols:
    radius:
      latex: r
      description: Radius
      unit: cm
    temperature:
      latex: T
      description: Prescribed temperature
      unit: K
    mu:
      latex: \mu
      description: Mean particle mass in proton-mass units
      unit: '1'
    mass:
      latex: M_{\rm p}
      description: Planet mass
      unit: g
    tide:
      latex: \kappa
      description: Supplied tidal coefficient
      unit: s^-2
    velocity:
      latex: v
      description: Internal radial velocity
      unit: cm s^-1
    sound_speed:
      latex: a
      description: Local isothermal sound speed
      unit: cm s^-1
    density:
      latex: \rho
      description: Mass density; normalization not determined by the velocity solver
      unit: g cm^-3
  assumptions:
  - The caller supplies kappa; the wind API does not infer stellar mass or orbital separation.
  - The stellar-mass-dominated, r much smaller than orbital separation expansion is not full Roche geometry.
  - Temperature is supplied and mu is fixed. No energy or ionization closure is solved.
  evidence:
  - formulation
  - cranmer
  - tidal_reference
- id: isothermal_limit
  revision: '1'
  latex: 'r_{\rm s}=\frac{GM_{\rm p}\mu m_{\rm p}}{2k_{\rm B}T},\quad t=\ln(r/r_{\rm s}),\quad z=\ln(v/a),\\

    e^{2z}-2z-1=4(t+e^{-t}-1),\quad \operatorname{sign}z=\operatorname{sign}t,\\

    \frac{dz}{dt}=\frac{2(1-e^{-t})}{e^{2z}-1},\qquad \left.\frac{dz}{dt}\right|_{t=0}=1'
  description: No-tide isothermal Parker branch and its regular derivative.
  scope: The analytic-limit implementation solves the scalar implicit relation by bisection; it does not
    call Lambert W.
  symbols:
    radius:
      latex: r
      description: Radius
      unit: cm
    sonic_radius:
      latex: r_{\rm s}
      description: Isothermal sonic radius
      unit: cm
    temperature:
      latex: T
      description: Constant temperature
      unit: K
    mass:
      latex: M_{\rm p}
      description: Planet mass
      unit: g
    mu:
      latex: \mu
      description: Mean particle mass in proton-mass units
      unit: '1'
    coordinate:
      latex: t
      description: Log radius divided by sonic radius
      unit: '1'
    log_mach:
      latex: z
      description: Log Mach number
      unit: '1'
  assumptions:
  - Float64 and positive inputs; the accelerating wind branch is selected.
  - A fifth-order sonic series for |t|<1e-3 avoids cancellation; custom JVP uses its derivative.
  evidence:
  - formulation
  - cranmer
- id: dimensionless_wind
  revision: '1'
  latex: 'x=\ln(r/R),\quad L=\ln(r_{\rm out}/R),\quad a_{\rm ref}^2=\frac{k_{\rm B}T(r_{\rm out})}{\mu
    m_{\rm p}},\\

    s_\lambda=1+\lambda\left[\frac{T(Re^x)}{T(r_{\rm out})}-1\right],\quad \beta_\lambda=\frac{\partial\ln
    s_\lambda}{\partial x},\\

    A=\frac{GM_{\rm p}}{Ra_{\rm ref}^2},\quad B=\frac{\kappa R^2}{a_{\rm ref}^2},\quad q=\ln\frac{v}{a_{\rm
    ref}\sqrt{s_\lambda}},\\

    N_\lambda=2-\beta_\lambda-\frac{Ae^{-x}}{s_\lambda}+\frac{\lambda Be^{2x}}{s_\lambda},\\

    (e^{2q}-1)\left(q_x+\frac{\beta_\lambda}{2}\right)-N_\lambda=0'
  description: Dimensionless residual and continuation from the isothermal no-tide wind.
  scope: The target model is lambda=1. Intermediate lambda values are numerical initialization only.
  symbols:
    radius:
      latex: r
      description: Radius
      unit: cm
    base:
      latex: R
      description: Inner domain radius
      unit: cm
    outer:
      latex: r_{\rm out}
      description: Outer domain radius
      unit: cm
    coordinate:
      latex: x
      description: Log radius relative to the inner boundary
      unit: '1'
    continuation:
      latex: \lambda
      description: Continuation fraction
      unit: '1'
    sound_ratio:
      latex: s_\lambda
      description: Squared sound speed divided by its reference value
      unit: '1'
    log_mach:
      latex: q
      description: Log Mach number
      unit: '1'
    numerator:
      latex: N_\lambda
      description: Dimensionless momentum numerator
      unit: '1'
  assumptions:
  - Eight continuation steps; default 129 total collocation nodes.
  - Reference temperature is evaluated at the outer boundary, not at the sonic point.
  evidence:
  - formulation
- id: sonic_regularity
  revision: '1'
  latex: 'N_\lambda(x_{\rm c})=0,\quad q(x_{\rm c})=0,\quad N_{\lambda,x}(x_{\rm c})>0,\\

    q_{x,{\rm c}}=\frac{-\beta_{\lambda,{\rm c}}+\sqrt{\beta_{\lambda,{\rm c}}^2+8N_{\lambda,x}(x_{\rm
    c})}}{4},\\

    \left.\frac{d\ln v}{d\ln r}\right|_{\rm c}=q_{x,{\rm c}}+\frac{\beta_{\lambda,{\rm c}}}{2}'
  description: Regular transonic critical point and slope.
  scope: One negative-to-positive numerator root in the supplied radial interval.
  symbols:
    critical:
      latex: x_{\rm c}
      description: Log critical radius
      unit: '1'
    numerator:
      latex: N_\lambda
      description: Dimensionless numerator
      unit: '1'
    beta:
      latex: \beta_\lambda
      description: Log sound-speed-squared slope
      unit: '1'
    log_mach:
      latex: q
      description: Log Mach number
      unit: '1'
  assumptions:
  - The implementation also requires subsonic inner and supersonic outer branches.
  - The no-tide isothermal initializer critical point must lie inside the domain.
  evidence:
  - formulation
- id: collocation
  revision: '1'
  latex: '\xi_i=\frac{1-\cos(\pi i/(m-1))}{2},\quad i=0,\ldots,m-1,\\

    x_i^-=x_{\rm c}\xi_i,\qquad x_i^+=x_{\rm c}+(L-x_{\rm c})\xi_i,\\

    \mathcal R_i=(e^{2q_i}-1)\left[(D_xq)_i+\frac{\beta_i}{2}\right]-N_i=0,\\

    \mathcal R_{\rm c}\leftarrow q_{\rm c},\quad

    \mathcal R_0\leftarrow(D_x^-q)_{\rm c}-q_{x,{\rm c}},\quad

    \mathcal R_{n-1}\leftarrow(D_x^+q)_{\rm c}-q_{x,{\rm c}}'
  description: Two Chebyshev-Lobatto pieces joined at the critical point.
  scope: 'The repeated critical node is stored once: total n=2m-1. The displayed first/last replacements
    are residual rows, not imposed endpoint velocities.'
  symbols:
    grid_size:
      latex: n
      description: Odd total node count; at least 17
      unit: '1'
    coordinate:
      latex: x
      description: Log radial coordinate
      unit: '1'
    critical:
      latex: x_{\rm c}
      description: Log critical radius
      unit: '1'
    derivative:
      latex: D_x
      description: Barycentric derivative matrix rescaled to each log-radius interval
      unit: '1'
    log_mach:
      latex: q
      description: Collocated log Mach number
      unit: '1'
    residual:
      latex: \mathcal R
      description: Discrete momentum and regularity residual
      unit: '1'
  assumptions:
  - A damped Newton solve follows continuation; accepted residual infinity norm must be below 1e-8.
  - This is a discretized ODE, not an exact continuum solution.
  evidence:
  - formulation
- id: implicit_derivative
  revision: '1'
  latex: '\frac{dx_{\rm c}}{d\theta}=-\frac{N_\theta}{N_x},\qquad

    \frac{dq}{d\theta}=-\mathcal R_q^{-1}\left(\mathcal R_\theta+\mathcal R_{x_{\rm c}}\frac{dx_{\rm c}}{d\theta}\right)'
  description: Implicit derivatives of the critical point and the converged discrete wind.
  scope: At lambda=1; partial derivatives include prescribed-temperature parameters, mass, mu, tide and
    domain bounds.
  symbols:
    parameters:
      latex: \theta
      description: One physical input parameter; units depend on parameter
      unit: parameter dependent
    critical:
      latex: x_{\rm c}
      description: Log critical radius
      unit: '1'
    log_mach:
      latex: q
      description: Vector of collocated log Mach numbers
      unit: '1'
    residual:
      latex: \mathcal R
      description: Discrete residual including both moving grids
      unit: '1'
  assumptions:
  - jax.lax.custom_root differentiates the residual equations, not bisection or Newton iterations.
  - The scalar critical slope and the discrete residual Jacobian must be nonsingular.
  - The output interpolation and sound-speed factor are differentiated as well.
  evidence:
  - formulation
- id: velocity_output
  revision: '1'
  latex: v_{\rm out}(r)=10^{-5}\sqrt{\frac{k_{\rm B}T(r)}{\mu m_{\rm p}}}\,\exp q(\ln(r/R))\quad[\mathrm{km\,s^{-1}}]
  description: Public output converts cgs sound speed and velocity to km/s.
  scope: For the analytic isothermal function, use z(ln(r/r_s)) in place of q(ln(r/R)), with constant
    T.
  symbols:
    radius:
      latex: r
      description: Requested radius
      unit: cm
    temperature:
      latex: T
      description: Prescribed or constant temperature
      unit: K
    mu:
      latex: \mu
      description: Mean particle mass in proton-mass units
      unit: '1'
    velocity_kms:
      latex: v_{\rm out}
      description: Returned radial velocity
      unit: km s^-1
    log_mach:
      latex: q
      description: Interpolated log Mach number
      unit: '1'
  assumptions:
  - Nonisothermal values use piecewise Chebyshev interpolation inside the domain.
  - Invalid or unconverged nonisothermal solutions return NaN; diagnostics are available with return_info=True.
  evidence:
  - formulation
bindings:
- id: wind_balance
  equation:
    id: wind_momentum
    revision: '1'
  subject: wind_implementation_310a434
  source: src/escape/nonisothermal.py
  symbol: nonisothermal_parker_velocity
  arguments:
    radius_cm:
      symbol: radius
    mean_molecular_weight:
      symbol: mu
    tidal_coefficient_s2:
      symbol: tide
  note: temperature_fn(r, temperature_params) supplies T in K. planet_mass_mj times exojax.utils.constants.MJ
    gives Mp in g. The function uses kappa as supplied; it does not derive orbital parameters. Internal
    momentum variables are cgs; public output is km/s.
- id: analytic_sonic_radius
  equation:
    id: isothermal_limit
    revision: '1'
  subject: wind_implementation_310a434
  source: src/escape/parker.py
  symbol: sonic_radius_cm
  arguments:
    temperature_k:
      symbol: temperature
    mean_molecular_weight:
      symbol: mu
  note: planet_mass_mj is converted to grams with exojax.utils.constants.MJ; output is cm.
  result: sonic_radius
- id: analytic_log_mach
  equation:
    id: isothermal_limit
    revision: '1'
  subject: wind_implementation_310a434
  source: src/escape/parker.py
  symbol: _log_mach
  arguments:
    t:
      symbol: coordinate
  note: 64 bisections select the branch; _sonic_series supplies the near-sonic value.
  result: log_mach
- id: analytic_log_mach_jvp
  equation:
    id: isothermal_limit
    revision: '1'
  subject: wind_implementation_310a434
  source: src/escape/parker.py
  symbol: _log_mach_jvp
  arguments: {}
  note: The primals/tangents tuples carry t and its perturbation. A custom JVP uses the displayed derivative
    or the sonic-series derivative; these tuple arguments have no scalar unit mapping.
- id: wind_residual
  equation:
    id: dimensionless_wind
    revision: '1'
  subject: wind_implementation_310a434
  source: src/escape/nonisothermal.py
  symbol: nonisothermal_parker_velocity
  arguments:
    radius_cm:
      symbol: radius
    base_radius_cm:
      symbol: base
    outer_radius_cm:
      symbol: outer
  note: Nested sound_squared, numerator, critical_point and residual closures use the displayed dimensionless
    variables; continuation includes temperature and the tide.
- id: wind_critical_point
  equation:
    id: sonic_regularity
    revision: '1'
  subject: wind_implementation_310a434
  source: src/escape/nonisothermal.py
  symbol: nonisothermal_parker_velocity
  arguments: {}
  note: Nested critical_point solves numerator=0 using a scalar custom_root; residual replaces the sonic
    and endpoint rows with regularity constraints. critical_slope in diagnostics is N_x, not dv/dr.
- id: chebyshev_nodes
  equation:
    id: collocation
    revision: '1'
  subject: wind_implementation_310a434
  source: src/escape/nonisothermal.py
  symbol: _chebyshev_grid
  arguments: {}
  note: size is the per-piece node count m=(n+1)/2. Returned derivative matrix acts on xi; the enclosing
    solver divides by x_c or L-x_c.
- id: wind_collocation
  equation:
    id: collocation
    revision: '1'
  subject: wind_implementation_310a434
  source: src/escape/nonisothermal.py
  symbol: nonisothermal_parker_velocity
  arguments:
    ngrid:
      symbol: grid_size
  note: Nested grid and residual assemble two pieces with one shared sonic node. The n-vector custom_root
    solves the complete row-replaced residual.
- id: wind_implicit_gradient
  equation:
    id: implicit_derivative
    revision: '1'
  subject: wind_implementation_310a434
  source: src/escape/nonisothermal.py
  symbol: nonisothermal_parker_velocity
  arguments: {}
  note: Nested scalar and vector custom_root tangent solves differentiate N and R. The outer derivative
    includes dependence on x_c, the two grids, spectral interpolation and the physical inputs. No differentiation
    through convergence iterations is claimed.
- id: analytic_velocity_units
  equation:
    id: velocity_output
    revision: '1'
  subject: wind_implementation_310a434
  source: src/escape/parker.py
  symbol: parker_velocity
  arguments:
    radius_cm:
      symbol: radius
    temperature_k:
      symbol: temperature
    mean_molecular_weight:
      symbol: mu
