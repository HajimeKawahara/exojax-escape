schema_version: '0.4'
model:
  id: escape.nlte_spectrum
  name: Extended local hydrogen atom connected to an observer spectrum
  description: Prescribed-temperature Parker wind, charge-conserving local populations through n=15, branch
    lifetimes and existing ExoJAX transfer. Numerical verification is distinct from atmospheric validation.
  implementation:
    repository: https://github.com/HajimeKawahara/exojax-escape
    revision: a2ff2e7dc3728600bdfcfdfb2309467dda6335b4
    entry_points:
    - src/escape/nlte_forward.py:HydrogenNLTEForwardModel.population_profiles
    - src/escape/hydrogen_atom.py:atom_natural_width_hz
    - src/escape/nlte_forward.py:halpha_coefficients
    - src/escape/nlte_forward.py:HydrogenNLTEForwardModel._line_profiles
    - src/escape/hydrogen_forward.py:HydrogenForwardModel._transfer_line_coefficients
    - tools/verify_nlte_spectrum.py:uncertainty_scaled_difference
assumptions:
- statement: Temperature, constant wind molecular weight and unattenuated diluted blackbody irradiation
    are inputs. Ionization does not feed back into wind pressure; no thermal balance or advected populations
    are solved.
  evidence:
  - formulation
- statement: The first six states are resolved; n=4..N are statistical shells. H-alpha branches share
    one NIST center and have separate thermal/natural profiles. Stark, self-broadening, fine-structure
    centers and microturbulence are omitted.
  evidence:
  - formulation
  - lifetime_reference
domains:
- kind: numerical_evaluation
  status: documented
  description: Finite sampled numerical checks, with no continuous prior-domain guarantee.
  conditions:
  - Float64, valid transonic wind and atomic-data temperature domain; positive mass loss and irradiation
    dilution.
  - Converged local charge roots and positive total frequency-dependent extinction on every evaluated
    ray.
  evidence:
  - formulation
- kind: scientific_applicability
  status: unknown
  description: Numerical convergence alone does not validate the geometry, omitted broadening, prescribed
    fields or the observation processing model.
  conditions: []
  evidence:
  - formulation
claims:
- id: formulation_correspondence
  revision: '1'
  kind: theoretical
  statement: The recorded equations describe the extended atom to observer-spectrum connection and declared
    source correspondences.
  scope: Algebra and implementation correspondence; not physical adequacy.
  equations:
  - id: local_population_map
    revision: '1'
  - id: branch_profiles
    revision: '1'
  - id: observer_transfer
    revision: '1'
- id: differentiable_spectrum
  revision: '1'
  kind: numerical_verification
  statement: The retained complete-spectrum forward/reverse derivatives agree with the declared finite-difference
    checks and the layer population tests pass.
  scope: Only recorded samples, parameter directions, numerical tolerances and software environment; no
    posterior-convergence claim.
  equations:
  - id: local_population_map
    revision: '1'
  - id: observer_transfer
    revision: '1'
- id: resolved_spectrum
  revision: '1'
  kind: numerical_verification
  statement: Each declared independent or joint refinement changes every sampled observer pixel by less
    than 0.1 times its supplied observational uncertainty.
  scope: Atom size, atmospheric layers, disk quadrature, wavelength, continuum and wind grids at seven
    declared conditions. Initial candidates test six independent axes; the final candidate also refines
    all six together. Uncertainties supply a numerical scale, not a validated likelihood.
  equations:
  - id: resolution_criterion
    revision: '1'
- id: atmospheric_accuracy
  revision: '1'
  kind: physical_validation
  statement: The complete model is physically adequate for inference from the processed KELT-9b H-alpha
    observation.
  scope: Intended-use question requiring an observation operator and independent atmospheric validation;
    not established by local Cloudy comparisons or numerical refinements.
  equations: []
evidence:
- id: formulation
  kind: theory
  summary: Authored equations for the population-to-observer connection and explicit assumptions.
  sources:
