limitations:
- statement: A shared unresolved center omits an approximately 5.3 km/s branch-center span. Pressure broadening
    is not established negligible; the lifetime correction is not a complete line-shape validation.
  evidence:
  - formulation
- statement: Single-phase plane-parallel observer columns and prescribed fields do not reproduce phase
    averaging, master-spectrum processing, a spherical extended halo or a self-consistent escaping atmosphere.
  evidence:
  - formulation
