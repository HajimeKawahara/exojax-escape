decisions:
- id: observer_layer_count
  revision: '1'
  question: Which layer count should the verified observer example use?
  scope: The declared prescribed-temperature profile, seven cases and remaining fixed grids; not a universal
    resolution for future atmospheres.
  options:
  - id: retain_32
    description: Retain the cheaper 32-layer grid despite its measured failure.
  - id: use_64
    description: Use 64 layers despite its smaller but still excessive refinement error.
  - id: use_128
    description: Use 128 layers, checked against 256 layers and a joint refinement.
  selected: use_128
  reasons:
  - The 32- and 64-layer candidates fail the fixed 0.1-uncertainty criterion. The 128-layer candidate
    passes every declared refinement without changing that criterion.
  basis:
  - kind: assessment
    id: coarse_resolution_review
    sha256: 8144f24faad4769a2a4cb998a50f60886e4940fb8963edea6b3d7d35fbbc6393
  - kind: assessment
    id: intermediate_resolution_review
    sha256: 947b8f5029a4dde1eac7e74f53f6c0172c8af71ec17b3c6bcc0a6d974999c74c
  - kind: assessment
    id: resolution_review
    sha256: 781443dc2c28d06d41d0dba14723e36b3e1ef0f7f233c536a12cc46a911efcc0
  - kind: assessment
    id: gradient_review
    sha256: ae8f465588d3ebd3bac893e48e9e3c4dcaad60a9ca3c2885ee3f19d99043bb84
  limitations:
  - Only finite sampled numerical accuracy is supported. The atmosphere, line-center splitting, pressure
    broadening and data-processing likelihood remain separate questions.
  reconsider_when:
  - A new temperature law or physical parameter sample exceeds the same refinement criterion.
  - A changed observation operator or uncertainty scale requires greater numerical precision.
  subject: spectrum_implementation
  context: sampled_numerics
- id: prescribed_field_use
  revision: '1'
  question: How may the current uniform radiation closure be used while its atmospheric effect is unverified?
  scope: The current spectrum implementation and prescribed_field_application context; this is a provisional
    use decision, not a physical validation.
  options:
  - id: exploration_only
    description: Retain the closure for numerical development and exploratory spectra while tracing radiation-feedback
      and observation-processing work.
  - id: physical_inference
    description: Treat fitted physical parameters as validated atmospheric inferences.
  selected: exploration_only
  reasons:
  - The implementation and numerical behavior are explicit, but the retained thick Lyman columns remove
    an optically thin justification for unchanged irradiation in those samples.
  - The size of the resulting H-alpha error is unknown; a controlled coupling comparison must precede
    a physical-use endorsement.
  basis:
  - kind: assessment
    id: prescribed_field_review
    sha256: 84554be4ddf3bc68292537c7d063fad9bafb46a7bbac32233985853e515f1734
  limitations:
  - No support is added to prescribed_field_adequacy or atmospheric_accuracy by this decision.
  - Exploratory or synthetic-data sampler tests do not license physical parameter interpretation from
    the observed spectrum.
  reconsider_when:
  - The matched radiation/population comparison and its physical error budget have been reviewed.
  - The density/temperature domain, incident spectrum, transfer closure or intended use changes.
  subject: spectrum_implementation
  context: prescribed_field_application
follow_ups:
- id: test_radiation_feedback
  target_kind: assessment
  target: prescribed_field_review
  action: Compare the prescribed-field closure with coupled radiation and statistical equilibrium at the
    same density, temperature, incident spectrum, atomic data and observer settings. Check a matched optically
    thin limit and the retained thick-column atmosphere samples; compare J, ionization, n2/n3 and H-alpha
    spectra.
  requires:
  - A declared physical error budget and parameter domain, separate from the existing 0.1-sigma numerical
    criterion.
  - Specified boundary/angle conventions and an explicit assessment of static internal transfer versus
    moving observer transfer.
  - Converged spatial, frequency and atom controls, with failures and source identities retained.
  completion: Archive the controlled comparison and its own numerical Claim/Assessment, then review the
    implications for radiation-closure adequacy without inferring physical validation from numerical agreement
    alone. Preserve this unknown review and record remaining discrepancies with a further action or scoped
    use Decision; implementation or solver convergence alone is insufficient.
  sources:
  - mceg/evidence/radiation_review_20261123/review.json
- id: validate_observer_application
  target_kind: assessment
  target: atmospheric_review
  action: Evaluate the complete observer model for its intended use, separately tracking radiation closure,
    thermal/wind coupling, omitted opacity/geometry and observation processing. Recover or explicitly
    bound nightly-master and continuum processing before interpreting fitted physical parameters.
  requires:
  - The radiation-closure comparison from test_radiation_feedback.
  - A documented observation operator with cadence, masks, weights, stellar reference and an uncertainty/correlation
    assessment.
  - An explicit physical scope and independent atmospheric validation or a justified restricted-use Decision.
  completion: Record scoped validation evidence and a new atmospheric Assessment, or a Decision that states
    which conclusions remain unavailable. Numerical tests, a successful fit or sampler execution alone
    do not establish atmospheric adequacy.
  sources:
  - https://arxiv.org/html/2606.23899v1#S2
  - https://github.com/HajimeKawahara/exojax-escape/blob/ac918c30ba9f8ab5dc5f588c82ec495e902d915b/mceg/evidence/nlte_assumptions_20261123/investigation.yaml
