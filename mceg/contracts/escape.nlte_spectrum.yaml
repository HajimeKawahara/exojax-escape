- id: lifetime_reference
  kind: literature
  summary: Radiative level lifetime is the inverse of the total outgoing spontaneous decay rate.
  sources:
  - https://physics.nist.gov/Pubs/AtSpec/node18.html
  scope: NIST Eq. 27 and the distinction between level lifetime and one branch probability.
  provenance:
    role: primary
    location: Atomic Spectroscopy, Atomic Lifetimes, Eq. 27
    inspection: inspected
    note: The observer uses the same included-atom lifetime sum as the coupled line profiles, including
      the 2s two-photon decay.
  artifacts: []
