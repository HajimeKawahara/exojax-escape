equations:
- id: local_population_map
  revision: '1'
  latex: n_{\rm H}(r)=\frac{\dot M}{4\pi r^2m_{\rm H}v(r)},\quad \mathcal R(\boldsymbol n,n_e;T,J)=0,\quad
    n_e=n_p=n_{\rm H}-\sum_i n_i,\\ n_2=n_{2s}+n_{2p},\quad n_3=n_{3s}+n_{3p}+n_{3d},\quad \frac{d\boldsymbol
    x}{d\theta}=-\mathcal R_{\boldsymbol x}^{-1}\mathcal R_\theta
  description: A Parker velocity and mass continuity supply each layer density; the extended local atom
    solves charge and statistical equilibrium. Higher shells feed the low states but are not counted in
    n3. Implicit derivatives include electron-dependent rates. R denotes the complete independent residual,
    including the conservation closure; its state Jacobian is square.
  scope: The wind residual and atomic rates have separate wind and enlarged-atom contracts; x denotes
    the local solved state, not a new explicit time integrator.
  symbols:
    density:
      latex: n_{\rm H},n_i,n_e,n_p
      description: Nucleus and particle number densities
      unit: cm^-3
    radius:
      latex: r
      description: Radial coordinate
      unit: cm
    mass_loss:
      latex: \dot M
      description: Hydrogen mass loss rate
      unit: g s^-1
    speed:
      latex: v
      description: Radial wind speed
      unit: cm s^-1
    state:
      latex: \boldsymbol x
      description: Solved local state
      unit: model coordinates
    parameters:
      latex: \theta
      description: Differentiated physical parameters
      unit: parameter dependent
  assumptions:
  - Local statistical equilibrium with prescribed radiation and temperature; constant wind molecular weight
    remains external.
  - The prescribed temperature rises exponentially from its base with scale 0.12 Rp. Irradiation is an
    unattenuated diluted Planck field. Continuum integration uses Gauss-Legendre nodes in log frequency
    between ionization thresholds, truncated at 100 eV.
  evidence:
  - formulation
- id: branch_profiles
  revision: '1'
  latex: L_i=\sum_{j<i}A_{ij}+\delta_{i,2s}A_{2\gamma},\quad \gamma_{ul}=\frac{L_u+L_l}{4\pi c},\quad\int\phi_{ul}(\widetilde\nu)\,d\widetilde\nu=1,\\
    \alpha_{\widetilde\nu}=\sum_{ul}\frac{A_{ul}}{8\pi c\widetilde\nu_0^2} \left(\frac{g_u}{g_l}n_l-n_u\right)\phi_{ul},\quad
    j_{\widetilde\nu}=\sum_{ul}\frac{hc\widetilde\nu_0A_{ul}}{4\pi}n_u\phi_{ul}
  description: Sum branch extinction and emission before forming the source. Each Voigt profile uses full
    upper/lower radiative lifetimes and thermal Doppler broadening; normalization is over the infinite
    wavenumber domain, not the truncated plotting grid.
  scope: H-alpha 3s-to-2p, 3p-to-2s and 3d-to-2p at one common NIST center. Coefficients follow the ExoJAX
    wavenumber convention.
  symbols:
    lifetime_rate:
      latex: L_i
      description: Total spontaneous level depopulation rate
      unit: s^-1
    gamma:
      latex: \gamma_{ul}
      description: Natural Lorentz half width
      unit: cm^-1
    wavenumber:
      latex: \widetilde\nu
      description: Wavenumber
      unit: cm^-1
    profile:
      latex: \phi_{ul}
      description: Unit area wavenumber profile
      unit: cm
    extinction:
      latex: \alpha_{\widetilde\nu}
      description: Net absorption including stimulated emission
      unit: cm^-1
    emission:
      latex: j_{\widetilde\nu}
      description: Emissivity per unit wavenumber and solid angle
      unit: erg s^-1 cm^-2 sr^-1
    bound:
      latex: n_i
      description: Actual resolved state population
      unit: cm^-3
  assumptions:
  - No pressure broadening or branch-center splitting; no clipping of an inverted population.
  evidence:
  - formulation
  - lifetime_reference
- id: observer_transfer
  revision: '1'
  latex: S_{\widetilde\nu}=j_{\widetilde\nu}/\alpha_{\widetilde\nu},\quad I^{\rm out}_{\widetilde\nu}=I^{\rm
    bot}_{\widetilde\nu}e^{-\tau_{\rm tot}/\mu} +\sum_k S_{k,\widetilde\nu}e^{-\tau_{<k}/\mu}(1-e^{-\Delta\tau_k/\mu}),\\
    \Delta\tau_k=\alpha_{k,\widetilde\nu}\Delta r_k,\quad f_{\widetilde\nu}=\left(\frac{R_p}{R_*}\right)^2
    \frac{\mathcal G_R*\sum_q w_q(I^{\rm out}_{q,\widetilde\nu}-I^{\rm bot}_{\widetilde\nu})}{F_{*,\widetilde\nu}}
  description: Each surface patch projects radial, rotation and zonal velocities into its Doppler-shifted
    profiles. Existing ExoJAX intensity transfer integrates the layered column; visible disk weights and
    a Gaussian instrument kernel produce line contrast.
  scope: The NLTE observer requires strictly positive total extinction and rejects zero opacity even if
    emission is zero. Only the legacy known-source wrapper admits a vacuum and preserves its zero-column
    derivative. Emitting zero-opacity layers and net gain are unsupported.
  symbols:
    intensity:
      latex: I
      description: Specific intensity per unit wavenumber
      unit: erg s^-1 cm^-1 sr^-1
    source:
      latex: S
      description: Local source function
      unit: erg s^-1 cm^-1 sr^-1
    optical_depth:
      latex: \tau
      description: Vertical optical depth
      unit: '1'
    cosine:
      latex: \mu
      description: Ray cosine relative to the patch normal
      unit: '1'
    contrast:
      latex: f
      description: Disk integrated planet-to-star line excess
      unit: '1'
  assumptions:
  - Observer transport does not feed radiation back into the local atom.
  evidence:
  - formulation
- id: resolution_criterion
  revision: '1'
  latex: \epsilon_a=\max_{p}\frac{|f_p^{(a\ {\rm refined})}-f_p^{({\rm base})}|}{\sigma_p}<0.1
  description: Refine one numerical axis at a time and compare at all 87 supplied observation wavelengths.
    The final candidate also refines every axis together. The same 0.1-uncertainty criterion is fixed
    before each comparison; failed grids are retained and finer candidates are tested separately.
  scope: N=15 to 20; double layers, disk angles, wavenumber intervals, continuum quadrature and wind collocation
    intervals independently, then combine these refinements for the final candidate. The initial 32- and
    64-layer attempts did not include the joint control. Supplied uncertainties are a numerical scale
    whose confidence interpretation is unverified.
  symbols:
    error:
      latex: \epsilon_a
      description: Largest change on refinement of axis a
      unit: '1'
    contrast:
      latex: f_p
      description: Interpolated spectral contrast at observer pixel p
      unit: '1'
    uncertainty:
      latex: \sigma_p
      description: Supplied observational uncertainty
      unit: '1'
  evidence:
  - formulation
- id: radiation_closure
  revision: '1'
  latex: J_\nu(r)=W B_\nu(T_{\rm rad}),\qquad \bar n_\nu(r)=\frac{c^2J_\nu(r)}{2h\nu^3}=\frac{W}{\exp[h\nu/(k_{\rm
    B}T_{\rm rad})]-1}
  description: The same prescribed mean intensity and photon occupation are supplied to every atmospheric
    layer; the observer calculation does not update them.
  scope: Implemented external-field closure for local statistical equilibrium. The equation defines an
    approximation and does not assert its physical adequacy.
  symbols:
    mean_intensity:
      latex: J_\nu
      description: Prescribed angle-averaged specific intensity
      unit: erg s^-1 cm^-2 Hz^-1 sr^-1
    occupation:
      latex: \bar n_\nu
      description: Photon occupation used in radiative rates
      unit: '1'
    dilution:
      latex: W
      description: Common prescribed radiation dilution
      unit: '1'
    radiation_temperature:
      latex: T_{\rm rad}
      description: Common Planck radiation temperature
      unit: K
    frequency:
      latex: \nu
      description: Line or bound-free quadrature frequency
      unit: Hz
    radius:
      latex: r
      description: Atmospheric radial coordinate; the imposed field is independent of it
      unit: cm
  assumptions:
  - No attenuation of the imposed field, internally generated diffuse field or line trapping feeds the
    local populations.
  - This is distinct from the observer formal transfer, which transports emergent intensity through the
    supplied populations.
  evidence:
  - radiation_closure_review
  - radiation_reference
- id: branch_profiles
  revision: '2'
  latex: \widetilde\nu_{ul}=(E_u-E_l)/(hc),\quad \Delta\widetilde\nu_{ul}=\widetilde\nu-\widetilde\nu_{ul}+\widetilde\nu_{ul}v_{\rm
    los}/c,\\L_i=\sum_{j<i}A_{ij}+\delta_{i,2s}A_{2\gamma},\quad \gamma_{ul}=(L_u+L_l)/(4\pi c),\quad
    \int\phi_{ul}(\widetilde\nu)\,d\widetilde\nu=1,\\\alpha_{\widetilde\nu}=\sum_{ul}\frac{A_{ul}}{8\pi
    c\widetilde\nu_{ul}^2}\left(\frac{g_u}{g_l}n_l-n_u\right)\phi_{ul},\quad j_{\widetilde\nu}=\sum_{ul}\frac{hc\widetilde\nu_{ul}A_{ul}}{4\pi}n_u\phi_{ul}
  description: Use each retained n/l energy difference consistently in the branch profile, thermal Doppler
    width, extinction and emissivity prefactors. Sum branch coefficients before forming the source. Full
    radiative lifetimes are unchanged.
  scope: 'Current three n/l H-alpha branches: 3s-to-2p, 3p-to-2s and 3d-to-2p. The NIST scalar center
    still defines the observer grid and reported velocity origin. This does not resolve full fine-J structure
    or establish absolute centroid accuracy.'
  symbols:
    lifetime_rate:
      latex: L_i
      description: Total spontaneous level depopulation rate
      unit: s^-1
    gamma:
      latex: \gamma_{ul}
      description: Natural Lorentz half width
      unit: cm^-1
    wavenumber:
      latex: \widetilde\nu
      description: Wavenumber
      unit: cm^-1
    profile:
      latex: \phi_{ul}
      description: Unit area wavenumber profile
      unit: cm
    extinction:
      latex: \alpha_{\widetilde\nu}
      description: Net absorption including stimulated emission
      unit: cm^-1
    emission:
      latex: j_{\widetilde\nu}
      description: Emissivity per unit wavenumber and solid angle
      unit: erg s^-1 cm^-2 sr^-1
    bound:
      latex: n_i
      description: Actual resolved state population
      unit: cm^-3
    level_energy:
      latex: E_i
      description: Retained n/l level energy
      unit: erg
    branch_center:
      latex: \widetilde\nu_{ul}
      description: Branch rest wavenumber
      unit: cm^-1
    los_velocity:
      latex: v_{\rm los}
      description: Line-of-sight speed in the existing observer convention
      unit: cm s^-1
  assumptions:
  - Thermal and full-lifetime natural widths only; Stark and neutral pressure broadening remain omitted.
  - The first-order Doppler shift uses the existing observer sign convention; no atmospheric rate, thermal
    or wind change is introduced.
  evidence:
  - formulation
  - lifetime_reference
