  - doc/nlte_spectrum_equations.tex
  - doc/nlte_spectrum.pdf
  - mceg/evidence/nlte_spectrum_20261122/review.json
  scope: New connection only; existing wind and extended-atom definitions retain their separate contracts
    and historical evidence.
