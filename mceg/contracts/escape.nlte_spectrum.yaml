- id: radiation_reference
  kind: literature
  summary: The paper uses PHOENIX irradiation and Cloudy; Cloudy distinguishes attenuated incident and
    diffuse radiation.
  sources:
  - https://arxiv.org/html/2606.23899v1#S4.SS1
  - https://www.pa.uky.edu/~gary/CloudyWorkshop/CloudyWorkshop/16Shandong/Cloudy_files/hazy1.pdf
  scope: Sections IV.1 and 2.2, respectively. The comparison identifies an omitted radiation/population
    coupling, not every option in the authors' unpublished input files.
  provenance:
    role: primary
    location: Zhang et al. (2026), IV.1; Hazy 1, 2.2
    inspection: inspected
    note: Read the stated methods and radiation-field definitions. The older Cloudy manual documents this
      distinction, not a reconstruction of the paper's c23.01 configuration.
