  scope: Not established by unit tests, source citations, a synthetic fit or a matched-code comparison
    alone.
  equations: []
- id: coupled_flow_balance
  revision: '1'
  kind: numerical_verification
  statement: The selected jointly irradiated finite flow closes its discrete material and radiation energy
    exchange.
  scope: Only retained finite inflow examples; no transonic eigenvalue selection.
  equations:
