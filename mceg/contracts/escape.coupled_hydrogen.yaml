- id: higher_shell_atomic_data
  revision: '1'
  question: How are the added n=4,5 shell rates defined and sourced?
  scope: Finite added-shell approximation; no assertion of atom-size adequacy.
  options:
  - id: hydrogenic_cloudy
    description: Hydrogenic dipoles, Cloudy VS80 shell collisions, inverse rates and explicit cascades
  - id: resolved_data
    description: Independently validated fully resolved large-atom collision data
  selected: hydrogenic_cloudy
  reasons:
  - Hydrogenic dipole integrals supply explicit added radiative branches.
  - Cloudy provides an inspectable implementation of the shell collision prescription when the original
    full-text formula is unavailable.
  limitations:
  - Statistical-l upper shells, approximate branch-weighted collisions and no top-off.
  - Original VS80 formula equivalence is not independently verified.
  - Numerical tests do not establish adequate nmax=5 truncation; the separate five-percent n3 criterion
    must be checked.
  reconsider_when:
  - The atom-truncation accuracy gate fails, or primary/resolved collision data become available.
  basis:
  - kind: evidence
    id: higher_dipole_source
    sha256: 24c63342a3bbf35fd3c400b99b835ceda54f1ea8e6aa07fcd0a6b09ac77676bf
  - kind: evidence
    id: cloudy_collision_source
    sha256: b8475224c8df76667c84c0963a205f9174bfbdbb4c2cd7e31345c70b0675a68f
  subject: coupled_definition_v1
  context: coupled_definition_v1
- id: frequency_window
  revision: '1'
  question: Which continuum window is adequate for the current numerical energy budget?
  scope: Initial implementation choice after authored verification review; no invented historical execution
    receipt.
  options:
  - id: selected
    description: Resolve 1e-4 to100 eV with log subintervals, continuum edges and line-core splits
  - id: alternative
    description: Retain an initially coarse window starting at0.1eV
  selected: selected
  reasons:
  - Review found missing low-energy free-free cooling in the initial window.
  - An independent bolometric integral and matched frequency refinement test the selected window.
  limitations:
  - A quadrature tolerance does not validate atomic rates or all spectral observables.
  - Earlier coarse-grid temperature roots are not retained as accurate results.
  reconsider_when:
  - A retained convergence, domain or independent-reference check fails, or a required observable needs
    a stricter model.
  basis:
  - kind: evidence
    id: implementation_review
    sha256: ad93c9777e70fcd630f365f161df067541de08c346d1391914a5dccc69d89a5f
  subject: coupled_implementation_v1
  context: coupled_definition_v1
- id: energy_budget_precision
  revision: '1'
  question: How should a small net radiation/matter energy exchange be verified?
  scope: Initial implementation choice after authored verification review; no invented historical execution
    receipt.
  options:
  - id: selected
    description: Retain carried-flux, exchange and local material-budget diagnostics separately
  - id: alternative
    description: Use only one boundary-flux relative error
  selected: selected
  reasons:
  - Cancellation of large carried fluxes can overwhelm the small exchanged power.
  - Acceptance combines exchange tolerance with carried-flux roundoff and a separate material-vs-volume
    heating check.
  limitations:
  - The exchange-relative diagnostic remains visible even when limited by floating-point subtraction.
  - Conservative arithmetic does not establish spatial, angular or atomic accuracy.
  reconsider_when:
  - A retained convergence, domain or independent-reference check fails, or a required observable needs
    a stricter model.
  basis:
  - kind: evidence
    id: implementation_review
    sha256: ad93c9777e70fcd630f365f161df067541de08c346d1391914a5dccc69d89a5f
  subject: coupled_implementation_v1
  context: coupled_definition_v1
- id: weak_gain_domain
  revision: '1'
  question: How should the weak inversion produced by the added atom be transported?
  scope: Initial implementation choice after authored verification review; no invented historical execution
    receipt.
  options:
  - id: selected
    description: Keep signed extinction with total negative optical depth<=0.25 and face-realizability
      checks
  - id: alternative
    description: Reject all negative opacity or clip it tozero
  selected: selected
  reasons:
  - The added-shell model can produce weak Paschen inversion.
  - Signed transport retains the defined model; independent weak-gain formal solutions and derivatives
    test the extension.
  limitations:
  - The gain bound0.25 is an engineering restriction, not a physical maser threshold.
  - Strong amplification and angularly unrealizable solutions fail explicitly; no saturation or moving-transport
    claim.
  reconsider_when:
  - A retained convergence, domain or independent-reference check fails, or a required observable needs
    a stricter model.
  basis:
  - kind: evidence
    id: implementation_review
    sha256: ad93c9777e70fcd630f365f161df067541de08c346d1391914a5dccc69d89a5f
  subject: coupled_implementation_v1
  context: coupled_definition_v1
