  - The original VS80 full paper was unavailable; the altered Cloudy adaptation and its notice are retained.
  evidence:
  - definition
  - higher_dipole_source
  - cloudy_collision_source
  - reduced_atom_continuum_source
- id: thermal_equilibrium
  revision: '1'
  latex: Q_i=0\quad\text{for every represented bound state},\qquad\mathcal H(T,\{n_i\},J_\nu)=0
  description: Static thermal equilibrium solves temperature together with rates and internally transported
    radiation.
  scope: Prescribed nuclear density and incoming intensities; temperature is an unknown and its initial
    guess is not a boundary condition.
  symbols:
    density:
      latex: n_{\rm H}
      description: Prescribed nuclear density
      unit: cm^-3
    temperature:
      latex: T
      description: Solved temperature
      unit: K
    heating:
      latex: \mathcal H
      description: Full radiative matter-energy input including escaping two-photon loss
      unit: erg cm^-3 s^-1
  assumptions:
  - This static equilibrium is not imposed on the finite advecting flow.
  - Gas temperatures must remain within the actual atomic and optional continuum validity ranges.
  evidence:
  - definition
- id: radiation_admissibility
  revision: '1'
  latex: \max_\nu\sum_k\max(-\chi_{\nu,k},0)\,\Delta r_k\le0.25,\qquad J_{\nu,\mathrm{face}}\ge\sqrt3|H_{\nu,\mathrm{face}}|
  description: The initial static moment solver has explicit weak-gain and angular-realizability limits.
  scope: A numerical engineering domain for the adopted two-direction closure, not a physical maser threshold.
  symbols:
    opacity:
      latex: \chi_\nu
      description: Signed total extinction
      unit: cm^-1
    radius:
      latex: r
      description: Increasing cell-edge radii
      unit: cm
    mean:
      latex: J_\nu
      description: Reconstructed face mean intensity
      unit: erg s^-1 cm^-2 sr^-1 Hz^-1
    flux:
      latex: H_\nu
      description: Face first intensity moment
      unit: erg s^-1 cm^-2 sr^-1 Hz^-1
  assumptions:
  - No negative-opacity clipping or artificial positive opacity floor.
  - Nonnegative two-direction intensities are required up to a stated floating-point tolerance.
  - A wide transparent outward-illuminated sphere may fail this angular closure despite an exact linear
    energy budget.
  evidence:
  - definition
  - implementation_review
