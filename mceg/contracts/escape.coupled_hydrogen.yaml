    held at the right endpoint.
  evidence:
  - definition
- id: finite_inflow_and_sonic_limit
  revision: '1'
  latex: n_{\rm H}(r_0)=n_0,\quad T(r_0)=T_0,\quad v(r_0)=v_0,\quad f_i(r_0)=f_{i,0},\\v_c^2=\gamma a_c^2,\qquad
    \frac{2\gamma a_c^2}{r_c}-\Phi_c^\prime-(\gamma-1)\left(\frac{\mathcal H}{\rho v}-\frac{\epsilon^\prime}{m_{\rm
    H}}\right)_c=0,\quad\gamma=5/3
  description: Finite inflow data close the initial branch problem; sonic regularity belongs to a distinct
