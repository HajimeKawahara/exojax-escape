  scope: Observed convergence or sensitivity must be reported for the requested observable, not presumed
    from residual convergence.
  equations:
  - id: radiation_finite_volume
    revision: '1'
  - id: flow_finite_volume
    revision: '1'
- id: coupled_gradients
  revision: '1'
  kind: numerical_verification
  statement: Implicit derivatives of the selected complete residual agree with independent directional
    finite differences.
  scope: Only converged sampled roots; no posterior-convergence inference.
  equations:
  - id: joint_residual_and_derivative
    revision: '1'
- id: reference_agreement
  revision: '1'
  kind: numerical_verification
  statement: A matched independent reference meets a predeclared numerical comparison criterion.
  scope: Reference data, version, geometry, process set and metric must be retained before support is
    assigned.
  equations: []
- id: atmospheric_accuracy
  revision: '1'
  kind: physical_validation
  statement: The model is physically adequate for the target KELT-9b observable within an explicit error
    budget.
  scope: Not established by unit tests, source citations, a synthetic fit or a matched-code comparison
    alone.
  equations: []
- id: coupled_flow_balance
  revision: '1'
  kind: numerical_verification
  statement: The selected jointly irradiated finite flow closes its discrete material and radiation energy
    exchange.
  scope: Only retained finite inflow examples; no transonic eigenvalue selection.
  equations:
  - id: state_and_eos
    revision: '1'
  - id: radiation_finite_volume
    revision: '1'
  - id: flow_finite_volume
    revision: '1'
  - id: total_energy_gate
    revision: '1'
- id: atom_truncation_accuracy
  revision: '1'
  kind: numerical_verification
  statement: At the declared fixed-field conditions, the n=3 reservoir changes by no more than five percent
    between nmax=4 and 5.
  scope: T=9000 K, nH=1e12 cm^-3, Trad=10000 K, W=0.025; passing this finite comparison would not establish
    infinite-atom convergence.
  equations:
  - id: atomic_balance
    revision: '1'
  - id: higher_shell_dipoles
    revision: '1'
evidence:
- id: definition
  kind: theory
  summary: Authored full-system equations, restricted closed problems and verification requirements.
  sources:
  - doc/coupled_model.tex
  - doc/coupled_model_equations.tex
  - mceg/workflows/coupled.json
  scope: Proposed definitions and gate criteria; this record is not an execution or implementation proof.
  subject: coupled_definition_v1
  context: coupled_definition_v1
  provenance:
    role: primary
    location: The mathematical model and verification roadmap
    inspection: partial
    note: Initial definition assembled before assigning implementation or verification support. Source/BVP
      review and actual tests remain required.
- id: higher_dipole_source
  kind: literature
  summary: Prozesky and Smits (2018), hydrogenic electric-dipole rates and shell-to-sublevel branching
    convention.
  sources:
  - https://arxiv.org/html/1805.02440v1
  - https://doi.org/10.1093/mnras/sty1189
  scope: Appendix A equations26 and45; not a validation of the complete atmosphere.
  provenance:
    role: primary
    location: Appendix A equations26 and45
    inspection: partial
    note: Inspected selected equations; added-state dipole integrals are independently evaluated as finite
      Laguerre polynomials.
- id: vs80_original
  kind: literature
  summary: Vriens and Smeets (1980), cited origin of the higher-shell collision approximation.
  sources:
  - https://doi.org/10.1103/PhysRevA.22.940
  scope: Original full-text formula was unavailable; do not infer an independent exact transcription.
  provenance:
    role: primary
    location: Physical Review A22,940
    inspection: not_inspected
    note: Bibliographic identity only; numerical convention is adopted from the inspected Cloudy implementation.
- id: cloudy_collision_source
  kind: implementation
  summary: Cloudy C23 hydro_vs_deexcit is the inspected convention for the altered Python collision routine.
  sources:
  - https://data.nublado.org/cloudy_releases/c23/c23.01.tar.gz
  - src/escape/hydrogen_atom.py
  - LICENSES/Cloudy.txt
  scope: The B-term binding energy uses the upper state, as in Cloudy; primary-paper formula equivalence
    remains unverified.
  provenance:
    role: secondary
    location: C23 source/hydro_vs_rates.cpp:hydro_vs_deexcit
    inspection: inspected
    note: Inspected local C23 archive source; no git revision available. Retained zlib notice and marked
      Python adaptation.
    derived_from:
    - evidence: vs80_original
      comparison: not_checked
      note: The original full formula was inaccessible; no primary-versus-implementation equivalence judgment.
- id: hminus_source
  kind: implementation
  summary: Optional H-minus continuum reuses existing ExoJAX John1988 fits with an explicit LTE trace
    approximation.
  sources:
  - https://articles.adsabs.harvard.edu/pdf/1988A%26A...193..189J
  - https://doi.org/10.1051/0004-6361/202451157
  - src/escape/hydrogen_continuum.py
  scope: John fit temperature/wavelength limits and charge-trace threshold are enforced; no dynamic H-minus
    chemistry or planetary LTE validation.
  provenance:
    role: implementation
    location: ExoJAX exojax.database.hminus and escape.hydrogen_continuum
    inspection: partial
    note: Existing implementation inspected; John original full paper not independently rederived. Barklem-Amarsi2024
      provides conditional-LTE context, not validation of this atmosphere.
- id: implementation_review
  kind: implementation
  summary: Authored account of verification-driven corrections to frequency coverage, energy-budget precision
    and weak signed extinction.
  sources:
  - doc/coupled_model.tex
  - src/escape/coupled_hydrogen.py
  - src/escape/radiation.py
  - tests/test_radiation.py
  - tests/test_coupled_equilibrium.py
  - tests/test_coupled_flow.py
  scope: Current code review and linked current tests. Earlier exploratory failures have no archived receipt
    and are not historical execution evidence.
  provenance:
    role: implementation
    location: Coupled-model implementation review during this change
    inspection: inspected
    note: Coarse continuum omitted free-free power; subtraction of large carried fluxes obscured small
      exchange; weak Paschen inversion required signed transport. Current numerical claims require the
      actual retained workflow execution.
limitations:
- statement: Current approximation choices do not constitute a full moving, angularly resolved, transonic
    Cloudy-equivalent atmosphere.
  evidence:
  - definition
- statement: Spherical Eddington closure, static profiles, upper-state truncation and conditional H-minus
    trace chemistry require separate accuracy assessment.
  evidence:
  - definition
