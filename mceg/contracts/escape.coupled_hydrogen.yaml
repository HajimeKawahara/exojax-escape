equations:
- id: state_and_eos
  revision: '1'
  latex: \sum_i f_i+x=1,\quad n_i=f_i n_{\rm H},\quad n_e=n_p=xn_{\rm H},\\\rho=m_{\rm H}n_{\rm H},\quad
    P=(1+x)n_{\rm H}k_{\rm B}T,\quad \mu=(1+x)^{-1}
  description: The bound fractions and proton fraction conserve hydrogen nuclei and charge.
  scope: Pure atomic hydrogen; H-minus, when enabled, is a trace opacity approximation and does not alter
    charge/EOS.
  symbols:
    fractions:
      latex: f_i
      description: Bound population divided by total nuclear density
      unit: '1'
    ionized:
      latex: x
      description: Ionized fraction
      unit: '1'
    density:
      latex: n_{\rm H}
      description: Total hydrogen-nucleus density
      unit: cm^-3
    temperature:
      latex: T
      description: Gas temperature
      unit: K
    pressure:
      latex: P
      description: Gas pressure
      unit: erg cm^-3
  assumptions:
  - Electron mass is neglected. No H2, helium or metal charge donors.
  - The H-minus trace approximation requires a separately checked small abundance.
  evidence:
  - definition
- id: material_energy
  revision: '1'
  latex: \epsilon=\sum_i f_i E_i+x\chi_{\rm H},\quad a^2=\frac{P}{\rho},\\e=\frac32(1+x)k_{\rm B}T+\epsilon,\quad
    h=\frac52a^2+\frac{\epsilon}{m_{\rm H}},\quad \mathcal B=\frac{v^2}{2}+h+\Phi
  description: Total material energy includes excitation and ionization, with ground-state neutral H as
    the reference.
  scope: Translational monatomic particles plus the represented atomic populations.
  symbols:
    excitation:
      latex: E_i
      description: Excitation energy of bound state i above ground
      unit: erg
    binding:
      latex: \chi_{\rm H}
      description: Ground-state ionization energy
      unit: erg
    energy:
      latex: e
      description: Internal energy per hydrogen nucleus
      unit: erg
    enthalpy:
      latex: h
      description: Specific material enthalpy
      unit: erg g^-1
    bernoulli:
      latex: \mathcal B
      description: Specific total material energy flux divided by mass flux
      unit: erg g^-1
  assumptions:
  - Collisional excitation and ionization are internal energy redistribution, not additional external
    cooling terms.
  evidence:
  - definition
- id: atomic_balance
  revision: '1'
  latex: Q_i=\sum_{j\ne i}(n_jP_{ji}-n_iP_{ij})+n_en_p\alpha_i+n_e^2n_pq_i^{(3)}-n_i(\Gamma_i+n_eq_i^{\rm
    ion})
  description: The same rate network supplies local equilibrium and population-advection source terms.
  scope: Resolved lower nl states and the explicitly chosen collapsed upper shells.
  symbols:
    production:
      latex: Q_i
      description: Net creation rate of bound state i
      unit: cm^-3 s^-1
    rate:
      latex: P_{ij}
      description: Bound-bound rate from i to j
      unit: s^-1
    alpha:
      latex: \alpha_i
      description: Radiative recombination coefficient including stimulated emission
      unit: cm^3 s^-1
    q3:
      latex: q_i^{(3)}
      description: Three-body recombination coefficient
      unit: cm^6 s^-1
  assumptions:
  - No omitted-level cascade or Case-B correction is added implicitly.
  - The one-way two-photon channel prevents a blanket full-atom Planck-LTE claim.
  evidence:
  - definition
- id: radiation_averages
  revision: '1'
  latex: J_\nu=\frac12\int_{-1}^{1}I_\nu\,d\zeta,\quad H_\nu=\frac12\int_{-1}^{1}\zeta I_\nu\,d\zeta,\quad
    K_\nu=J_\nu/3,\\\overline J_{ul}=\int\phi_{ul,\nu}J_\nu\,d\nu,\quad P_{lu}^{\rm rad}=B_{lu}\overline
    J_{ul},\quad P_{ul}^{\rm rad}=A_{ul}+B_{ul}\overline J_{ul}
  description: Complete redistribution uses the same line profile for radiative rates and transfer coefficients.
  scope: Static radiation, isotropic emission and Eddington angular closure; no velocity-induced frequency
    shifts.
  symbols:
    mean:
      latex: J_\nu
      description: Mean specific intensity
      unit: erg s^-1 cm^-2 sr^-1 Hz^-1
    flux_moment:
      latex: H_\nu
      description: First intensity moment; flux Fnu=4pi Hnu
      unit: erg s^-1 cm^-2 sr^-1 Hz^-1
    profile:
      latex: \phi_{ul,\nu}
      description: Line profile normalized over frequency
      unit: Hz^-1
  assumptions:
  - Eddington closure is an approximation; exact angular or beam irradiation is not established by conservation.
  - The stellar boundary is specified as an incoming intensity, not silently identified with the mean
    intensity.
  evidence:
  - definition
- id: radiation_moments
  revision: '1'
  latex: \frac{1}{r^2}\frac{d(r^2H_\nu)}{dr}=j_\nu-\chi_\nu J_\nu,\qquad \frac{dJ_\nu}{dr}=-3\chi_\nu
    H_\nu
  description: Spherical Eddington moments use the same radial geometry as the material-flow equations.
  scope: Stationary transfer without Doppler shifts, aberration or radiation-pressure force.
  symbols:
    opacity:
      latex: \chi_\nu
      description: Net extinction including stimulated emission
      unit: cm^-1
    emission:
      latex: j_\nu
      description: Isotropic emissivity
      unit: erg s^-1 cm^-3 sr^-1 Hz^-1
    radius:
      latex: r
      description: Radial coordinate
      unit: cm
  assumptions:
  - For a plane-parallel validation problem replace r-squared area by one.
  - Zero extinction must be handled as a transport limit, not by an arbitrary opacity floor.
  evidence:
  - definition
- id: radiation_boundaries
  revision: '1'
  latex: J_\nu(r_0)+\sqrt3H_\nu(r_0)=I_{\nu,\rm in}^{+},\qquad J_\nu(r_1)-\sqrt3H_\nu(r_1)=I_{\nu,\rm
    in}^{-}
  description: Two incoming characteristics close the finite radiation boundary-value problem.
  scope: Outgoing intensities are solved; incoming spectra and the finite outer radius are inputs.
  symbols:
    inner:
      latex: I_{\nu,\rm in}^{+}
      description: Incoming outward intensity at the inner boundary
      unit: erg s^-1 cm^-2 sr^-1 Hz^-1
    outer:
      latex: I_{\nu,\rm in}^{-}
      description: Incoming inward intensity at the outer boundary
      unit: erg s^-1 cm^-2 sr^-1 Hz^-1
  assumptions:
  - A one-direction input Iminus=2 W Bnu gives mean W Bnu in a transparent slab with zero opposite input.
  - There is no independent outgoing-boundary condition.
  evidence:
  - definition
- id: radiation_finite_volume
  revision: '1'
  latex: A_{k+1/2}H_{\nu,k+1/2}-A_{k-1/2}H_{\nu,k-1/2}=V_k(j_{\nu,k}-\chi_{\nu,k}J_{\nu,k}),\\A_{k\pm1/2}=r_{k\pm1/2}^2,\quad
    V_k=\frac{r_{k+1/2}^3-r_{k-1/2}^3}{3}
  description: The zeroth-moment equation conserves radiative energy over each finite shell.
  scope: J and process coefficients are cell quantities; H lives at edges; geometric factors exclude 4pi.
  symbols:
    area:
      latex: A
      description: Radial area factor, or one in a slab
      unit: cm^2 in spherical geometry
    volume:
      latex: V
      description: Shell-volume factor, or cell width in a slab
      unit: cm^3 in spherical geometry
  assumptions:
  - The first moment is discretized with consistent half-cell optical depths and boundary characteristics.
  - A cell-mean rate field, not an unrelated midpoint approximation, supplies the heating budget.
  evidence:
  - definition
- id: radiative_heating
  revision: '1'
  latex: \mathcal H_{\rm RT}=4\pi\int(\chi_\nu J_\nu-j_\nu)\,d\nu,\quad C_{2\gamma}=n_{2s}A_{2\gamma}(E_{2s}-E_{1s}),\\\mathcal
    H=\mathcal H_{\rm RT}-C_{2\gamma}
  description: Net radiative heating is consistent with the total-material-energy convention.
  scope: Two-photon decay is an explicitly escaping channel outside the sampled transfer grid.
  symbols:
    heating:
      latex: \mathcal H
      description: External gain of material energy per unit volume
      unit: erg cm^-3 s^-1
    escape:
      latex: C_{2\gamma}
      description: Escaping two-photon radiative cooling
      unit: erg cm^-3 s^-1
  assumptions:
  - Do not subtract collisional energy terms again.
  - If two-photon emissivity is later included in jnu, remove the separate escape subtraction.
  - H-minus and free-free contributions must use the same extinction/emission in transfer and heating.
  evidence:
  - definition
- id: continuum_closures
  revision: '1'
  latex: j_\nu^{\rm ff}=\chi_\nu^{\rm ff}B_\nu(T),\qquad n_{\rm H^-}=S_-(T)n_{1s}n_e,\qquad j_\nu^{-}=\chi_\nu^{-}B_\nu(T)
  description: Free-free and optional H-minus continuum are explicit closures, not a hidden chemistry
    solver.
  scope: Maxwellian free-free with the chosen Gaunt approximation; H-minus in a conditional LTE trace
    closure.
  symbols:
    negative:
      latex: n_{\rm H^-}
      description: Trace H-minus density used by the continuum approximation
      unit: cm^-3
    saha_minus:
      latex: S_-(T)
      description: LTE attachment equilibrium factor
      unit: cm^3
  assumptions:
  - H-minus is off by default until its small-abundance and detailed process bookkeeping are checked.
  - No dynamic H-minus chemistry or H-minus feedback on charge and internal energy is claimed.
  evidence:
  - definition
  - hminus_source
- id: mass_and_species_flow
  revision: '1'
  latex: \dot M=4\pi r^2m_{\rm H}n_{\rm H}v=\mathrm{constant},\qquad v\frac{df_i}{dr}=\frac{Q_i}{n_{\rm
    H}}
  description: Spherical continuity and material advection replace an imposed local equilibrium closure.
  scope: Steady one-dimensional radial flow; the local-SE limit is a separately checked limiting regime.
  symbols:
    mass_loss:
      latex: \dot M
      description: Mass flux fixed by finite-branch inflow data
      unit: g s^-1
    velocity:
      latex: v
      description: Outward material speed
      unit: cm s^-1
  assumptions:
  - Local equilibrium Qi=0 is not imposed simultaneously on an arbitrary advecting population profile.
  evidence:
  - definition
- id: momentum_and_energy
  revision: '1'
  latex: v\frac{dv}{dr}=-\frac1\rho\frac{dP}{dr}-\frac{d\Phi}{dr},\qquad\frac{d\mathcal B}{dr}=\frac{\mathcal
    H}{\rho v},\\\Phi=-\frac{GM}{r}-\frac{\kappa r^2}{2}
  description: Momentum and total material-energy flux retain composition-dependent pressure and enthalpy.
  scope: A finite radial branch; optional linear tides, no Roche geometry and no radiation-pressure force.
  symbols:
    potential:
      latex: \Phi
      description: Gravitational plus linear-tidal potential
      unit: erg g^-1
    tide:
