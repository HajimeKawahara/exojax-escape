  latex: f_{i,R}-f_{i,L}=\frac{V}{r_R^2}\left(\frac{Q_i}{n_{\rm H}v}\right)_R,\qquad \mathcal B_R-\mathcal
    B_L=\frac{V}{r_R^2}\left(\frac{\mathcal H}{\rho v}\right)_R,\\\left[v+\frac{a^2}{v}\right]_L^R=\frac{a_R^2(r_R^2-r_L^2)-GM(r_R-r_L)+\kappa(r_R^4-r_L^4)/4}{r_R^2v_R}
  description: A first-order finite branch uses shared shell volumes for reaction and energy exchanges.
  scope: Right-endpoint material state represents each radiation cell; refine the grid before drawing
