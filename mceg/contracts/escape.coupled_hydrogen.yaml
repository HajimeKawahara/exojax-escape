schema_version: '0.4'
model:
  id: escape.coupled_hydrogen
  name: 'Coupled hydrogen: closed problems and staged verification'
  description: Mathematical target and stage-specific evidence. Static Eddington radiation, prescribed/thermal
    SE benchmarks and a finite reactive-flow branch are distinguished from a future transonic atmosphere.
  implementation:
    repository: https://github.com/HajimeKawahara/exojax-escape
    revision: 3c5438568a294131a6af3b6578aa5c5d35c54e79
    entry_points: &id001
    - src/escape/coupled_hydrogen.py:CoupledHydrogenModel._occupations
    - src/escape/coupled_hydrogen.py:CoupledHydrogenModel.radiation_state
    - src/escape/coupled_hydrogen.py:CoupledHydrogenModel.solve_equilibrium
    - src/escape/coupled_hydrogen.py:CoupledHydrogenModel.solve_flow
    - src/escape/coupled_hydrogen.py:atom_line_profiles
    - src/escape/hydrogen_atom.py:atom_collision_rates
    - src/escape/hydrogen_atom.py:hydrogenic_einstein_a
    - src/escape/hydrogen_continuum.py:continuum_coefficients
    - src/escape/hydrogen_continuum.py:hminus_lte_trace_density
    - src/escape/hydrogen_continuum.py:hydrogen_free_free_coefficients
    - src/escape/hydrogen_continuum.py:total_radiative_energy
    - src/escape/radiation.py:moment_geometry
    - src/escape/radiation.py:solve_moment_transfer
    - src/escape/reactive_flow.py:bernoulli_energy
    - src/escape/reactive_flow.py:decode_flow_state
    - src/escape/reactive_flow.py:flow_domain_valid
    - src/escape/reactive_flow.py:reactive_flow_residual
    - src/escape/reactive_flow.py:species_production_s
assumptions:
- statement: Pure atomic H, static radiation and the explicit finite-domain conditions; all later approximations
    and included channels are recorded per stage.
  evidence:
  - definition
domains:
- kind: scientific_applicability
  status: unknown
  description: No validated KELT-9b domain or observable error budget.
  conditions: []
  evidence:
  - definition
- kind: numerical_evaluation
  status: documented
  description: Declared implementation domain; retained tests sample only the explicitly recorded points.
  conditions:
  - Float64; finite positive material state and increasing fixed radial edges.
  - "Atomic temperatures5802.26\u201314000K; optional H-minus narrows the upper limit to10080K and requires\
    \ nHminus/min(ne,nH)<1e-3."
  - Incoming boundary intensities must provide nonzero photoionization for the current population initialization;
    a zero-field ionized solution is not supported by this initialization.
  - Signed extinction is retained only for accumulated negative optical depth<=0.25 and angularly realizable
    face moments; no opacity clipping.
  - The finite flow stays on one branch with abs(Mach^2-1)>1e-3; transonic mass-flux selection is outside
    this implementation.
  - "Current frequency window1e-4\u2013100eV and chosen atom/grid remain explicit approximations; refinement\
    \ is sampled, not a universal error bound."
  evidence:
  - definition
