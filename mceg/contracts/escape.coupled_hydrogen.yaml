  - definition
- id: bound_free_transfer_coefficients
  revision: '1'
  latex: \sigma_{i\nu}=\frac{2.815\times10^{29}}{\mathfrak n_i^5\nu^3}\,\mathbf1_{h\nu\ge\chi_i},\quad
    b^*_{i\nu}=\frac{g_i}{2}\left(\frac{h^2}{2\pi m_e k_{\rm B}T}\right)^{3/2}e^{-(h\nu-\chi_i)/(k_{\rm
    B}T)},\\\chi_\nu^{\rm bf}=\sum_i\sigma_{i\nu}(n_i-n_en_pb^*_{i\nu}),\qquad j_\nu^{\rm bf}=\frac{2h\nu^3}{c^2}\sum_i\sigma_{i\nu}n_en_pb^*_{i\nu}
  description: The same Kramers/Milne kernel supplies bound-free rates, extinction and emission.
  scope: Principal quantum number is mathfrak n_i; n_i is bound number density. Gaunt factor one and no
