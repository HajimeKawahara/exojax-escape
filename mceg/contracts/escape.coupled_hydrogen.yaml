- id: atom_truncation_accuracy
  revision: '1'
  kind: numerical_verification
  statement: At the declared fixed-field conditions, the n=3 reservoir changes by no more than five percent
    between nmax=4 and 5.
  scope: T=9000 K, nH=1e12 cm^-3, Trad=10000 K, W=0.025; passing this finite comparison would not establish
    infinite-atom convergence.
  equations:
  - id: atomic_balance
    revision: '1'
  - id: higher_shell_dipoles
    revision: '1'
