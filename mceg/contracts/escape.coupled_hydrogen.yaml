- id: total_energy_gate
  revision: '1'
  latex: \left[\dot M\mathcal B+4\pi r^2F_{\rm rad}\right]_{r_0}^{r_1}+4\pi\int_{r_0}^{r_1}r^2C_{2\gamma}\,dr=0,\qquad
    F_{\rm rad}=4\pi\int H_\nu\,d\nu
  description: Total material plus transported and explicitly escaping radiation energy provides a coupled
    acceptance check.
  scope: The finite-volume form uses exactly the same frequency weights, source terms and shell volumes.
  symbols:
    flux:
