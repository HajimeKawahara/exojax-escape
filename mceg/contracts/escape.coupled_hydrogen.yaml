- id: added_shell_inverse_rates
  revision: '1'
  latex: q_{u l}=q^{\rm VS80}_{n_u n_l}\frac{A_{u l}}{\sum_{l^\prime:n_{l^\prime}=n_l}A_{u l^\prime}},\quad
    q_{l u}=\frac{g_u}{g_l}e^{-(E_u-E_l)/(k_{\rm B}T)}q_{u l},\\q_i^{(3)}=q_i^{\rm ion}\frac{g_i}{2}\left(\frac{h^2}{2\pi
    m_e k_{\rm B}T}\right)^{3/2}e^{\chi_i/(k_{\rm B}T)}
  description: Added shell collisions use an explicitly adopted shell approximation and matched inverse
