  - definition
- id: higher_shell_dipoles
  revision: '1'
  latex: R_{ul}=\int_0^\infty R_{n_ul_u}(r)R_{n_ll_l}(r)r^3\,dr,\qquad A_{ul}=\frac{64\pi^4e^2\nu_{ul}^3}{3hc^3}|R_{ul}|^2\frac{\max(l_u,l_l)}{2l_u+1},\\A_{UL}=\sum_{u\in
    U,\,l\in L}\frac{g_u}{g_U}A_{ul}
  description: Hydrogenic dipole integrals and upper statistical weights define added-shell radiative
