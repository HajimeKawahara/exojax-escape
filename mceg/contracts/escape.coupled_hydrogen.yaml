    boundary inputs.
  evidence:
  - definition
- id: line_transfer_coefficients
  revision: '1'
  latex: \chi_\nu^{\rm bb}=\sum_{ul}\frac{c^2A_{ul}}{8\pi\nu_{ul}^2}\left(\frac{g_u}{g_l}n_l-n_u\right)\phi_{ul,\nu},\qquad
    j_\nu^{\rm bb}=\sum_{ul}\frac{h\nu_{ul}A_{ul}}{4\pi}n_u\phi_{ul,\nu},\\\int\phi_{ul,\nu}\,d\nu=1,\quad\sigma_{\nu,ul}=\frac{\nu_{ul}}c\sqrt{\frac{k_{\rm
    B}T}{m_{\rm H}}},\quad\gamma_{\nu,ul}=\frac{A_u^{\rm tot}+A_l^{\rm tot}}{4\pi}
  description: Individual transition centers and both lifetimes define static CRD Voigt profiles.
