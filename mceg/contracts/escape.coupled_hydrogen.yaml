      description: Declared finite atomic arrays
      unit: mixed cgs
    temperature:
      latex: T
      description: Gas temperature
      unit: K
    bound:
      latex: n_i
      description: Bound population density
      unit: cm^-3
    electron:
      latex: n_e
      description: Electron number density
      unit: cm^-3
    proton:
      latex: n_p
      description: Proton number density
      unit: cm^-3
    frequency:
      latex: \nu
      description: Ordinary photon frequency
      unit: Hz
