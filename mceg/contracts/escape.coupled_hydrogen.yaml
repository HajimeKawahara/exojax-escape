  - definition
- id: joint_residual_and_derivative
  revision: '1'
  latex: \mathcal F(y;\theta)=\begin{pmatrix}R_{\rm RT}\\R_{\rm populations}\\R_{\rm momentum}\\R_{\rm
    energy}\\R_{\rm boundaries}\end{pmatrix}=0,\qquad \mathcal F_y\,\delta y=-\mathcal F_\theta\,\delta\theta
  description: A coupled solution and its derivative must use the same complete residual.
  scope: Only include the equations of the selected closed problem; static SE, thermal equilibrium and
