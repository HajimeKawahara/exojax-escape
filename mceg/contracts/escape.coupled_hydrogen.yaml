decisions:
- id: radiation_closure
  revision: '1'
  question: Which radiation closure closes this initial stage?
  scope: Initial coupled-model specification; not a declaration of completed implementation.
  options:
  - id: eddington
    description: Spherical static Eddington closure with a slab-limit benchmark
  - id: extended
    description: Angularly resolved moving radiation transfer
  selected: eddington
  reasons:
  - Static closure permits a conservative radiation/flow geometry while angular and Doppler errors stay
    explicit.
  limitations:
  - Physical adequacy remains unknown; only scoped tests can establish the stated numerical properties.
  reconsider_when:
  - Matched independent comparison, domain requirements or convergence results show the chosen approximation
    is inadequate.
  basis:
  - kind: evidence
    id: definition
    sha256: c237cb96f982189a9eb67b3898e876c345896178c9787181c03c802e9dbb8c40
  subject: coupled_definition_v1
  context: coupled_definition_v1
- id: energy_convention
  revision: '1'
  question: Which energy convention closes this initial stage?
  scope: Initial coupled-model specification; not a declaration of completed implementation.
  options:
  - id: total_material
    description: Total material energy includes represented excitation and ionization
  - id: extended
    description: Kinetic energy with separately derived reaction heating
  selected: total_material
  reasons:
  - One convention prevents double-counting collision energy and recombination photons.
  limitations:
  - Physical adequacy remains unknown; only scoped tests can establish the stated numerical properties.
  reconsider_when:
  - Matched independent comparison, domain requirements or convergence results show the chosen approximation
    is inadequate.
  basis:
  - kind: evidence
