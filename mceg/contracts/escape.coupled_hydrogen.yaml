    five-percent population criterion against Cloudy C23.01.
  scope: Matched T,nH,incident blackbody and maximum principal level, with deliberately different atomic
    kernels. This is a model-adequacy comparison, not same-equation solver verification or full-atmosphere
    agreement.
  equations: []
- id: atmospheric_accuracy
  revision: '1'
  kind: physical_validation
  statement: The model is physically adequate for the target KELT-9b observable within an explicit error
