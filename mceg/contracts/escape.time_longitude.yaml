decisions:
- id: retain_conditional_map
  revision: '1'
  question: How should the shared longitude fit and eclipse controls be used?
  scope: The declared native time comparison of the two archived nights.
  options:
  - id: conditional_diagnostic
    description: Retain source-map and time-contrast tools, report predictive and nuisance limitations, and keep
      physical attribution unresolved.
  - id: physical_map
    description: Interpret fitted source weights as a validated atmosphere and apply an eclipse-derived correction.
  selected: conditional_diagnostic
  reasons:
  - The shared master can be removed algebraically, but time-variable observation effects remain.
  - Held-out predictions and nuisance sensitivity constrain what can be inferred; a visually improved pooled fit
    is insufficient.
  limitations:
  - No source-map feedback on the rate/energy equations; no change to solar-atmosphere Use readiness.
  reconsider_when:
  - A source-map signal survives identified observation nuisances and independent predictive checks.
  - A coupled physical source/opacity response is solved and compared with the validated time operator.
  subject: time_longitude_operator
  context: archived_fixed_atmosphere
  basis:
  - kind: assessment
    id: phase_transfer_assessment
    sha256: e239b1dc099b85947cd1f9804a1d9dc2fcb8743c9f1dd2713a6753de9b567d40
