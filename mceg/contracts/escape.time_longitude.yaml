    - src/escape/longitude_map.py:longitude_weights
    - src/escape/longitude_map.py:source_longitude_kernel
assumptions:
- statement: The same saved converged atmosphere and velocity field are used throughout; the source map changes
    emissivity and boundary contrast at fixed extinction.
  evidence:
  - formulation
limitations:
- statement: 'Archive covariance, exact timing/ephemeris metadata and time-variable stellar or calibration effects
    remain unresolved. Stellar eclipse occultation is absent from the source-map observer: the primary phase cutoff
    0.435 excludes first contact under the adopted geometry and 150-second exposures. No NUTS readiness or full
    physical atmosphere validation is asserted.'
  evidence:
  - diagnostic_review
domains:
- kind: numerical_evaluation
  status: documented
  description: Positive native ratios and nonnegative transfer coefficients for the supplied finite experiment.
  conditions:
  - Primary science phases 0.30 to 0.435; stellar velocity window 110 to 390 km/s; no all-pairs double counting.
  evidence:
  - formulation
