claims:
- id: time_operator
  revision: '1'
  kind: numerical_verification
  statement: The implemented weighted time projection cancels a common multiplicative master and retains the correct
    supported rank in the recorded finite tests.
  scope: Supplied positive native ratios and fixed weights, with finite derivative and injection-recovery probes.
  equations:
  - id: profiled_time_contrast
    revision: '1'
- id: source_operator
  revision: '1'
  kind: numerical_verification
  statement: The local-source kernel recovers the uniform-map observer and implements the stated fixed-opacity longitude
    transfer in the recorded finite checks.
  scope: Saved atmospheric inputs and the tested geometry/map configurations. Numerical refinement scope is recorded
    separately; no atmospheric self-consistency claim.
  equations:
  - id: longitude_source
    revision: '1'
- id: phase_transfer
  revision: '1'
  kind: numerical_verification
  statement: The six-parameter phase fit trained on August 8 gives a lower held-out August 20 overlap score than
    the two-parameter shared fit under the declared native time objective.
  scope: This specific fixed atmosphere, diagonal objective, phase overlap and fitted solutions; not all phase-dependent
    atmospheres.
  equations:
  - id: profiled_time_contrast
    revision: '1'
- id: map_transfer
  revision: '1'
  kind: numerical_verification
  statement: The shared four-parameter longitude map trained on either night improves the other night overlap score
    relative to the shared uniform source under the declared objective.
  scope: The two recorded training/test directions, fixed atmosphere, pre-contact selection and local bounded solutions.
  equations:
  - id: profiled_time_contrast
    revision: '1'
  - id: longitude_source
    revision: '1'
- id: physical_longitude
  revision: '1'
  kind: physical_validation
  statement: The inferred longitude source pattern represents planetary atmospheric structure shared by both nights
    rather than time-dependent observation effects.
  scope: Prospective physical interpretation of this fixed-opacity diagnostic.
  equations:
  - id: profiled_time_contrast
    revision: '1'
  - id: longitude_source
    revision: '1'
  - id: eclipse_remaster
    revision: '1'
equations:
- id: profiled_time_contrast
  revision: '1'
  latex: \begin{aligned}d_{ep}&=\log(1+r_{ep})-\log f_{ep}(\theta),\\ \widehat c_p&=\frac{\sum_e w_{ep}d_{ep}}{\sum_e
    w_{ep}},\qquad Q(\theta)=\sum_{ep}w_{ep}(d_{ep}-\widehat c_p)^2.\end{aligned}
  description: Profile an arbitrary shared log spectrum at each native wavelength within one night/order. Each column
    has E_p minus one supported temporal contrasts.
  scope: Positive ratios, fixed nonnegative diagonal log weights; no recovered extraction covariance or absolute
    spectrum.
  symbols:
    data:
      latex: r_{ep}
      description: Archived residual in exposure e at native pixel p
      unit: '1'
    model:
      latex: f_{ep}
      description: Continuum-normalized model flux evaluated before the logarithm
      unit: '1'
    weight:
      latex: w_{ep}
      description: Supplied inverse log variance; zero excludes a sample
      unit: '1'
    common:
      latex: \widehat c_p
      description: Profiled common log offset per night, order and wavelength
      unit: '1'
  assumptions:
  - The original reduction is multiplication by one positive shared master at a common native wavelength.
  - Time-variable stellar and continuum terms do not cancel.
  - The supplied diagonal error model is a conditional score, not a calibrated likelihood.
  evidence:
  - formulation
- id: longitude_source
  revision: '1'
  latex: W(\lambda;a,b)=\frac{\exp(a\cos\lambda+b\sin\lambda)}{\pi^{-1}\int_{-\pi/2}^{\pi/2}\exp(a\cos u+b\sin u)\,du},\qquad
    \frac{dI_\nu}{ds}=-\chi_\nu I_\nu+W(\lambda)j_\nu.
  description: A positive normalized dayside source map multiplies local emissivity at its actual longitude and
    local Doppler velocity. Extinction remains fixed.
  scope: Latitude-independent source redistribution of one saved atmosphere; not new population or energy equilibrium.
  symbols:
    map:
      latex: W,a,b,\lambda
      description: Dayside map, shape coefficients and longitude from substellar meridian
      unit: '1'
    intensity:
      latex: I_\nu
      description: Specific intensity at one spectral coordinate
      unit: spectral intensity
    extinction:
      latex: \chi_\nu
      description: Fixed nonnegative extinction
      unit: cm^-1
    emission:
      latex: j_\nu
      description: Prescribed emissivity before map multiplication
      unit: spectral intensity cm^-1
    distance:
      latex: s
      description: Distance along a ray toward the observer
      unit: cm
  assumptions:
  - The transmitted and subtracted lower-boundary continuum both receive the same base-longitude map.
  - Dayside-only opacity/emission and opaque-planet geometry are inherited from the saved observer.
  - Global contrast and RV are shared across all phases and nights.
  evidence:
  - formulation
- id: eclipse_remaster
  revision: '1'
  latex: 1+r^{\prime}_{ep}=\frac{1+r_{ep}}{\sum_{f\in\mathcal R}\alpha_{fp}(1+r_{fp})/\sum_{f\in\mathcal R}\alpha_{fp}}.
  description: Reform a reference from already divided archived ratios, retaining its shared effect on science bins.
  scope: Conditional common-master algebra; geometric eclipse membership and archive covariance remain unresolved.
  symbols:
    ratio:
      latex: r_{ep},r^{\prime}_{ep}
      description: Original and reformulated science residual
      unit: '1'
    reference:
      latex: \mathcal R,\alpha_{fp}
      description: Reference exposure selection and fixed averaging weights
      unit: '1'
  assumptions:
  - Reference uncertainty is correlated between science bins.
  - Reference-only propagation is not the complete extraction/master covariance.
  evidence:
  - formulation
