schema_version: '0.4'
model:
  id: escape.time_longitude
  name: Native time contrasts and shared longitude source diagnostics
  description: Separate unknown common references from time-variable source-map tests and eclipse controls.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exojax-escape
    revision: e6c7a54b833f18b92f97e837ee20707e6fd7ce1a
