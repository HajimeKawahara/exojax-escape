follow_ups:
- id: coupled_population_response
  target_kind: assessment
  target: profile_improvement_review
  action: Replace selected escape/shielding rates consistently with resolved transport and solve populations
    and thermal balance before comparing the rendered observed profile.
  requires:
  - Avoid double counting trapped photons or conditional conversion exits.
  - Resolve the omitted redistribution and multilevel cascade-return assumptions; converge the lower-cell net
    rates over the required bandwidth.
  - Use the same observation operator and compare with the unchanged baseline.
  completion: Record a new converged atmosphere, conservation checks and an observed-profile comparison; preserve
    these fixed-state results.
