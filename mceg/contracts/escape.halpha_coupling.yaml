    - src/escape/spherical_radiation.py:solve_spherical_transfer
    - examples/halpha_geometry_effect.py:field_rates
    - examples/halpha_velocity_effect.py:moving_transfer
    - examples/halpha_geometry_effect.py:photon_fates
    - examples/halpha_conversion_effect.py:absorption_chain
assumptions:
- statement: Use the identical saved PR12/13 eight-cell atmosphere; populations, temperature and wind remain
    fixed.
  evidence:
  - formulation
limitations:
- statement: No new SE/thermal solution or observed fit; dark diffuse boundaries and the stated conditional
    recycling exits limit physical inference.
  evidence:
  - formulation
domains:
- kind: numerical_evaluation
  status: documented
  description: Recorded frozen-atmosphere diagnostics and independent finite controls.
  conditions:
  - Eight physical cells from 1 to 3 Rp, three resolved H-alpha branches and the recorded current state.
  - Primary receiver cell 4 spans 1.3 to 1.725 Rp; it is a shell-volume average in spherical transfer.
  evidence:
  - formulation
