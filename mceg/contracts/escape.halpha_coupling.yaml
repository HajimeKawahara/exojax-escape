equations:
- id: formal_transfer
  revision: '1'
  latex: \frac{dI_{\tilde\nu}}{ds}=\eta_{\tilde\nu}-\chi_{\tilde\nu}I_{\tilde\nu},\qquad J_{\tilde\nu}=\frac{1}{4\pi}\int
    I_{\tilde\nu}\,d\Omega.
  description: Finite-ray transfer with prescribed coefficients and dark diffuse boundaries.
  scope: Static slab/sphere and piecewise homogeneous moving subsegments, with a fixed atmosphere.
  symbols:
    intensity:
      latex: I_{\tilde\nu},J_{\tilde\nu}
      description: Intensity per wavenumber and its angular average
      unit: erg s^-1 cm^-2 sr^-1 (cm^-1)^-1
    opacity:
      latex: \chi_{\tilde\nu}
      description: Extinction per path length
      unit: cm^-1
    emission:
      latex: \eta_{\tilde\nu}
      description: Emission per volume, solid angle and wavenumber
      unit: erg s^-1 cm^-3 sr^-1 (cm^-1)^-1
    path:
      latex: s
      description: Distance along a ray
      unit: cm
  assumptions:
  - Prescribed source, opacity and boundaries; no SE or thermal re-equilibration.
  - Slab depth averages and spherical volume averages are distinct geometries.
  evidence:
  - formulation
- id: line_removal
  revision: '1'
  latex: R_{i\leftarrow j}=\int d\Omega\int d\tilde\nu\,\frac{\chi^{\rm line}_{i,\tilde\nu}(\mathbf n)I^{(j)}_{i,\tilde\nu}(\mathbf
    n)}{hc\tilde\nu}.
  description: Receiver-frame net line removal, decomposed by emitting cell; static opacity gives the usual
    4 pi J form.
  scope: H-alpha line transfer diagnostics; coefficients include stimulated emission, so this is not a gross
    upward Einstein rate.
  symbols:
    rate:
      latex: R
      description: Net photon removal per receiver volume
      unit: cm^-3 s^-1
    frequency:
      latex: \tilde\nu
      description: Wavenumber
      unit: cm^-1
    energy:
      latex: hc\tilde\nu
      description: Photon energy
      unit: erg
  assumptions:
  - Emission and intensity use the same per-wavenumber measure.
  - Subtract spontaneous emission separately to obtain the frozen net radiative excitation.
  evidence:
  - formulation
- id: doppler_projection
  revision: '1'
  latex: \tilde\nu_{b,\mathrm{lab}}\simeq\tilde\nu_b(1+\mathbf n\cdot\mathbf v/c).
  description: The same projected velocity shifts emitter and receiver branch profiles along each chord.
  scope: Nonrelativistic radial-flow diagnostic; no aberration, relativistic intensity transformation or partial
    redistribution.
  symbols:
    frequency:
      latex: \tilde\nu_b
      description: Branch rest wavenumber
      unit: cm^-1
    velocity:
      latex: \mathbf v
      description: Radial gas velocity
      unit: km s^-1
    direction:
      latex: \mathbf n
      description: Photon propagation unit vector
      unit: '1'
  assumptions:
  - The common boost control translates both spectral grid and line centers in the narrow-band Galilean approximation.
  - Hypothetical upper-layer boosts are distinct from actual saved flow and fitted observer LOS displacements.
  evidence:
  - formulation
- id: recycling
  revision: '1'
  latex: B=(\mathsf I-Q)^{-1}D,\qquad N=(\mathsf I-Q)^{-1}E,\qquad B\mathbf 1=\mathbf 1.
  description: Absorbing Markov process for final outcomes and expected gross events, including reverse H-alpha/Ly-beta
    exchange.
  scope: Conditional H n=3/O I resonance network with positive true absorption and complete redistribution
    in fixed spherical cells.
  symbols:
    transition:
      latex: Q
      description: Transient state transition probabilities
      unit: '1'
    terminal:
      latex: D,B
      description: Single-step and eventual terminal probabilities
      unit: '1'
    events:
      latex: E,N
      description: Single-step rewards and expected total event counts
      unit: '1'
  assumptions:
  - Non-resonant O I cascades, excursions to other H shells and ionization are conditional exits, not permanent
    destruction of atmospheric energy.
  - No stimulated multiplication; electron/Rayleigh scattering, O I collisions and O I photoionization are
    omitted.
  - The native Ly-beta continuum is constant over the narrow resonance group.
  - The saved population/rate state is checked against the primary current atmosphere.
  evidence:
  - formulation
