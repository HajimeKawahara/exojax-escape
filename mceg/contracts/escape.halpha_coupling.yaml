schema_version: '0.4'
model:
  id: escape.halpha_coupling
  name: Frozen H-alpha transport and photon recycling
  description: Parallel geometry, moving-profile and H-alpha/Ly-beta/O I diagnostics, with numerical support
    separate from physical profile improvement.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exojax-escape
    revision: 6bae46ad845431b3ce81ed959cdfef5010b4bcc2
