decisions:
- id: conditional_interleave_inference
  revision: '1'
  question: How should eclipse-constrained NUTS be interpreted after finding native spectral covariance?
  scope: This archived fixed-atmosphere experiment.
  options:
  - id: conditional
    description: Use a fixed original-pixel interleave, compare the complementary selection, and report conditional
      uncertainty and unresolved covariance.
  - id: full_native
    description: Treat all native spectral pixels as independent after the time GP.
  selected: conditional
  reasons:
  - The eclipse-only discrepancy contradicts all-native diagonal spectral noise.
  - Alternating pixels remove the strongest observed adjacent coupling without inventing a recovered extraction
    covariance.
  limitations:
  - The two interleaves are correlated and must not be combined as independent data.
  - No change to full solar-atmosphere Use readiness.
  reconsider_when:
  - A wavelength/order covariance model is independently validated and supports retaining all native samples.
  subject: time_gp_operator
  context: archived_gp_experiment
  basis:
  - kind: assessment
    id: native_neighbor_covariance_assessment
    sha256: 828a0de0a36229d0831d579ca9a9a971ba657983956ad9b7ad3bfdbf7f7a7249
  - kind: assessment
    id: physical_separation_assessment
    sha256: 1f20977b1b3f04b0e7f5fb36d9549c7d8f7ae8c9f2a3a2db957321238364fea5
follow_ups:
- id: validate_observation_covariance
  target_kind: assessment
  target: physical_separation_assessment
  action: Test wavelength and cross-order covariance, GP prior sensitivity and independent eclipse extrapolation
    before interpreting a physical phase or longitude map.
  requires:
  - Additional control data or a quantitatively tested covariance model.
  - Joint-hyperparameter calibration beyond the known-noise local injection tests.
  completion: Record new scoped evidence and an Assessment without replacing the original covariance contradiction
    or the current conditional result.
