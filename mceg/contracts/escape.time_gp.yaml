schema_version: '0.4'
model:
  id: escape.time_gp
  name: Eclipse-constrained time GP and conditional NUTS
  description: Marginalize smooth time nuisances, test eclipse controls and keep sampler convergence separate from
    observational adequacy.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exojax-escape
    revision: f649bea4e6cf930624db65c38fa6e1e7740c1b4c
    entry_points:
    - src/escape/time_gp.py:time_gp_loglike
    - src/escape/time_gp.py:time_gp_predict
    - examples/gp_halpha.py:make_model
assumptions:
- statement: Temperature, populations, opacity and velocities retain the previously saved atmosphere. Only its shared
    RV and contrast are sampled with noise hyperparameters.
  evidence:
  - formulation
limitations:
- statement: The archive lacks independent timing/ephemeris and extraction covariance. There is a 79-minute science/eclipse
    gap, no first-night eclipse control, unresolved inter-order covariance and residual wavelength covariance. This
    is not full-atmosphere NUTS validation.
  evidence:
  - investigation
domains:
- kind: numerical_evaluation
  status: documented
  description: Positive native ratios with fixed finite log-error proxies.
  conditions:
  - Science phases 0.30 <= phase < 0.435; eclipse 0.47 <= phase <= 0.5; stellar window 110 to 390 km/s.
  - Primary original pixel stride 2 offset 0; offset 1 tested separately.
  evidence:
  - formulation
