contexts:
- id: finite_gp_checks
  scope: Dense likelihood/derivative/conditional-moment tests and common-master invariance.
- id: archived_gp_experiment
  scope: Conditional fixed-atmosphere inference, held-out eclipse blocks, known-noise injections and native covariance
    discrepancies.
  settings:
    science_exposures: 104
    eclipse_exposures: 15
    primary_rank: 38340
    alternative_rank: 38189
    gp_prior_amplitude: 0.0003
    gp_prior_length_minutes: 20
claims:
- id: gp_operator
  revision: '1'
  kind: numerical_verification
  statement: The marginal GP likelihood, determinants, derivatives and predictive moments agree with independent
    dense projected-covariance calculations in the recorded finite tests.
  scope: Tested nonuniform weights, masks, zero-GP limit and new-time predictions; not universal numerical accuracy.
  equations:
  - id: contrast_likelihood
    revision: '1'
- id: conditional_sampler
  revision: '1'
  kind: numerical_verification
  statement: The final conditional posterior comparisons listed in the receipt satisfy the declared rank-Rhat, effective-sample
    and divergence criteria.
  scope: The final assessed chain sets, using the saved atmosphere and declared priors. Preliminary diagnostics
    and any extensions are retained separately.
  equations:
  - id: time_noise
    revision: '1'
  - id: contrast_likelihood
    revision: '1'
- id: native_neighbor_covariance
  revision: '1'
  kind: numerical_verification
  statement: The original adjacent-pixel correlations in both eclipse orders lie within the 95 percent conditional
    envelopes generated by the fitted time GP with diagonal spectral white noise.
  scope: Original full native pixel selection and the recorded eclipse residual discrepancy; not a test of every
    covariance kernel.
  equations:
  - id: time_noise
    revision: '1'
- id: physical_separation
  revision: '1'
  kind: physical_validation
  statement: The inferred planet spectrum is uniquely separated from observational and stellar systematics by the
    eclipse-constrained time GP.
  scope: Prospective interpretation of these two archived nights, beyond conditional sampler convergence.
  equations:
  - id: time_noise
    revision: '1'
  - id: contrast_likelihood
    revision: '1'
equations:
- id: time_noise
  revision: '1'
  latex: \begin{aligned}y_{ep}&=m_{ep}(\theta)+c_p+a(t_e)+x_pb(t_e)+\epsilon_{ep},\\ k_j(t,t^{\prime})&=A_j^2(1+\sqrt{3}|t-t^{\prime}|/\ell)\exp(-\sqrt{3}|t-t^{\prime}|/\ell).\end{aligned}
  description: A grey coefficient and a spectral slope have independent Matern-3/2 priors, with one common time
    length within each independent night/order.
  scope: Fixed native wavelengths, saved atmosphere and adopted eclipse geometry; diagonal white noise with an inferred
    scale.
  symbols:
    data:
      latex: y,m,c
      description: Log archived ratio, log model and unknown common native log spectrum
      unit: '1'
    coefficients:
      latex: a,b,A_j
      description: GP log-flux coefficients and prior amplitudes
      unit: '1'
    coordinate:
      latex: x_p
      description: Stellar velocity centered on 250 km/s and divided by 140 km/s
      unit: '1'
    time:
      latex: t,\ell
      description: Relative observing time and correlation length
      unit: min
  assumptions:
  - Independent night/order processes; no recovered cross-order covariance.
  - A planet confined within 3 Rp is fully eclipsed in the selected 15 exposures.
  - Saved phase-dependent spectra from one atmosphere have only a shared velocity offset and contrast fitted.
  - The time kernel is evaluated at exposure centers, without averaging over the 150-second exposures.
  evidence:
  - formulation
- id: contrast_likelihood
  revision: '1'
  latex: \begin{aligned}d&=CD_0^{-1/2}(y-m),\quad G=CD_0^{-1/2}B,\quad\Sigma=s^2I+GKG^T,\\ \log p(d)&=-\tfrac12[d^T\Sigma^{-1}d+\log|\Sigma|+R\log(2\pi)],\quad
    R=\sum_p\max(E_p-1,0).\end{aligned}
  description: Remove the common spectrum with the same contrast operator on the mean and covariance, and analytically
    marginalize GP coefficients.
  scope: Fixed whitened orthonormal contrast measure; only parameter-independent measure constants omitted.
  symbols:
    contrast:
      latex: C
      description: Orthonormal rows orthogonal to the whitened common-spectrum design
      unit: '1'
    noise:
      latex: D_0,s,\Sigma
      description: Fixed first-order log-error proxy, inferred scale and projected covariance
      unit: '1'
    design:
      latex: B,G,K
      description: GP design, projected design and coefficient covariance
      unit: '1'
    rank:
      latex: R,E_p
      description: Supported contrast rank and valid exposure count at pixel p
      unit: '1'
  assumptions:
  - Each wavelength retains E_p minus one contrasts, not all pair differences as independent samples.
  - Fixed relative training Cholesky regularization is 1e-10 and scales with GP amplitude squared.
  - Original even and odd pixels are separate sensitivity fits, never independent factors of one likelihood.
  evidence:
  - formulation
