contexts:
- id: solar_proxy
  scope: Selected native solar-proxy atmosphere, initially at the documented KELT-9b-like reference point;
    finite component controls are named separately. No NUTS-domain or exact author-reproduction claim.
  settings:
    target_composition: C23 default.abn solar; retained subset explicit in src/escape/solar.py
    mass_loss_initial_g_s: 10000000000000.0
    stellar_proxy: Unbroadened PHOENIX 10000 K, logg=4, solar; incident F=0.1 Fsurface, zero outside 500
      A--5.5 micron, original arrays not redistributed
    temperature_min_k: 4000
    temperature_max_k: 14000
    hydrogen_nmax: 15
    hydrogen_collision_model: anderson_lebedev
    iron_levels: 716
    oxygen_lybeta_overlap: resolved CRD with shared continuum receivers
    reference_max_pressure_bar: 0.001
    reference_max_hydrogen_density_cm3: 1000000000000000.0
    dense_lower_boundary: Fixed-cell mask, linear4500K-to-join temperature, retained/table partitions,
      H-minus Saha, metal Kirchhoff replacement; choice must be bounded
    reference_state_rtol: 0.05
    reference_heating_cooling_rtol: 0.05
    reference_refinement_rtol: 0.01
    observer_error_sigma: 0.1
    reference_refinement_sigma: 0.02
evidence:
- id: formulation
  kind: implementation
  summary: The human-readable equations and selected code define the coupled model. They establish a formulation,
    not physical adequacy.
  scope: Current source-selected formulation; verification results require separately pinned execution
    evidence.
  sources:
  - doc/solar_atmosphere.tex
  - doc/escape_probability.tex
  - src/escape/solar.py
  subject: solar_observer
  context: solar_proxy
  provenance:
    role: primary
    inspection: inspected
    location: Code/formulation review
    note: No numerical or physical support is inferred from this record.
- id: known_concerns
  kind: implementation
  summary: Known reference and native concerns continue the implementation/verification loop.
  scope: C23 species2.cpp:setXtraRatesO1 explicitly notes ticket78 and an invalidated independent-escape
    approximation after overlap. C23 ordinary iteration tolerance may retain stale total columns. Stellar
    bin-center sampling can miss narrow PHX absorption. Native overlap and several retained-species reductions
    need effect bounds. FeII excited photoionization is a shared untested C23 approximation. Default local
    convergence does not bound state error; the measured small electron source/sink residual rules out
    the hard-coded five-percent electron guard as the sole cause. Native Fe-II Ly-alpha overlap is not
    yet coupled; its fixed-profile observable bound does not bound thermal feedback. Coarse exclusive-front
    line columns can miss self-feedback within an inverted cell. Unmasked dense full-SE controls exceed
    the published lower-domain limit; fixed mask applicability and lower boundary sensitivity must be
    checked.
  sources:
  - doc/solar_atmosphere.tex
  subject: solar_observer
  context: solar_proxy
  provenance:
    role: primary
    inspection: inspected
    location: C23.01 source and current continuation diagnostics, see model document
    note: A reference discrepancy is not automatically a native defect. Require independent numerical
      convergence and paired causal controls.
