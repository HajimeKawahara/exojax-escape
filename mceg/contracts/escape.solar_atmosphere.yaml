- id: resolve_complete_root
  target_kind: assessment
  target: complete_root_review
  action: Run the complete selected path with its explicit dense boundary, preserve nonlinear/linear diagnostics
    and conservation errors; independently require reference_domain_valid. Do not replace failed upper
    roots with prescribed profiles or demand full-SE thermal balance in the declared dense extrapolation.
  completion: Retain current-source scoped evidence and a reviewed Assessment against the unchanged criterion.
    An open requirement causes further work; creating a Draft PR does not satisfy it.
- id: resolve_implicit_derivative
  target_kind: assessment
  target: implicit_derivative_review
  action: Compare actual complete-path gradients, not only an isolated rate or manufactured root; failed
    tangent solves remain failures.
  completion: Retain current-source scoped evidence and a reviewed Assessment against the unchanged criterion.
    An open requirement causes further work; creating a Draft PR does not satisfy it.
- id: resolve_reference_agreement
  target_kind: assessment
  target: reference_agreement_review
  action: 'Converge and qualify both solvers; compare atomic populations, explicitly matched heating/cooling
    channels, T/mu/wind and the same observer. Verify that requested reference options appear in the executed
    input echo and actual operator; match compiler flags and physical-output controls before classifying
    reference instrumentation as readout-only. Retain inactive-option and changed-iteration-policy controls
    separately. Retain the radiation emitted by native lower LTE cells when extracting an upper-column
    comparison; verify actual two-sided boundary action rather than keyword acceptance. Keep piecewise-constant
    RT cells distinct from an interpolated DLAW/TLAW reference and start with matched-state/field operator
    checks. Match the continuum closure as well as boundaries: native bidirectional formal transfer differs
    from C23 OU2 effective RR/OTS and a single outward beam. Keep OU3 controls distinct from the default
    reference. Resolve or quantitatively bound the recorded excited-Ca source/receiver inconsistency before
    using reference agreement as physical support; do not copy an inconsistent allocation to force agreement.
    Net excited bound-free and species line exchanges consistently before comparing C23 totals; do not
    label differences of bookkeeping conventions as missing physics. Continue causal corrections when
    an unchanged criterion fails.'
  completion: Retain current-source scoped evidence and a reviewed Assessment against the unchanged criterion.
    An open requirement causes further work; creating a Draft PR does not satisfy it.
- id: resolve_reduction_adequacy
  target_kind: assessment
  target: reduction_adequacy_review
  action: Measure remaining overlap, excited-He, high charge stages and omitted elements/molecules with
    paired controls. Bound the outer thermal/composition extension separately from wind-grid convergence;
    do not treat a zero endpoint advective term or independent ODE agreement with the same prescription
    as physical validation. For Ly-alpha/Fe, first verify tracking-only C23 output parity, then remove
    only the historically added Fe destruction from generic OTS while retaining direct H/Fe exchange;
    compare photons, Gamma/Lambda and populations, then re-solve the thermal/wind atmosphere and observable.
    Do not infer adequacy from fixed-state conservation or kernel parity. Bound the hard Fe depth threshold
    and static width-fit choices, and retain the known C23 O I ticket78 obligation.
  completion: Retain current-source scoped evidence and a reviewed Assessment against the unchanged criterion.
    An open requirement causes further work; creating a Draft PR does not satisfy it.
- id: resolve_numerical_resolution
  target_kind: assessment
  target: numerical_resolution_review
  action: Resolve illuminated skins and dense layers; sample narrow stellar pumping at actual line centers;
    refine both wind velocity and its thermal-flow derivatives at the actual solved profile; check Cloudy
    total/current optical depths and explicit strict iteration convergence.
  completion: Retain current-source scoped evidence and a reviewed Assessment against the unchanged criterion.
    An open requirement causes further work; creating a Draft PR does not satisfy it.
- id: resolve_observational_use
  target_kind: assessment
  target: observational_use_review
  action: Connect the actual spectra, phase/occultation treatment, stellar mask and coadd; bound unavailable
    author settings and lower-boundary effects. NUTS adequacy is a separate later domain claim.
  completion: Retain current-source scoped evidence and a reviewed Assessment against the unchanged criterion.
    An open requirement causes further work; creating a Draft PR does not satisfy it.
- id: component_investigate_front_observer
  target_kind: assessment
  target: component_front_observer_review
  action: Compare within-cell line sampling at identical source and conditions, holding the observer validity
    rule fixed.
  completion: Retain the failed front case and a separately assessed finite observer repair; do not relabel
    the original claim true.
- id: component_replace_sparse_flow
  target_kind: assessment
  target: component_sparse_flow_review
  action: Differentiate the same regular wind and sound-speed profiles as momentum; connect both coupled
    paths; verify sonic regularity, parameter derivatives and energy-grid refinement.
  completion: Retain the failed sparse-density context and a separately pinned, tested energy-gradient
    implementation. Full thermal-profile adequacy remains a separate requirement.
- id: component_check_solved_wind_energy
  target_kind: assessment
  target: component_sharp_wind_review
  action: Use the independent ODE in the external reference and repeat native derivative/refinement checks
    at every final solved thermal profile; repair the native representation if the declared 1% criterion
    fails.
  completion: A source-pinned solved-profile comparison meets the unchanged accuracy requirement. Initial
    five-point support alone is insufficient.
- id: component_isolate_calcium_reference_budget
  target_kind: assessment
  target: component_calcium_reference_review
  action: Separate allocation-only and coupled H-destruction corrections; verify source/receiver event
    accounting and quantify the converged planetary thermal/observer effect with matched controls.
  completion: Conserved local allocation and numerically converged atmospheric sensitivity establish a
    correction or an explicit quantitative bound. Do not reproduce a reference inconsistency to obtain
    agreement.
- id: component_resolve_thermal_spatial_model
  target_kind: assessment
  target: component_current_thermal_root_review
  action: Refine the atmosphere, including the broad 1.3--3 Rp outer cell, re-solve the complete thermal
    equations, and repeat independent wind, observer and gradient checks. Resolve the spectral mismatch
    through controlled numerical and physical comparisons.
  completion: The declared atmospheric/observer resolution criteria pass on independently converged thermal
    roots; a small five-cell residual alone is insufficient.
- id: component_repair_conditioned_sensitivity
  target_kind: assessment
  target: component_fixed_loose_jvp_review
  action: Tighten the true implicit linear solve, retain the original finite differences for a paired
    control, then independently reduce the finite step and assess the complete thermal branch.
  completion: The original failed context remains contradicted; separately pinned repaired controls meet
    the unchanged observable criterion.
- id: component_repair_radiation_resolution
  target_kind: assessment
  target: component_coarse_radiation_resolution_review
  action: Diagnose and repair or refine the actual radiation integrals, then re-solve the complete thermal
    equations on the selected source and repeat the identical refined observer comparison. Preserve this
    failed coarse control; refine further until consecutive accepted roots satisfy the unchanged criterion.
  completion: Executed source-pinned complete roots pass the original1e-9 residual and applicability gates,
    and independent radiation refinement changes the processed prediction by less than0.1 supplied errors.
    An open FollowUp or Draft PR is not completion.
decisions:
- id: component_reject_front_observer
  revision: '1'
  question: May this converged front-face two-cell root be used as an observable or derivative control?
  scope: Only the recorded front-face case and source; no blanket rejection of front sampling in resolved
    cells.
  subject: component_line_cd76343
  context: component_two_cell_front
  options:
  - id: reject
    description: Reject this nonfinite observer; retain the counterexample and use separately assessed
      applicable controls.
  - id: accept
    description: Accept population convergence alone despite the failed observer.
  selected: reject
  reasons:
  - The actual observer is nonfinite because the outer H-alpha extinction is negative. Zero derivatives
    of masked NaNs cannot be evidence.
  basis:
  - kind: assessment
    id: component_front_observer_review
    sha256: 7f997a94fb30f518ad72794c20073fa26a3a827b6ae6d493c6c06ace06de3c66
  limitations:
  - The alternative average control establishes numerical observability only; atmospheric and spatial
    adequacy remain unresolved.
  reconsider_when:
  - A separately source-pinned treatment or resolved spatial control demonstrates an applicable observer
    and valid derivatives.
- id: component_reject_sparse_flow
  revision: '1'
  question: May sparse raw-density differences supply thermal closure on this coarse Parker atmosphere?
  scope: The recorded coarse grid, not a rejection of finite differences on independently resolved profiles.
  subject: component_five_cell_snapshot
  context: component_five_cell_fixed_temperature
  options:
  - id: replace
    description: Use derivatives of the same wind/profile interpolants and check energy resolution.
  - id: retain
    description: Reuse the sparse density differences because the wind velocity converged.
  selected: replace
  reasons:
  - The demonstrated expansion-cooling error is orders of magnitude above the 1% criterion; matching arrays
    and a converged velocity do not verify their derivatives.
  basis:
  - kind: assessment
    id: component_sparse_flow_review
    sha256: 3cbe6cf4f6e78c302945917a240e3635262e207d9408577cd31f1c3fcafb5ca4
  limitations:
  - The repaired derivative does not establish a thermally equilibrated atmosphere or reference adequacy.
  reconsider_when:
  - A separately pinned, resolved sampled-density comparison meets the thermal derivative criterion.
- id: component_reject_loose_sensitivity
  revision: '1'
  question: May the original sensitivity tolerance certify this spectral derivative?
  scope: The recorded fixed-temperature five-cell control and observable; not a universal linear tolerance
    requirement.
  subject: component_solar_4473ed7
  context: component_five_cell_fixed_loose
  options:
  - id: tighten
    description: Reject the failed observable criterion and use separately assessed tighter solves.
  - id: retain
    description: Accept the small linear residual despite the failed spectral criterion.
  selected: tighten
  reasons:
  - The actual spectral error exceeds the unchanged 1e-4 threshold. A paired linear-tolerance correction
    and independent smaller-step roots separately pass.
  basis:
  - kind: assessment
    id: component_fixed_loose_jvp_review
    sha256: 6470a32bd9f3c992a31211a00e0d59e4db3fe7661b8c72d40e8afa082b29d0e9
  limitations:
  - The repaired local check does not establish production reverse AD, global smoothness or the NUTS parameter
    domain.
  reconsider_when:
  - A new separately pinned solver or control demonstrates the unchanged actual-observable criterion.
- id: component_fe_ca_original_reject_incomplete_budget
  revision: '1'
  subject: component_fe_ca_original
  context: component_fe_ca_active_three_cell
  question: May this source variant be treated as a photon-conserving reference for the declared local
    Ly-alpha budget?
  scope: Only this executed source variant and active three-cell blackbody context; original failed assessments
    remain contradicted.
  options:
  - id: reject
    description: Reject this incomplete allocation as a reference for the failed ledger; retain it as
      a causal baseline and assess both corrections under a distinct Subject.
  - id: accept
    description: Accept this variant despite its failed declared source/receiver identity.
  selected: reject
  reasons:
  - The unchanged allocation criteria fail for FE, CA. A repair of the other ledger cannot waive this
    failure.
  - The combined variant has separate source pins and scoped support; no result is retroactively transferred
    to this Subject.
  basis:
