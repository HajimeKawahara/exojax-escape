  revision: '1'
  kind: numerical_verification
  statement: The specified native five-cell radiation/population/composition/wind and upper-cell thermal
    equations have a finite valid root with maximum residual below 1e-9.
  scope: The declared discrete model and prescribed lower boundary, exact source/input and numerical settings.
    No claim of a resolved atmosphere, reference equivalence, fit or inference readiness.
- id: component_preconditioned_implicit
  revision: '1'
  kind: numerical_verification
  statement: Optional linear preconditioning preserves the root and implicit forward/adjoint derivatives
    in the declared manufactured controls, and does not replace the true linear residual criterion.
  scope: The named numerical controls and neighboring tests; not a condition-number bound or full solar
    implementation check.
- id: component_five_cell_spectral_jvp
  revision: '1'
  kind: numerical_verification
  statement: The exact implicit spectral JVP agrees with independently re-solved centered finite differences
    within 1e-4 relative maximum spectral derivative error.
  scope: The specified thermal blend, source, root and local mass-loss step, using exact JAX products
    with host linear/root orchestration. Production reverse AD and atmospheric resolution are separate.
- id: component_thermal_observer_sampling
  revision: '1'
  kind: numerical_verification
  statement: The declared individual and joint observer sampling refinements change the processed prediction
    by less than 0.1 of each supplied observational error at the observed wavelengths.
  scope: The same five-cell thermal root and approximate reduction; no atmospheric/atomic/radiation-grid
    convergence, fit or exact author-reduction claim.
- id: component_fe_lya_ots_allocation
  revision: '1'
  kind: numerical_verification
  statement: At each executed H Ly-alpha OTS update, total H destruction equals generic continuum OTS
    plus the historically retained direct-Fe addition within 1e-12 relative error, with Fe overlap actually
    active.
  scope: Historical source-event allocation in the declared three-cell control; not a complete photon/energy
    budget or current-rate equality at every asynchronous iteration.
- id: component_ca_lya_bin_allocation
  revision: '1'
  kind: numerical_verification
  statement: At each executed OTS update, the Ly-alpha-bin line source equals the stored photon field
    times base absorbing opacity plus the four actual excited-Ca receiver opacities within 1e-6 relative
    error.
  scope: One declared continuum-bin allocation, including float32 accumulation; not broadband radiative
    conservation, an LTE limit or atmospheric adequacy.
- id: component_ou2_population_root
  revision: '1'
  kind: numerical_verification
  statement: The complete declared external OU2 population/charge/continuum residual is below 1e-9.
  scope: Only the fixed H15 slab and pinned external operator; no thermal/wind or default-continuum claim.
- id: component_ou2_profile_reference
  revision: '1'
  kind: numerical_verification
  statement: At each corresponding 267-cell reference location, n2, n3 and electron density agree within
    5%.
  scope: Standard C23 population reference with matched H15 input and OU2 closure; no claim about every
    species or thermal balance.
- id: component_ou2_recorded_refinements
  revision: '1'
  kind: numerical_verification
  statement: Each explicitly recorded spatial, angular, reference-frequency and full-column population
    refinement changes its tested quantities by less than 1%.
  scope: Native 127-to-267 cells and E2 64-to-128 re-solved roots; C23 127-to-267 cells, 6-to-12 full
    columns, continuum 0.05-to-0.025. Native continuum order4-to-8 is only a frozen-state control, not
    a re-solved profile certificate.
- id: component_ou2_residual_jvp
  revision: '1'
  kind: numerical_verification
  statement: The external discretized OU2 residual JVP agrees with central finite differences within relative
    L2 1e-4.
  scope: A 127-cell root and the explicit discretized E2 quadrature. No implicit solar/NUTS derivative
    or exact tau=0 E2 derivative claim.
- id: component_c23_original_rr_current
  revision: '1'
  kind: numerical_verification
  statement: The repeated-column constant-temperature calculation retains the current positive spontaneous
    RR cooling coefficients.
  scope: Original C23.01 cache policy in the declared six-column 8000 K slab; no inference about varying-temperature
    solar atmospheres or the paper.
- id: component_c23_refreshed_rr_current
  revision: '1'
  kind: numerical_verification
  statement: Re-evaluating the existing beta-dependent RR cooling formula preserves its nonzero cooling
    contribution in the repeated-column control.
  scope: Explicit numerical-cache control; formulas and convergence guards unchanged. It is separate from
    unmodified C23.
- id: component_ou2_same_state_heat
  revision: '1'
  kind: numerical_verification
  statement: At the four identical prescribed states, the grouped H heating and cooling agree separately
    with refreshed-cache C23 within 5%.
  scope: Same-state H kinetic operator grouping only; excludes free-free and other species, and does not
    establish a thermal root or solar agreement.
- id: component_ou2_resolved_frequency
  revision: '1'
  kind: numerical_verification
  statement: Independently solving the complete declared OU2 population/charge/continuum root at quadrature
    orders 4 and 8 changes n2, n3 and ne by less than 1% at every corresponding cell.
  scope: External H15 OU2 fixed-temperature population/charge/continuum model,267cells,matched executed
    source,continuum quadrature4 to8. No native-default bidirectional,solar,thermal/wind,atomic-completeness
    or observer certificate.
- id: component_line_checkpoint_equivalence
  revision: '1'
  kind: numerical_verification
  statement: The checkpointed MetalNetwork.evaluate preserves finite direct F and JVP bitwise in the three
    executed same-state comparisons, and reduces the logical retained linearization-closure shape-byte
    count.
  scope: Three actual Solar directions at one five-cell fine-grid state; logical storage only. No root,
    scientific adequacy, speed, RSS, cached-application or production-reverse claim.
- id: component_cached_jvp_equivalence
  revision: '1'
  kind: numerical_verification
  statement: The executed dynamic cached linearization and independent direct JVP satisfy the predeclared
    finite-output, absolute-primal and normalized-maximum-JVP difference criteria below 1e-12 at the supplied
    state.
  scope: Only the original cached-JVP substitution experiment on source 4473ed7 and its first actual Solar
    direction; no claim about the later checkpointed candidate.
- id: component_public_positive_primal
  revision: '1'
  kind: numerical_verification
  statement: For this source, supplied perturbed near-root seed and compiler setting, the actual public
    atmosphere solver performs positive primal work, returns an applicable solution with residual below1e-9,
    and its finite observer spectrum agrees with the saved host-root spectrum within1e-6 relative maximum
    difference.
  scope: Exactly the executed five-cell warm-seed/compiler control. No generic convergence, reverse derivative,
    fine-grid or physical-equivalence claim.
- id: component_tidal_initialization
  revision: '1'
  kind: numerical_verification
  statement: The declared tidal-initializer, compact-domain branch, sonic and implicit-derivative regression
    cases pass without relaxing the final wind checks.
  scope: Tidal wind initialization and compact-domain regression tests only; no re-solved solar atmosphere
    or physical-boundary adequacy is inferred.
- id: component_coarse_radiation_resolution
  revision: '1'
  kind: numerical_verification
  statement: Joint continuum, angle and line quadrature refinement from2/2/4 to4/4/8, including re-solving
    the full thermal atmosphere, changes its identically processed prediction by less than0.1 of each
    supplied observational error.
  scope: The stated two discrete five-cell roots and identical refined observer. No claim of absolute
    likelihood validation or radial convergence.
- id: component_initial_jax_linear_accuracy
  revision: '1'
  kind: numerical_verification
  statement: The original JAX restart=40/maxcycles=20 policy satisfies the unchanged true linear residual
    criterion at the declared actual public initial seed.
  scope: Exact separately compiled direct JVP, supplied rank-32 inverse and local seeded RHS. Positive
    primal linear solution only.
- id: component_initial_jax_host_limits
  revision: '1'
  kind: numerical_verification
  statement: Replacing the original JAX restart=40/maxcycles=20 policy with restart=80/maxcycles=4 satisfies
    the unchanged true residual criterion on this same seed.
  scope: Transfer of the successful host SciPy work limits to the installed JAX primal loop only.
- id: component_initial_normalized_linear_cost
  revision: '1'
  kind: numerical_verification
