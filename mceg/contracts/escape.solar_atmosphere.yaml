    sha256: 822f3b5401150ffc2b952c8e8b2d550a09054d97f5063ae23fa8d42e41e91d55
  limitations:
  - The selected rejection handles a known local reference defect; it does not establish solar atmosphere,
    thermal equilibrium, numerical refinement, observation processing or NUTS readiness.
  - Support for the corrected local budgets does not resolve any of the six full-use assessments or the
    existing full-atmosphere FollowUps.
  reconsider_when:
  - A separately source-pinned variant passes both unchanged local criteria with the mechanism active
