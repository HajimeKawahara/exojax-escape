evidence:
- id: formulation
  kind: implementation
  summary: The human-readable equations and selected code define the coupled model. They establish a formulation,
    not physical adequacy.
  scope: Current source-selected formulation; verification results require separately pinned execution
    evidence.
  sources:
  - doc/solar_atmosphere.tex
  - doc/escape_probability.tex
  - src/escape/solar.py
  subject: solar_observer
  context: solar_proxy
  provenance:
    role: primary
    inspection: inspected
    location: Code/formulation review
    note: No numerical or physical support is inferred from this record.
- id: known_concerns
  kind: implementation
  summary: Known reference and native concerns continue the implementation/verification loop.
  scope: 'C23 species2.cpp:setXtraRatesO1 explicitly notes ticket78 and an invalidated independent-escape
    approximation after overlap. C23 ordinary iteration tolerance may retain stale total columns. Stellar
    bin-center sampling can miss narrow PHX absorption. Native overlap and several retained-species reductions
    need effect bounds. FeII excited photoionization is a shared untested C23 approximation. Default local
    convergence does not bound state error; the electron source/sink convergence check is disabled by
    an early return in C23; the measured residual is small and does not explain the deep population changes.
    The native Fe-II/Ly-alpha candidate now couples empirical PRD-width pumping, equal-and-opposite hydrogen
    transitions and a redistribution-energy ledger at common quadrature nodes. Its separate conservative
    photon allocation differs from the C23 generic OTS pool and requires a matched reference control.
    The hard Fe total-depth selection and static width-fit guards are known differentiability limits.
    Its fixed-profile observable bound does not bound thermal feedback. C23 heating/cooling totals net
    selected bound-free and line channels before sign classification; native directional totals must not
    be compared to those differently grouped totals. Preserve signed channels and establish a common decomposition
    before the separate Gamma/Lambda criterion. A sharp prescribed 1000-point T/mu control fails the independent
    wind-gradient criterion even at 1025 nodes, whereas the initial five-point profile passes at 129;
    final-profile accuracy must be checked separately. A readout-only C23 one-zone control also contradicts
    excited-Ca opacity/receiver consistency: a zero legacy opacity population differs from the nonzero
    database receiver populations. Reference allocation and its planetary thermal response require separate
    causal controls. Raw-density finite differences on a five-cell wind overestimated outer expansion
    cooling by more than four thousand; the current coupled paths use derivatives of the regular wind/profile
    interpolants. Both wind velocity and energy terms require separate resolution checks at each solved
    atmosphere. The historical center-ended log-Hermite T/mu profiles impose zero endpoint slopes, making
    outermost advective cooling zero by construction. The explicit edge-extension alternative removes
    that constraint at the last thermal center but still needs complete-root and boundary-sensitivity
    tests. Refining a wind grid or matching an independent ODE with the same constant extension verifies
    that numerical closure; it does not establish the physical adequacy of the outer thermal/composition
    boundary. Separate same-state extension controls and re-solved atmosphere bounds are required. Coarse
    exclusive-front line columns can miss self-feedback within an inverted cell. The Doppler escape source
    fit also jumps at sqrt(pi)*tau=.01 and 11; paired Fe and H controls locate these jumps inside actual
    stalled root steps. An explicitly selected continuous positive-depth approximation has an independent
    integral control. The source Federman fit jumps at positive optical-depth joins; a separately selected
    connected-core control removes only those jumps, leaving the zero-depth branch and gain limits. Sulfur
    was added after a cooling-budget audit; omitted Ti and other stages still need bounds. A converged
    two-cell fixed-profile root had net H-alpha gain outside the observer domain, so its nonfinite spectrum
    cannot support derivatives. Unmasked dense full-SE controls exceed the published lower-domain limit;
    fixed mask applicability and lower boundary sensitivity must be checked. The native lower LTE cells
    emit into the upper atmosphere; dark inner radiation refers only to the bottom at 1 Rp, not to an
    upper-column boundary after discarding those cells. Historical metadata describing dark input as matching
    a one-sided reference does not certify its internally generated lower radiation. An unmodified C23.01
    forward/reverse keyword control has identical physical outputs despite accepted input echoes; the
    executed boundary operator must be verified before reference reuse. Uniform cell quadrature can miss
    an illuminated UV skin; convergence of the full residual is not quadrature convergence. A moving Ly-alpha
    continuum switch contributes an endpoint term to derivatives. The inherited electron-escape branch
    switches from net multiplet opacity to absorption-only opacity at zero; an actual high-shell infrared
    transition produces a finite rate jump. Reference-source parity does not validate this branch. Its
    correction requires the actual continuum and scattering source, photon/energy ledgers and the finite
    zero-net-opacity limit, followed by a complete atmosphere re-solve.'
  sources:
  - doc/solar_atmosphere.tex
  - mceg/evidence/solar_reference_controls_20261124/review.json
  - https://github.com/HajimeKawahara/exojax-escape/tree/be37d6bcca2718ace9baec6fbe2760829ab70c7d/mceg/evidence/hydrogen_reference_refinements_20261124
  subject: solar_observer
  context: solar_proxy
  provenance:
    role: primary
    inspection: inspected
    location: C23.01 source and current continuation diagnostics, see model document
    note: A reference discrepancy is not automatically a native defect. Require independent numerical
      convergence and paired causal controls. Input hashes alone do not show that an option took effect;
      source readouts also require matched-build output controls.
