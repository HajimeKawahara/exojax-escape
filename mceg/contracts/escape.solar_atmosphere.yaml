- id: component_reject_original_rr_heat_reference
  revision: '1'
  question: May the demonstrated zero-RR original-cache ledger certify native thermal physics?
  scope: The repeated-column constant-8000 K H15 control only; the historical reference population result
    remains valid.
  subject: component_c23_rr_original
  context: component_ou2_fixed_h15
  options:
  - id: exclude_stale_heat
    description: Exclude the stale-cache thermal ledger and assess the independently refreshed calculation
      in its own scope.
  - id: match_zero_cooling
    description: Modify native physics to reproduce the stale zero RR cooling.
  selected: exclude_stale_heat
  reasons:
  - A source-controlled cache refresh restores positive RR cooling without changing the fixed-temperature
    population tables.
  - Agreement with a stale numerical cache would not validate the physical RR cooling equation.
  basis:
  - kind: assessment
    id: component_c23_original_rr_current_review
    sha256: 4a33b487a54146f0715d20f720743881ee52ee179638447f10c16c178885afe1
  - kind: assessment
    id: component_c23_refreshed_rr_current_review
    sha256: f93817af1cc5235178ccd61aa86202bbaefb1e510a277f43b4ab2076c12d9958
  limitations:
  - This decision does not establish an effect in a varying-temperature solar atmosphere or in the paper.
  - The native bidirectional default, full thermal reference, and six complete-use requirements remain
    separately unverified.
  reconsider_when:
  - A separately pinned cache implementation passes matched current-beta/temperature recomputation controls
    and the declared thermal-reference refinement tests.
- id: component_cached_jvp_reject_unverified_substitution
  revision: '1'
  subject: component_solar_4473ed7
  context: component_cached_jvp_same_state_4473ed7
  question: May this cached JVP experiment replace the independently evaluated direct product under the
    unchanged declared tolerance?
  scope: Only the failed source-4473ed7 same-state experiment; neither a global ban on linearization nor
    a judgment of the later checkpointed candidate.
  options:
  - id: retain_direct
    description: Retain the direct product and assess any later candidate separately.
  - id: substitute
    description: Substitute the cached product despite failing its stated equality criterion.
  selected: retain_direct
  reasons:
  - The observed normalized error exceeds the predeclared 1e-12 criterion; two directions and warm repetition
    were not run.
  - The first cached application was slower, but this single timing is not a steady-state performance
    estimate.
  basis:
  - kind: assessment
    id: component_cached_jvp_equivalence_review
    sha256: db1a066a098b7c2ef81d9bad9c6f2a433a241b51c889fcbbc93d2eefa37b5f6f
  limitations:
  - Direct numerical equivalence and logical retained-array reduction do not establish a converged atmosphere,
    implicit reverse accuracy or NUTS performance.
  reconsider_when:
  - A separately source-pinned cached-application experiment meets the same declared comparison criteria
    across its required directions and independently measures warmed timing.
- id: component_retain_initial_linear_policy
  revision: '1'
  subject: component_initial_linear_c582c5
  context: component_public_initial_linear_seed
  question: Do these same-seed controls justify replacing the existing numerical policy?
  scope: Only the tested initial public linear problem; later Newton/trial costs and alternative rigorously
    verified policies remain separate.
  options:
  - id: retain
    description: Retain the passing current policy and require actual later-stage evidence before any
      performance change.
  - id: substitute
    description: Adopt host work limits or scalar normalization on these results.
  selected: retain
  reasons:
  - The original policy passes; host-limit substitution fails, and normalized warm retry provides no operator-count
    benefit.
  - No source solver or scientific tolerance is changed on the strength of an unverified cost hypothesis.
  basis:
  - kind: assessment
    id: component_initial_jax_linear_accuracy_review
    sha256: cdc202dd1bf7beac9dcfa62a8d377a3ba3045c06c78ee94d41ceca4118cff06b
  - kind: assessment
    id: component_initial_jax_host_limits_review
    sha256: 9d7a63ca1eef2eaccec4828f4b81c8623c10bc056a7ccbeafa79917ddf9a67ee
  - kind: assessment
    id: component_initial_normalized_linear_cost_review
    sha256: 2463e2531682611bd626d12a1481606149ceebb909dad29377b294eef8296a1d
  limitations:
  - The diagnostic callback timings are not a production benchmark. This decision does not certify cold
    starts, gradients, reference equivalence or any of the six complete-use requirements.
  reconsider_when:
  - A source-pinned actual later Newton/trial cost diagnostic or separately tested solver policy demonstrates
    a measurable benefit while preserving the original true residual and full nonlinear acceptance criteria.
