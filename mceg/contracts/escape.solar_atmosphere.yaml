bindings:
- id: conservation
  equation:
    id: nuclei
    revision: '1'
  subject: solar_observer
  source: src/escape/solar.py
  symbol: SolarCompositionModel.unpack
  arguments:
    state:
      symbol: state
    density_cm3:
      symbol: density
  note: The shared softmax counts molecular H nuclei before conversion to particle densities; free electrons
    follow charge neutrality.
- id: pressure
  equation:
    id: pressure
    revision: '1'
  subject: solar_observer
  source: src/escape/solar.py
  symbol: SolarCompositionModel.unpack
  arguments:
    state:
      symbol: state
    density_cm3:
      symbol: density
  note: The returned mean_molecular_weight counts the same physical species as the opacity and thermal
    ledger.
- id: continuum
  equation:
    id: rt
    revision: '1'
  subject: solar_observer
  source: src/escape/solar.py
  symbol: SolarCompositionModel.continuum_coefficients_at
  arguments:
    temperature_k:
      symbol: temperature
    physical:
      symbol: populations
    frequency_hz:
      symbol: frequency
  note: This binding covers additive opacity/emission; HydrogenEscapeProbabilityModel.population_state
    performs the common transfer.
- id: line_rates
  equation:
    id: line
    revision: '1'
  subject: solar_observer
  source: src/escape/line_escape_probability.py
  symbol: line_operators
  arguments:
    einstein_a_s:
      symbol: a
    tau_in:
      symbol: tau
  note: The returned effective up/down rates replace trapped-line recycling; the other static closure
    parameters are explicit arguments.
- id: overlap
  equation:
    id: overlap
    revision: '1'
  subject: solar_observer
  source: src/escape/solar.py
  symbol: SolarCompositionModel._overlap_state
  arguments:
    temperature:
      symbol: temperature
    physical:
      symbol: populations
    incident:
      symbol: incident
  note: Replaces the selected H/O line rates and returns one signed spectral correction to all continuum
    absorbers; isolated OTS terms are removed.
- id: ots_return
  equation:
    id: ots
    revision: '1'
  subject: solar_observer
  source: src/escape/hydrogen_escape_probability.py
  symbol: HydrogenEscapeProbabilityModel.population_state
  arguments:
    temperature_k:
      symbol: temperature
    incident_mean_intensity:
      symbol: incident
  note: Returns continuum-destroyed line photon flux. SolarCompositionModel.evaluate allocates those same
    photons to retained absorbers, including Ca II excited-state Ly-alpha absorption.
- id: composition
  equation:
    id: rates
    revision: '1'
  subject: solar_observer
  source: src/escape/solar.py
  symbol: SolarCompositionModel.evaluate
  arguments:
    state:
      symbol: state
    density_cm3:
      symbol: density
    temperature_k:
      symbol: temperature
    incident_mean_intensity:
      symbol: incident
  note: The target ratios combine atomic SE, chemistry and the same radiation field; a complete root requires
    state-target=0.
- id: thermal_flow
  equation:
    id: photoheat
    revision: '1'
  subject: solar_observer
  source: src/escape/atmosphere_wind.py
  symbol: thermal_flow_terms
  arguments:
    radius_cm:
      symbol: radius
    density_g_cm3:
      symbol: mass_density
    temperature_k:
      symbol: temperature
    mean_molecular_weight:
      symbol: mu
    velocity_cm_s:
      symbol: velocity
  note: Implements the advective and expansion terms of this equation group. The full solar thermal ledger
    supplies Gamma-Lambda separately.
- id: wind
  equation:
    id: wind
    revision: '1'
  subject: solar_observer
  source: src/escape/atmosphere_wind.py
  symbol: wind_from_profiles
  arguments:
    radius_cm:
      symbol: radius
    temperature_k:
      symbol: temperature
    mean_molecular_weight:
      symbol: mu
    mass_loss_g_s:
      symbol: mass_loss
  note: Connects the solved T/mu profile to transonic momentum and exact mass continuity; the declared
    outer extension still requires validation.
- id: lower_boundary
  equation:
    id: lower
    revision: '1'
  subject: solar_observer
  source: src/escape/solar.py
  symbol: SolarCompositionModel.lte_atomic_target
  arguments:
    state:
      symbol: state
    density_cm3:
      symbol: density
    temperature_k:
      symbol: temperature
  note: Actual charge-neutral electron density and retained/table ionic partitions set the dense atomic/H-minus
    target; SolarAtmosphereModel separately supplies the fixed-cell temperature extension. This is a declared
    boundary proxy, not an author configuration.
- id: implicit
  equation:
    id: implicit
    revision: '1'
  subject: solar_observer
  source: src/escape/nonlinear.py
  symbol: implicit_newton_krylov
  arguments:
    function:
      symbol: residual
    initial:
      symbol: initial
  note: Uses JAX custom_root and checked forward/transpose linear solves; a failed root or derivative
    returns NaN.
