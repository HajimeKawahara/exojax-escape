    - src/escape/solar.py:SolarCompositionModel.unpack
    - src/escape/solar.py:SolarCompositionModel.continuum_coefficients_at
    - src/escape/line_escape_probability.py:line_operators
    - src/escape/line_escape_probability.py:cell_averaged_line_operators
    - src/escape/line_escape_probability.py:doppler_core_escape
    - src/escape/line_escape_probability.py:federman_shield
    - src/escape/solar.py:SolarCompositionModel._overlap_state
