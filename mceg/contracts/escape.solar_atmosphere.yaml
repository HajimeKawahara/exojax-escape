contexts:
- id: solar_proxy
  scope: Selected native solar-proxy atmosphere, initially at the documented KELT-9b-like reference point;
    finite component controls are named separately. No NUTS-domain or exact author-reproduction claim.
  settings:
    target_composition: C23 default.abn solar; retained subset explicit in src/escape/solar.py
    mass_loss_initial_g_s: 10000000000000.0
    stellar_proxy: Unbroadened PHOENIX 10000 K, logg=4, solar; incident F=0.1 Fsurface, zero outside 500
      A--5.5 micron, original arrays not redistributed
    temperature_min_k: 4000
    temperature_max_k: 14000
    hydrogen_nmax: 15
    hydrogen_collision_model: anderson_lebedev
    iron_levels: 716
    sulfur_levels: 72
    line_sampling: Explicit front-face and finite-cell-average controls; convergence not yet established
    shielding_model: Cloudy default; connected positive core is a separate causal control, not a global
      smooth or reference-equivalent prescription
    core_escape_model: Cloudy default; continuous positive Doppler control is independently compared with
      the angular/frequency integral; no global zero-depth smoothness or wing accuracy upgrade
    oxygen_lybeta_overlap: resolved CRD with shared continuum receivers
    reference_max_pressure_bar: 0.001
    reference_max_hydrogen_density_cm3: 1000000000000000.0
    dense_lower_boundary: Fixed-cell mask, linear4500K-to-join temperature, retained/table partitions,
      H-minus Saha, metal Kirchhoff replacement; choice must be bounded
    reference_state_rtol: 0.05
    reference_state_observables: n2, n3, xe=ne/nH, T, mu and radial velocity; not relative errors of trace
      ions trimmed to zero by C23
    reference_alignment: All common original 48 input-grid points inside both raw zone-center ranges with
      P<=1mbar and nH<=1e15 in both profiles; linear-r interpolation, no edge extrapolation or population
      floor
    reference_heating_cooling_observables: Gamma and Lambda separately; net Gamma-Lambda is not a relative-error
      denominator
    reference_heating_cooling_rtol: 0.05
    reference_refinement_rtol: 0.01
    observer_error_sigma: 0.1
    reference_refinement_sigma: 0.02
- id: component_two_cell_bb
  scope: The archived two-cell full Fe716 H/He/molecule/metal/overlap composition root at prescribed temperature
    and density; not the planetary target.
  settings:
    nmax: 15
    iron_levels: 716
    quadrature_order: 2
    angle_order: 2
    edges_cm: '[0, 500000.0, 1000000.0]'
    temperature_k: '[8000, 8200]'
    n_h_cm3: '[1000000000000.0, 900000000000.0]'
    blackbody_temperature_k: 10000
    dilution: 0.025
