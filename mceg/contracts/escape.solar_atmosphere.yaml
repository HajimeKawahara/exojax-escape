schema_version: '0.4'
model:
  id: escape.solar_atmosphere
  name: Native composition, radiation and flow for the selected solar proxy
  description: New selected composition path. Component tests, complete-root verification, reference adequacy
    and observable applicability are separate. An unresolved requirement continues implementation; it
    is not a stopping rule.
