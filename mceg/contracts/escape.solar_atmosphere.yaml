    frac d2g(x_q),&\n u_q^+&=a+d\\left[1-\\frac12g(x_q)\\right],\\nonumber\\\\\n \\widetilde w_q^\\pm&=\\\
    frac{dw_qL e^{x_qL}}{2S},&\n W_q^\\pm&=\\frac{\\widetilde w_q^\\pm}\n                  {\\sum_{\\\
    text{segments},q,\\pm}\\widetilde w_q^\\pm}.\\end{aligned}"
