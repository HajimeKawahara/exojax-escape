- id: known_concerns
  kind: implementation
  summary: Known reference and native concerns continue the implementation/verification loop.
  scope: C23 species2.cpp:setXtraRatesO1 explicitly notes ticket78 and an invalidated independent-escape
    approximation after overlap. C23 ordinary iteration tolerance may retain stale total columns. Stellar
    bin-center sampling can miss narrow PHX absorption. Native overlap and several retained-species reductions
    need effect bounds. FeII excited photoionization is a shared untested C23 approximation. Default local
    convergence does not bound state error; the electron source/sink convergence check is disabled by
    an early return in C23; the measured residual is small and does not explain the deep population changes.
    Native Fe-II Ly-alpha overlap is not yet coupled; its fixed-profile observable bound does not bound
    thermal feedback. Coarse exclusive-front line columns can miss self-feedback within an inverted cell.
    The Doppler escape source fit also jumps at sqrt(pi)*tau=.01 and 11; paired Fe and H controls locate
    these jumps inside actual stalled root steps. An explicitly selected continuous positive-depth approximation
    has an independent integral control. The source Federman fit jumps at positive optical-depth joins;
    a separately selected connected-core control removes only those jumps, leaving the zero-depth branch
    and gain limits. Sulfur was added after a cooling-budget audit; omitted Ti and other stages still
    need bounds. A converged two-cell fixed-profile root had net H-alpha gain outside the observer domain,
    so its nonfinite spectrum cannot support derivatives. Unmasked dense full-SE controls exceed the published
    lower-domain limit; fixed mask applicability and lower boundary sensitivity must be checked.
  sources:
  - doc/solar_atmosphere.tex
  subject: solar_observer
  context: solar_proxy
  provenance:
    role: primary
    inspection: inspected
    location: C23.01 source and current continuation diagnostics, see model document
    note: A reference discrepancy is not automatically a native defect. Require independent numerical
      convergence and paired causal controls.
