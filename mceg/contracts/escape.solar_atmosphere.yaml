assumptions:
- statement: Local SE without population advection; gamma=5/3 kinetic thermal flow, one-dimensional tide,
    explicitly specified continuum boundary and doubled line columns. Ten retained metal elements use
    the C23 solar abundances; their omissions require quantitative bounds. Stellar pumping uses static
    columns without a cell-velocity Doppler shift. Selected dense cells have prescribed temperature, atomic/ionic
    and H-minus LTE, and Kirchhoff metal continua; their thermal balance is not claimed.
  evidence:
  - formulation
- statement: The author configuration is unavailable. The user chose solar composition as the verification
    target; this does not identify the unpublished author abundances.
  evidence:
  - formulation
limitations:
- statement: Excited-He and omitted element/charge/molecular channels, resonance overlap, stellar input
    sampling, lower-boundary and actual observation processing are obligations, not silently waived assumptions.
  evidence:
  - known_concerns
