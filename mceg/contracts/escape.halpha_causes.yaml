assessments:
- id: finite_response_controls_review
  kind: evidence_support
  claim: finite_response_controls
  claim_revision: '1'
  status: supported
  origin: reviewed
  subject: cause_diagnostics
  context: same_native_phase_target
  method:
    id: parallel_execution_and_independent_scope_review
    revision: '1'
    description: Inspect pinned calculations, cross-family controls and independent report review; separate
      finite correctness from physical identification.
  evidence:
  - protocol
  - source_controls
  - kinematic_controls
  - systematic_controls
  - integration_review
  reasons:
  - Three independent diagnostic paths reproduce the baseline and retain the same complete exposure support.
  - Reported refinement, direct-likelihood, finite-response and input/source checks pass in their stated scopes;
    none certifies atmospheric radial resolution or the missing extraction covariance.
- id: descriptive_structure_difference_review
  kind: evidence_support
  claim: descriptive_structure_difference
  claim_revision: '1'
  status: supported
  origin: reviewed
  subject: cause_diagnostics
  context: same_native_phase_target
  method:
    id: parallel_execution_and_independent_scope_review
    revision: '1'
    description: Inspect pinned calculations, cross-family controls and independent report review; separate
      finite correctness from physical identification.
  evidence:
  - free_structure
  - source_response
  - report
  - integration_review
  reasons:
  - Above 1.725 Rp the original free model has static radial center optical depth 4.88323 versus 0.0455518;
    partial-cell column integration is retained.
  - The free model is hotter and has a different radial source transition, outer excited column, geometry and
    velocity prescription; its local-fit advantage cannot be assigned to one change.
- id: identified_physical_cause_review
  kind: evidence_support
  claim: identified_physical_cause
  claim_revision: '1'
  status: unknown
  origin: reviewed
  subject: cause_diagnostics
  context: same_native_phase_target
  method:
    id: parallel_execution_and_independent_scope_review
    revision: '1'
    description: Inspect pinned calculations, cross-family controls and independent report review; separate
      finite correctness from physical identification.
  evidence:
  - report
  - source_response
  - kinematics
  - systematics
  - physical_context
  - free_structure
  reasons:
  - Upper-source suppression improves the core but leaves blue residual; large two-source changes can fit selected
    B/C means while producing excessive red emission and worse all-data Q.
  - Tested smooth longitude maps, faster radial flow and stellar/calibration proxies do not establish a solution.
    Uniform LOS offsets are pixel-sensitive.
  - Extended absorbing gas with low n3/n2 is a motivated structural hypothesis, but its population/energy/flow
    realization and separation from stellar/reduction effects are unverified.
  - The target was selected from the same observations; uncalibrated covariance and no repeated complete blue
    support preclude a unique physical attribution.
- id: outer_reservoir_finite_probes_review
  kind: evidence_support
  claim: outer_reservoir_finite_probes
  claim_revision: '1'
  status: supported
  origin: reviewed
  subject: outer_reservoir_probes
  context: fixed_baths_and_confinement_scales
  method:
    id: parallel_budget_and_scope_review
    revision: '1'
    description: Reconstruct native rates, execute fixed probes, verify pins and independently review the physical
      limits.
  evidence:
  - reservoir_protocol
  - reservoir_atomic
  - reservoir_radiation
  - reservoir_dynamics
  - reservoir_review
  reasons:
  - The receiving-corrected selected-level balance closes to 5.2e-13 net/turnover; collision reconstruction
    and unchanged-input controls pass.
  - At cell 5 the imposed-bath density factor 20.1938 reaches n2=1401.48 with source factor 0.978; H-alpha
    rate scaling demonstrates source feedback rather than validating fixed escape.
  - Independent reviews check shielding columns, radiation conventions, continuity and pressure scales, and
    distinguish local/area proxies from predicted observations.
- id: outer_reservoir_physical_realization_review
  kind: evidence_support
  claim: outer_reservoir_physical_realization
  claim_revision: '1'
  status: unknown
  origin: reviewed
  subject: outer_reservoir_probes
  context: fixed_baths_and_confinement_scales
  method:
    id: parallel_budget_and_scope_review
    revision: '1'
    description: Reconstruct native rates, execute fixed probes, verify pins and independently review the physical
      limits.
  evidence:
  - reservoir_report
  - reservoir_atomic
  - reservoir_radiation
  - reservoir_dynamics
  - reservoir_primary_context
  reasons:
  - Density-enhanced recombination can retain a low excitation ratio under imposed baths, but full populations,
    charge, energy and radiation have not been re-solved.
  - A conditional surface dipole pressure scale of 7.73 G neither measures a field nor establishes force balance,
    stability or the required foreground coverage.
  - H-alpha trapping and increased halo area can brighten the outer region; no new native-observer fit or calibrated
    residual improvement is computed.
  - Simple tested sink/trapping changes and current continuum shielding are insufficient in their fixed scopes;
    nonlocal transport and a force-supported dense sector remain hypotheses.
follow_ups:
- id: isolate_extended_upper_absorption
  target_kind: assessment
  target: identified_physical_cause_review
  action: Compare the free and physical radial source/opacity profiles in one observer geometry, then test
    a self-consistent extended low-source n=2 reservoir.
  requires:
  - Separate upper column, source-transition location and geometry at the same native observation operator.
  - Solve populations, energy and flow with any proposed irradiation/shielding/density structure; qualify radial
    resolution and all-phase collateral residuals.
  - Independent covariance and repeated-phase or pre-master stellar/reduction controls.
  completion: Record new evidence and a scoped physical Assessment; do not promote a selected-band improvement
    or profile resemblance to a detected mechanism.
  sources:
  - mceg/contracts/escape.halpha_phase_localization.yaml
- id: solve_supported_dense_sector
  target_kind: assessment
  target: outer_reservoir_physical_realization_review
  action: Test a specified dense slow sector with coupled population/charge/energy and line transfer before
    selecting a full confinement model.
  requires:
  - Solve the high-level population bath and full ionization balance; recompute continuum heating/cooling and
    Ly-alpha/H-alpha radiation at the increased opacity.
  - Demonstrate the assumed force or boundary support and directional covering; include tides, external pressure
    or magnetic topology as applicable.
  - Render disk and halo through the unchanged native operator; preserve all-phase collateral residuals and
    existing covariance limits.
  completion: Record a scoped new physical Assessment with an actual coupled solution and matched observer
    comparison; do not relabel the present probes as a physical fit.
  sources:
  - doc/halpha_outer_reservoir.pdf
