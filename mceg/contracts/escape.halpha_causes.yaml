assessments:
- id: finite_response_controls_review
  kind: evidence_support
  claim: finite_response_controls
  claim_revision: '1'
  status: supported
  origin: reviewed
  subject: cause_diagnostics
  context: same_native_phase_target
  method:
    id: parallel_execution_and_independent_scope_review
    revision: '1'
    description: Inspect pinned calculations, cross-family controls and independent report review; separate
      finite correctness from physical identification.
  evidence:
  - protocol
  - source_controls
  - kinematic_controls
  - systematic_controls
  - integration_review
  reasons:
  - Three independent diagnostic paths reproduce the baseline and retain the same complete exposure support.
  - Reported refinement, direct-likelihood, finite-response and input/source checks pass in their stated scopes;
    none certifies atmospheric radial resolution or the missing extraction covariance.
- id: descriptive_structure_difference_review
  kind: evidence_support
  claim: descriptive_structure_difference
  claim_revision: '1'
  status: supported
  origin: reviewed
  subject: cause_diagnostics
  context: same_native_phase_target
  method:
    id: parallel_execution_and_independent_scope_review
    revision: '1'
    description: Inspect pinned calculations, cross-family controls and independent report review; separate
      finite correctness from physical identification.
  evidence:
  - free_structure
  - source_response
  - report
  - integration_review
  reasons:
  - Above 1.725 Rp the original free model has static radial center optical depth 4.88323 versus 0.0455518;
    partial-cell column integration is retained.
  - The free model is hotter and has a different radial source transition, outer excited column, geometry and
    velocity prescription; its local-fit advantage cannot be assigned to one change.
- id: identified_physical_cause_review
  kind: evidence_support
  claim: identified_physical_cause
  claim_revision: '1'
  status: unknown
  origin: reviewed
  subject: cause_diagnostics
  context: same_native_phase_target
  method:
    id: parallel_execution_and_independent_scope_review
    revision: '1'
    description: Inspect pinned calculations, cross-family controls and independent report review; separate
      finite correctness from physical identification.
  evidence:
  - report
  - source_response
  - kinematics
  - systematics
  - physical_context
  - free_structure
  reasons:
  - Upper-source suppression improves the core but leaves blue residual; large two-source changes can fit selected
    B/C means while producing excessive red emission and worse all-data Q.
  - Tested smooth longitude maps, faster radial flow and stellar/calibration proxies do not establish a solution.
    Uniform LOS offsets are pixel-sensitive.
  - Extended absorbing gas with low n3/n2 is a motivated structural hypothesis, but its population/energy/flow
    realization and separation from stellar/reduction effects are unverified.
  - The target was selected from the same observations; uncalibrated covariance and no repeated complete blue
    support preclude a unique physical attribution.
follow_ups:
- id: isolate_extended_upper_absorption
  target_kind: assessment
  target: identified_physical_cause_review
  action: Compare the free and physical radial source/opacity profiles in one observer geometry, then test
    a self-consistent extended low-source n=2 reservoir.
  requires:
  - Separate upper column, source-transition location and geometry at the same native observation operator.
  - Solve populations, energy and flow with any proposed irradiation/shielding/density structure; qualify radial
    resolution and all-phase collateral residuals.
  - Independent covariance and repeated-phase or pre-master stellar/reduction controls.
  completion: Record new evidence and a scoped physical Assessment; do not promote a selected-band improvement
    or profile resemblance to a detected mechanism.
  sources:
  - mceg/contracts/escape.halpha_phase_localization.yaml
decisions:
- id: retain_structural_hypotheses
  revision: '1'
  question: How should the candidate-cause investigation guide model work?
  scope: This post-hoc fixed-atmosphere investigation.
  options:
  - id: controlled_structure_followup
    description: Use the extended upper absorber as a structural clue and preserve physical/observational uncertainty.
  - id: adopt_dark_layer_as_detected
    description: Treat a freely suppressed source or free-model profile as a physically identified atmosphere.
  selected: controlled_structure_followup
  reasons:
  - The strongest new clue concerns the location and persistence of outer opacity; no tested coefficient change
    establishes its physical origin.
  basis:
  - kind: assessment
    id: identified_physical_cause_review
    sha256: 97aba6157d05bf092f05d72ce9a6b6ddfa0a88a58fe556f816da78c1a1bab6e1
  limitations:
  - No production model, likelihood, noise calibration or readiness status is upgraded.
  reconsider_when:
  - A self-consistent matched-geometry candidate passes full-data and independent observational controls.
  subject: cause_diagnostics
  context: same_native_phase_target
