contexts:
- id: same_native_phase_target
  scope: Original saved atmosphere, complete first-night target and all native data; primary and complementary
    interleaves.
  settings:
    phase_start: 0.3761495834419293
    phase_end: 0.3932225607463806
    physical_exposures: 12
    noise: fixed saved GP hyperparameters
    bands: B[-40,-16), C[-8,8), R[16,40) km/s
assumptions:
- statement: Conditional GP means are recomputed for changed templates; fixed RV/amplitude responses and two-parameter
    profiled comparisons are separately labeled.
  evidence:
  - protocol
  - report
limitations:
- statement: Q is a fixed-covariance descriptive score, not a Bayes factor or calibrated detection; interleaves
    and held-out controls are not independent noise calibrations.
  evidence:
  - protocol
  - systematics
- statement: Local coefficient changes, base-rate time scales and different-family free profiles do not solve
    or validate a new atmosphere.
  evidence:
  - report
  - physical_context
  - free_structure
domains:
- kind: numerical_evaluation
  status: documented
  description: Finite recorded native support and fixed diagnostic parameter families.
  conditions:
  - Retain all native data for scoring; unsupported complete bands remain null.
  - Do not extrapolate refined observer controls to coupled radial or atomic adequacy.
  evidence:
  - protocol
  - report
claims:
- id: finite_response_controls
  revision: '1'
  kind: numerical_verification
  statement: The recorded source/opacity, velocity/longitude and stellar-proxy responses satisfy their stated
    finite numerical and input-identity controls.
  scope: Both interleaves and fixed saved covariance. Source-only all-phase fine rays; opacity target-bracket
    refinement; separately stated velocity/map and finite nuisance controls.
- id: descriptive_structure_difference
  revision: '1'
  kind: numerical_verification
  statement: The original free model retains a much larger outer n=2 column and static radial H-alpha optical
    depth than the saved physical state; this is not equivalent to a uniform upper-source rescaling.
  scope: Prescribed profile comparison at the common nominal line center, excluding bulk shifts and continuum.
    Plane and spherical observer/atomic families differ; no isolated causal inference.
- id: identified_physical_cause
  revision: '1'
  kind: physical_validation
  statement: A self-consistent additional physical mechanism uniquely explains the selected blue/core contrast
    and the remaining native data with calibrated uncertainty.
  scope: Prospective population/energy/flow and observational validation beyond the frozen diagnostics.
