contexts:
- id: synthetic_operator_checks
  scope: Declared finite synthetic examples of native-pixel sampling, masks, weighted bins, retention of all master
    exposures and piecewise derivatives. No atmosphere or observational-accuracy claim.
- id: archived_202408_fixed_e8
  scope: August 8 and 20 archived residuals and the fixed, converged +5.127 percent mass-loss atmosphere. Phase
    bins and nightly comparisons diagnose remaining differences without identifying their physical cause.
  settings:
    mass_loss_g_s: 10512710963760.25
    zonal_kms: 19.99871490128246
    master_exposures: 143
    selected_exposures: 115
    phase_bins: 0.30-0.35; 0.35-0.40; 0.40-0.45
    reduction_Kp_kms: 244.8
    stellar_mask_kms: 110.0
claims:
- id: operator_correspondence
  revision: '1'
  kind: numerical_verification
  statement: The implementation samples and coadds the supplied stellar-frame residuals with the declared full-master
    ordering, masks and weights, and passes the recorded finite derivative checks.
  scope: The retained synthetic tests and example processing path; not the accuracy of an atmospheric model or a
    recovered author pipeline.
  equations:
  - id: nightly_residual
    revision: '1'
  - id: native_coadd
    revision: '1'
- id: sideband_independence
  revision: '1'
  kind: theoretical
  statement: Excluding an exposure's instantaneous planetary line makes its remaining nightly-divided samples independent
    of the planet contrast in other exposures.
  scope: Candidate rationale for learning a background from off-line channels. This is a hypothesis tested here,
    not an assumption attributed to the authors.
  equations:
  - id: nightly_residual
    revision: '1'
  - id: master_cross_exposure_response
    revision: '1'
- id: physical_phase_interpretation
  revision: '1'
  kind: physical_validation
  statement: The fitted phase-dependent contrast and velocity differences can be attributed to the planetary atmosphere
    rather than the observation processing.
  scope: Prospective interpretation of the fixed-atmosphere diagnostic. Requires identifiable nuisance terms, covariance
    and observation-operator validation.
  equations:
  - id: native_coadd
    revision: '1'
evidence:
- id: formulation
  kind: theory
  summary: Full-night master and native-pixel phase-coaddition equations, with explicit separation of model processing
    and archived residual data.
  sources:
  - doc/phase_observation.tex
  - doc/phase_observation.pdf
  scope: Authored definitions and code correspondences, not observational validation.
  provenance:
    role: primary
    location: One-page phase observation supplement
    inspection: inspected
    note: The one-page rendered document, master derivative and code correspondences were inspected; it contains
      no physical-adequacy endorsement.
  artifacts:
  - source: doc/phase_observation.tex
    sha256: ad68768816e3503f2636b2ace8ff38e9286d5d5cebb94d118e7bb15d27533843
  - source: doc/phase_observation.pdf
    sha256: 16675546ab11328b665953344faa24ed5bb54aeff5b4a833e2b7ba8a07a8c615
- id: observation_reference
  kind: literature
  summary: The paper divides individual exposures by a nightly stellar master, masks stellar contamination, and
    averages in the planet frame.
  sources:
  - https://arxiv.org/html/2606.23899v1#S2
  - https://doi.org/10.5281/zenodo.20707255
  scope: Published processing order and archive description; exact master weights, coaddition and covariance have
    not been recovered.
  provenance:
    role: primary
    location: Zhang et al. (2026), sections II and III; Zenodo residual-spectrum products
    inspection: inspected
    note: Processing order is stated in the paper; raw archive products and exact numerical choices are distinguished.
- id: implementation_review
  kind: numerical_test
  result: passed
  summary: Source-qualified synthetic tests of the phase observation operator.
  sources:
  - mceg/evidence/phase_observation_20261125/review.json
  subject: phase_operator
  context: synthetic_operator_checks
  scope: Thirteen finite operator tests, nine independent parameter replays and eight fitted-curve replays; observer
