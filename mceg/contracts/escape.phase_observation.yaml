assessments:
- id: operator_review
  kind: evidence_support
  claim: operator_correspondence
  claim_revision: '1'
  status: supported
  origin: reviewed
  subject: phase_operator
  context: synthetic_operator_checks
  method:
    id: independent_operator_review
    revision: '1'
    description: Inspect the actual execution, independent reference, source identity, masks, master membership
      and finite derivative checks.
  evidence:
  - formulation
  - implementation_review
  reasons:
  - All thirteen tests pass, including independent interpolation/coaddition, mask and empty-bin behavior, preservation
    of full-night masters, and finite observer derivatives.
  - The JAX example uses exactly the same 36424 native pixels and weights as the independent NumPy reconstruction.
    Nine parameter cases and eight fitted curves agree to floating-point precision.
  - Support is restricted to the supplied processing equations and finite checks. No atmospheric implicit derivative,
    exact author reduction or physical interpretation is supported.
  equation_pins:
  - id: nightly_residual
    revision: '1'
    sha256: cc9cbfdce8e3b059c0955579d75032174919a8ed35fd7e6350f30f2b9c02da6b
  - id: native_coadd
    revision: '1'
    sha256: c582cd18a88d0a1665bf2a4bcadd3fa1570e6a5a04961a08857646dae0a74612
  binding_pins:
  - id: full_night_master
    sha256: 1c424743e8f6bcc01ba68cd29dd856069c59bfe0068def4c97f6c567fa3094d4
  - id: native_pixel_sampling
    sha256: 3689c3fbe12443c142d6e18b5cd77a586dedef0ab510cf22d2b275edfa958414
