  artifacts:
  - source: mceg/evidence/phase_observation_20261125/review.json
    sha256: d4267c602c3a22da16f00e7ef0e2a8f10b4a1fd0c2b530d99852038cdfa7fd70
  provenance:
    role: primary
    location: Source-qualified phase and night diagnostic execution, 25 November 2026
    inspection: inspected
    note: Reviewed actual completion, source hashes, independent saved-state replay and controls. Passed execution
      does not mean every tested scientific hypothesis is supported.
- id: diagnostic_review
  kind: numerical_test
  result: passed
  summary: Archived residual comparisons and controlled sideband sensitivity tests at a fixed atmosphere.
  sources:
  - mceg/evidence/phase_observation_20261125/review.json
  subject: phase_operator
  context: archived_202408_fixed_e8
  scope: Conditional measurements. They do not establish independent phase atmospheres, a global continuum offset
