schema_version: '0.4'
model:
  id: escape.phase_observation
  name: Full-night observation processing followed by phase and night diagnostics
  description: Sample model residuals at the archived pixels before making phase or night coadds. Diagnostic contrast
    factors do not solve different atmospheres.
  implementation:
    repository: https://github.com/HajimeKawahara/exojax-escape
    revision: 78f33b72d6f3076046f5af925c47db255428bef6
    entry_points:
    - src/escape/observation.py:process_phase_spectra
    - src/escape/phase_observation.py:sample_stellar_residuals
    - src/escape/phase_observation.py:coadd_residual_pixels
    - examples/phase_halpha.py:make_predictor
    - examples/night_residuals.py:run
assumptions:
- statement: The input atmosphere is fixed. Phase coefficients rescale its already projected planet contrast before
    continuum normalization and nightly division; they are not measured temperatures or level populations.
  evidence:
  - formulation
- statement: Archived HDF5 fluxes are already residual spectra. Only the synthetic model undergoes a new nightly-master
    division. All archived exposures remain in each model master, including exposures excluded from the final phase
    bin.
  evidence:
  - formulation
  - observation_reference
limitations:
- statement: Native-pixel binning is a documented proxy. Exact author coaddition, wavelength-frame details and shared-master/extraction
    covariance remain unresolved. Diagonal-error objectives are descriptive, not calibrated likelihoods.
  evidence:
  - diagnostic_review
domains:
- kind: numerical_evaluation
  status: documented
  description: Supplied finite residual arrays with fixed masks and interpolation grids.
  conditions:
  - Positive weights on retained samples and complete master membership.
  evidence:
  - formulation
subjects:
- id: phase_operator
  implementation:
    repository: https://github.com/HajimeKawahara/exojax-escape
    revision: 78f33b72d6f3076046f5af925c47db255428bef6
