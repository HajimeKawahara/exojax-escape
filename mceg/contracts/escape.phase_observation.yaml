- id: sideband_review
  kind: evidence_support
  claim: sideband_independence
  claim_revision: '1'
  status: contradicted
  origin: reviewed
  subject: phase_operator
  context: archived_202408_fixed_e8
  method:
    id: conditional_master_perturbation
    revision: '1'
    description: Change only the intrinsic phase contrast, preserve all master exposures and compare predictions
      in excluded-line control channels and the extrapolated nuisance.
  evidence:
  - formulation
  - diagnostic_review
  reasons:
  - At fixed numerator and weights, another same-night exposure has the nonzero derivative -z_e*a_f/(M_n^2*sum(a));
    excluding the current line does not remove this denominator dependence.
  - Changing only the three intrinsic phase coefficients to 1.5, 1.0 and 0.8 changes the fitted sideband extrapolation
    at the red peak by -291.93 ppm. Holding the master fixed leaves only +0.00656 ppm in the same control.
  - This refutes the candidate independence rationale, not all possible nuisance models and not an assumption attributed
    to the paper. The background correction is rejected for this diagnostic.
  equation_pins:
  - id: nightly_residual
    revision: '1'
    sha256: cc9cbfdce8e3b059c0955579d75032174919a8ed35fd7e6350f30f2b9c02da6b
  - id: master_cross_exposure_response
    revision: '1'
    sha256: 7c18268b764b7dc4197851e8d7bf670e398ce3ce1edb557dcafd7c6c34b85c26
  binding_pins: []
- id: observational_review
  kind: evidence_support
  claim: physical_phase_interpretation
  claim_revision: '1'
  status: unknown
  origin: reviewed
  subject: phase_operator
  context: archived_202408_fixed_e8
  method:
    id: conditional_interpretation_review
    revision: '1'
    description: Separate descriptive fit changes from a physically identified atmosphere, including phase/night
      coverage, processing and covariance.
  evidence:
  - diagnostic_review
  reasons:
  - Phase and night coverage are partly confounded, the late blue peak is mostly masked, and exact processing and
    covariance are unresolved.
  - A lower diagonal-error objective does not establish a physical cause. No sideband-derived background correction
    is adopted.
  equation_pins:
  - id: native_coadd
    revision: '1'
    sha256: c582cd18a88d0a1665bf2a4bcadd3fa1570e6a5a04961a08857646dae0a74612
  binding_pins: []
equations:
- id: nightly_residual
  revision: '1'
  latex: \begin{aligned}q_e(v)&=A_{b(e)}p(\phi_e,v-\Delta v_{b(e)}),\\ z_e(v_*)&=\frac{s(v_*)+\mathcal D_{u_e}q_e(v_*)}{\langle
    s+\mathcal D_{u_e}q_e\rangle_{C_e}},\\ M_n(v_*)&=\frac{\sum_{e\in N_n}a_e(v_*)z_e(v_*)}{\sum_{e\in N_n}a_e(v_*)},\qquad
    r_e(v_*)=\frac{z_e(v_*)}{M_{n(e)}(v_*)}-1.\end{aligned}
  description: Inject the phase spectrum, normalize its continuum and divide by the master built from all exposures
    in its night. Phase selection is applied only after this step.
  scope: The existing observation operator implements normalization and master division; the example supplies precomputed
    exposure spectra and diagnostic coefficients. Archived residual data do not undergo this division again.
  symbols:
    contrast:
      latex: p,q_e
      description: Planet flux in stellar-continuum units
      unit: '1'
    amplitude:
      latex: A_b
      description: Additional diagnostic phase contrast coefficient
      unit: '1'
    velocity:
      latex: v,v_*,u_e,\Delta v_b
      description: Planet and stellar velocity coordinates and supplied shifts
      unit: km s^-1
    phase:
      latex: \phi_e
      description: Orbital phase
      unit: '1'
    stellar:
      latex: s
      description: Stellar reference in the same continuum units
      unit: '1'
    normalization:
      latex: C_e
      description: Supplied continuum-weighted mean
      unit: '1'
    master:
      latex: M_n,a_e,N_n
      description: Nightly master and its supplied weights and complete exposure membership
      unit: '1'
    residual:
      latex: z_e,r_e
      description: Continuum-normalized flux and nightly-divided residual
      unit: '1'
  assumptions:
  - The Doppler sampler uses lambda_star = lambda_planet times (1 + u_e/c).
  - All model master exposures are retained. The example uses equal master weights and explicitly padded continua.
  - The contrast factors are a conditional diagnostic and do not feed back on thermal, rate or wind equations.
  evidence:
  - formulation
  - observation_reference
- id: native_coadd
  revision: '1'
  latex: \widehat f_{bnk}=\frac{\sum_{e\in B_b\cap N_n}\sum_p w_{ep}K_{epk}\,[\mathcal I_{ep}r_e]}{\sum_{e\in B_b\cap
    N_n}\sum_p w_{ep}K_{epk}}.
  description: Sample model residuals at each retained native pixel and use the same masks, bin membership and inverse-variance
    weights as the already processed data.
  scope: K uses the fixed declared reduction velocity, not an independently varied true injection velocity. Zero
    total weight means an invalid bin, not a measured zero.
  symbols:
    contrast:
      latex: \widehat f_{bnk}
      description: Conditional residual coadd for phase b and night n in bin k
      unit: '1'
    membership:
      latex: B_b,N_n,K_{epk}
      description: Phase/night exposure selection and fixed native-pixel bin inclusion
      unit: '1'
    weight:
      latex: w_{ep}
      description: Supplied inverse variance
      unit: '1'
    sampling:
      latex: \mathcal I_{ep}
      description: Linear sampling of the model residual at the archived stellar-frame pixel
      unit: '1'
    residual:
      latex: r_e
      description: Model stellar-frame residual after full-night division
      unit: '1'
  assumptions:
  - Fixed masks and interpolation cells give piecewise-smooth derivatives; the weights are not a calibrated covariance
    model.
  - No data-driven background correction is part of this accepted coadd definition.
  evidence:
  - formulation
- id: master_cross_exposure_response
  revision: '1'
  latex: \frac{\partial r_e(v_*)}{\partial z_f(v_*)}=-\frac{z_e(v_*)a_f(v_*)}{M_n(v_*)^2\sum_{j\in N_n}a_j(v_*)},\qquad
    f\ne e,\quad f,e\in N_n.
  description: A control pixel in one exposure responds to normalized planetary flux in another exposure through
    the complete nightly master, even when its own instantaneous line is absent.
  scope: Partial derivative of the declared master equation with the exposure e numerator and weights held fixed.
    This algebra is not a size estimate for a physical nuisance in the observations.
  symbols:
    residual:
      latex: r_e
      description: Nightly-divided residual in exposure e
      unit: '1'
    normalized_flux:
      latex: z_e,z_f
      description: Continuum-normalized fluxes at the same stellar velocity
      unit: '1'
    master:
      latex: M_n
      description: Same-night weighted master flux
      unit: '1'
    weights:
      latex: a_f,a_j,N_n
      description: Fixed master weights and complete same-night membership
      unit: '1'
    velocity:
      latex: v_*
      description: Stellar-frame velocity coordinate
      unit: km s^-1
  assumptions:
  - Positive finite master and nonzero weight for the perturbed exposure.
  - This partial derivative isolates the denominator; continuum normalization and an actual phase perturbation can
    also change the numerator.
  evidence:
  - formulation
bindings:
- id: full_night_master
  equation:
    id: nightly_residual
    revision: '1'
  subject: phase_operator
  source: src/escape/observation.py
  symbol: process_phase_spectra
  note: The existing function computes normalization and the complete same-night master. The example selects phases
    only after obtaining its stellar_residual output.
- id: native_pixel_sampling
  equation:
    id: native_coadd
    revision: '1'
  subject: phase_operator
  source: src/escape/phase_observation.py
  symbol: sample_stellar_residuals
  note: Samples each model exposure residual at the corresponding archived pixel, respecting coverage and the supplied
    stellar mask.
- id: residual_pixel_coadd
  equation:
    id: native_coadd
    revision: '1'
  subject: phase_operator
  source: src/escape/phase_observation.py
  symbol: coadd_residual_pixels
  note: Uses explicit bin indices and weights shared by observed and synthetic residuals. Empty or invalid bins
    cannot enter an objective as zero-valued data.
- id: phase_injection
  equation:
    id: nightly_residual
    revision: '1'
  subject: phase_operator
  source: examples/phase_halpha.py
  symbol: make_predictor
  note: Precompute every exposure at its physical phase, apply diagnostic contrast and velocity shifts, then call
    the complete-night operator before native-pixel selection.
decisions:
- id: conditional_diagnostic_use
  revision: '1'
  question: How should the phase fit and candidate sideband subtraction be used?
  scope: The fixed-atmosphere archived_202408_fixed_e8 comparison.
  options:
  - id: retain_uncorrected_diagnostic
    description: Retain the uncorrected phase/night comparisons and disclose the candidate-background ambiguity.
  - id: interpret_corrected_fit
    description: Adopt an extrapolated sideband background and interpret phase coefficients as planetary quantities.
  selected: retain_uncorrected_diagnostic
  reasons:
  - Nightly self-subtraction couples off-line pixels to other planetary exposures. A sideband fit alone does not
    identify the background under the planetary line.
  - The current comparison is useful for locating shape and processing discrepancies without assigning them a unique
    physical cause.
  limitations:
  - No promotion of the solar-atmosphere Use, atmospheric adequacy or NUTS readiness.
  reconsider_when:
  - A nuisance model passes independent injection/recovery and held-out control tests with the complete master operator.
  - Author processing, wavelength registration and covariance are reproduced or quantitatively bounded.
  subject: phase_operator
  context: archived_202408_fixed_e8
  basis:
  - kind: assessment
    id: sideband_review
    sha256: a97fbce7369fd65050655d4a5d5d4c0b2f1ec2efe03435414d292ada841bdca2
  - kind: assessment
    id: observational_review
    sha256: 0eea2a47cd7a5b84fbb0e0cc93caed6bd1ac9ad6b3ccdd8533cee836a8054005
follow_ups:
- id: identify_observation_and_phase_effects
  target_kind: assessment
  target: observational_review
  action: Compare phase-dependent physical spectra while retaining night identity; validate wavelength-dependent
    residual terms using controls that preserve planetary master ghosts.
  requires:
  - Independent constraints on background shape, exact coaddition and relevant covariance.
  - Injection/recovery and held-out tests that do not learn a correction from the target line.
  - Adequate late-phase blue-side coverage or explicitly restricted conclusions.
  completion: Record a new scoped Assessment after the data-processing and physical alternatives are distinguishable;
    retain this unknown finding and rejected corrections.
