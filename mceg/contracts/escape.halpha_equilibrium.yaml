claims:
- id: coupling_correspondence
  revision: '1'
  kind: theoretical
  statement: The inspected implementation consistently replaces three H-alpha rates, their old OTS events,
    the continuum receiving field and redistribution heat.
  scope: Equation/source correspondence and endpoint ownership. This is not evidence for a new root or fit.
  equations:
  - id: formal_transfer
    revision: '1'
  - id: blended_rates
    revision: '1'
  - id: receiving_packet
    revision: '1'
  - id: line_energy
    revision: '1'
  mathematical_models: []
- id: transport_identity
  revision: '1'
  kind: numerical_verification
  statement: The recorded current-population transfer identity agrees with direct photon and energy budgets
    to 1e-10 relative to their gross supplied quantities.
  scope: Independent zero-boundary finite-state algebra check with saved/interpolated continuum; not full-atmosphere
    or stellar-boundary validation.
  equations:
  - id: formal_transfer
    revision: '1'
  - id: line_energy
    revision: '1'
  mathematical_models: []
- id: solver_correspondence
  revision: '1'
  kind: numerical_verification
  statement: The inspected measured-subspace solver uses current-anchor complete-residual differences and accepts
    only guarded actual-residual decreases.
  scope: Source correspondence and finite numerical controls; no convergence guarantee, full derivative validation
    or complete atmosphere is implied.
  equations:
  - id: measured_subspace
    revision: '1'
  mathematical_models: []
- id: complete_equilibrium
  revision: '1'
  kind: numerical_verification
  statement: The final blend-one candidate satisfies the complete residual below 1e-9, fresh-repeat difference
    below 1e-10, all physical guards, and conservation errors below 1e-12. A GPU candidate also passes the
    independent unchanged-coordinate CPU residual and backend-agreement gates.
  scope: The declared eight-cell mass-loss point and numerical discretization; no resolution, reference-agreement
    or atmospheric-accuracy claim.
  equations:
  - id: coupled_root
    revision: '1'
  - id: backend_crosscheck
    revision: '1'
  mathematical_models:
  - id: coupled_equilibrium
    revision: '1'
- id: fixed_gp_improvement
  revision: '1'
  kind: physical_validation
  statement: The accepted candidate lowers the primary native-pixel Q relative to baseline under identical
    processing, fixed covariance and separately profiled shared RV/amplitude.
  scope: Conditional score comparison at stride two offset zero. Its sign does not establish significance,
    posterior evidence, or uniqueness of the mechanism.
  equations:
  - id: observed_prediction
    revision: '1'
  - id: conditional_score
    revision: '1'
  mathematical_models:
  - id: fixed_gp_comparison
    revision: '1'
- id: blue_core_improvement
  revision: '1'
  kind: physical_validation
  statement: The accepted candidate reduces the absolute data-minus-total-prediction means in both fixed blue
    and core windows after the same global nuisance profiling.
  scope: Displayed GP-conditioned residual means in the predefined windows, not a test of every pixel, a probability
    or an exact author reduction.
  equations:
  - id: observed_prediction
    revision: '1'
  - id: conditional_score
    revision: '1'
  - id: band_residual
    revision: '1'
  mathematical_models:
  - id: fixed_gp_comparison
    revision: '1'
