  question: How should the accepted candidate be used after its conditional improvement claims are contradicted?
  scope: The declared fixed mass-loss point and native fixed-GP comparison.
  options:
  - id: diagnostic
    description: Retain the opt-in transfer and reproducible root, and report the observed worsening at this
      point.
  selected: diagnostic
  subject: coupled_current
  context: native_fixed_gp
  reasons:
  - The atmosphere satisfies the complete numerical equations, while Q and both absolute blue/core residual
    means worsen.
