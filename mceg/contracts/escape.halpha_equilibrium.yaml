  revision: '1'
  latex: \theta
  description: Log temperature/composition coordinates of the same finite atmosphere
  unit: '1'
  domain: The declared finite atmosphere or archived native observation comparison, with meaning fixed by this
    quantity definition.
- id: path
  revision: '1'
  latex: s
  description: Finite spherical ray coordinate
  unit: cm
  domain: The declared finite atmosphere or archived native observation comparison, with meaning fixed by this
