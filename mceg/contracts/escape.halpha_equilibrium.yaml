- id: intensity
  revision: '1'
  latex: I_\nu
  description: Intensity in the resolved H-alpha group
  unit: erg s^-1 cm^-2 sr^-1 Hz^-1
  domain: The declared finite atmosphere or archived native observation comparison, with meaning fixed by this
    quantity definition.
- id: emissivity
