assumptions:
- statement: Use the existing eight-cell solar-composition atmosphere, fixed mass loss and stellar spectrum;
    re-solve populations and the upper thermal/wind response.
  evidence:
  - protocol
- statement: The two dense lower cells retain their prescribed atomic LTE and temperature relation; their emissivity
    and absorption still participate in transfer.
  evidence:
  - protocol
- statement: The final physical calculation has H-alpha blend one. Intermediate blend values are numerical
    continuation coordinates, not fitted physical parameters.
  evidence:
  - protocol
limitations:
- statement: Static spherical complete redistribution and shell-averaged stellar illumination do not solve
    moving-medium or partial redistribution transfer.
  evidence:
  - protocol
  - receiving_audit
- statement: The finite H-alpha window also replaces its represented continuum background. This includes geometry,
    exact stellar line samples versus reconstruction of global continuum bins, and finite-grid interpolation/quadrature
    differences. It is not an isolated geometry measurement; line and background contributions are retained
    separately.
  evidence:
  - protocol
  - receiving_audit
- statement: Continuum scattering retains the declared attenuation approximation. This group contains the three
    H-alpha branches, not every coincident metal transition.
  evidence:
  - protocol
  - receiving_audit
- statement: A complete discrete root is not atmospheric-resolution, independent-reference, posterior or observational-covariance
    validation.
  evidence:
  - protocol
  - receiving_audit
- statement: The earlier frozen conversion readout omitted the later H receiving PI/RR correction in its conditional
    exit rates. The new audit corrects those numerical probabilities without changing old receipts or promoting
    them to a coupled atmosphere.
  evidence:
  - protocol
  - receiving_audit
- statement: The quadrature controls hold populations and temperature fixed. Their heat normalization covers
    H, free-free and H-alpha redistribution, not every receiving species or the full refined atmospheric residual.
  evidence:
  - quadrature_execution
domains:
- kind: numerical_evaluation
  status: documented
  description: The prescribed finite atmosphere, complete-root guards and original native-pixel observation
    comparison.
  conditions:
  - Same eight physical shells, finite atom/composition and mass loss as the archived PR12/13 baseline.
  - Positive wind; source physical/reference-domain guards and prescribed lower-cell masks remain required.
  evidence:
  - protocol
contexts:
- id: inspected_implementation
  scope: Current optional coupling and same-state finite identities; no root or observed-improvement inference.
- id: complete_eight_cell
  scope: Final blend-one root at the current fixed mass loss; all composition coordinates and upper temperatures
    are solved.
  settings:
    mass_loss_g_s: 10512710963760.25
    lower_prescribed_cells: 2
    complete_residual_infinity_max: 1.0e-09
    repeated_residual_difference_max: 1.0e-10
    zero_blend_residual_parity_max: 1.0e-10
    conservation_relative_error_max: 1.0e-12
    initial_frequency_order: 8
    initial_angle_order: 32
    initial_wing_extent: 30
    gpu_candidate_requires_cpu_crosscheck: true
    cpu_residual_infinity_max: 1.0e-09
    cpu_gpu_residual_difference_max: 1.0e-10
- id: native_fixed_gp
  scope: Identical observation processing and fixed GP covariance, with shared RV/amplitude profiled separately
    for both templates.
  settings:
    primary_pixel_stride: 2
    primary_pixel_offset: 0
    complementary_pixel_offset: 1
    baseline_Q: 38326.64894003179
    blue_window_kms: '[-40,-16)'
    core_window_kms: '[-8,8)'
    red_window_kms: '[16,40)'
    baseline_blue_residual_ppm: 409.0567079
    baseline_core_residual_ppm: -235.2446886
    baseline_red_residual_ppm: -23.1787361
equations:
- id: formal_transfer
  revision: '1'
  latex: \frac{d I_\nu}{ds}=\eta_\nu(\theta)-\chi_\nu(\theta)I_\nu,\qquad J_\nu=\langle I_\nu\rangle_{\Omega,V}.
  description: Resolve the emitted and absorbed field from the current populations and temperatures.
  scope: Static finite spherical shells; coefficients and source include the same-state continuum and three
    H-alpha branches.
  symbols:
    state: &id004
      latex: \theta
      description: Log temperature/composition coordinates of the same finite atmosphere
      unit: '1'
    path:
      latex: s
      description: Finite spherical ray coordinate
      unit: cm
    intensity:
      latex: I_\nu
      description: Intensity in the resolved H-alpha group
      unit: erg s^-1 cm^-2 sr^-1 Hz^-1
    mean: &id003
      latex: J_\nu
      description: Shell-volume mean of resolved group intensity
      unit: erg s^-1 cm^-2 sr^-1 Hz^-1
    emissivity:
      latex: \eta_\nu
      description: Same-state line plus continuum volume emissivity
      unit: erg s^-1 cm^-3 sr^-1 Hz^-1
    extinction:
      latex: \chi_\nu
      description: Same-state line plus continuum extinction coefficient
      unit: cm^-1
  assumptions:
  - The incoming stellar beam is represented by its shell-averaged isotropic outer intensity; the core absorbs
    incoming rays.
  - Local self-emission is algebraically eliminated from effective rate coefficients without discarding photons.
  evidence:
  - protocol
- id: blended_rates
  revision: '1'
  latex: \mathcal R^{(\beta)}=(1-\beta)\mathcal R^0+\beta\mathcal R^H,\qquad D^{(\beta)}=(1-\beta)D^0,\quad
    0\leq\beta\leq1.
  description: Replace upward/downward rates and isolated destroyed-photon production together.
  scope: Only the three selected H-alpha branches; other H/O and IR groups retain their own independent replacements.
  symbols:
    blend: &id002
      latex: \beta
      description: Continuation strength; exactly one for the final candidate
      unit: '1'
    old_rates:
      latex: \mathcal R^0
      description: Original H-alpha upward/downward coefficients at the current state
      unit: s^-1
    resolved_rates:
      latex: \mathcal R^H
      description: Self-source-eliminated resolved H-alpha coefficients
      unit: s^-1
    rates: &id005
      latex: \mathcal R^{(\beta)}
      description: H-alpha coefficients supplied to the complete population target
      unit: s^-1
    old_ots:
      latex: D^0
      description: Original H-alpha destroyed-photon source events
      unit: cm^-3 s^-1
    ots:
      latex: D^{(\beta)}
      description: Remaining isolated H-alpha destroyed-photon source events
      unit: cm^-3 s^-1
  assumptions:
  - The final model uses beta one; beta zero is a numerical parity control.
  - Endpoint masking excludes unused invalid branches before arithmetic and differentiation.
  evidence:
  - protocol
- id: receiving_packet
  revision: '1'
  latex: \Delta P^{(\beta)}_\nu=\beta\frac{4\pi w_\nu}{h\nu}(J_\nu-J^0_\nu).
  description: Correct the represented global continuum used by the receiving operators.
  scope: Each frequency-bin packet reaches H/metal/He/molecular photo-processes and the shared free-free energy
    ledger exactly once.
  symbols:
    packet: &id006
      latex: \Delta P^{(\beta)}_\nu
      description: Signed additional photons per group frequency bin supplied once to all continuum receivers
      unit: cm^-2 s^-1
    blend: *id002
    weight:
      latex: w_\nu
      description: Frequency quadrature weights
      unit: Hz
    frequency:
      latex: \nu
      description: Frequency nodes of the finite H-alpha group
      unit: Hz
    mean: *id003
    background:
      latex: J^0_\nu
      description: Represented global continuum mean interpolated onto the group grid
      unit: erg s^-1 cm^-2 sr^-1 Hz^-1
  assumptions:
  - Signed screening is retained; old H-alpha OTS sources are removed with the same blend.
  - The packet is split into line-only and represented-background replacement terms. The latter includes geometry,
    exact stellar samples versus continuum-bin reconstruction, and finite-quadrature differences; no global-grid
    resolution proof follows.
  evidence:
  - protocol
- id: line_energy
  revision: '1'
  latex: q_{\rm rad,line}=\sum_b E_b\dot N_b+q_{\rm red}.
  description: Separate atomic excitation work from the finite-frequency redistribution heat.
  scope: The same self-eliminated resolved events and frequency quadrature; continuum heating is handled by
    its receiving species.
  symbols:
    radiative_energy:
      latex: q_{\rm rad,line}
      description: Net line radiative energy transferred to matter
      unit: erg cm^-3 s^-1
    binding_energy:
      latex: E_b
      description: Atomic transition energy of each H-alpha branch
      unit: erg
    line_events:
      latex: \dot N_b
      description: Net photon excitation events for each resolved branch
      unit: cm^-3 s^-1
    redistribution: &id007
      latex: q_{\rm red}
      description: Finite-profile redistribution heat from the same resolved line events
      unit: erg cm^-3 s^-1
  assumptions:
  - Only beta times redistribution heat is added to the kinetic ledger; atomic excitation work is not added
    again as heat.
  evidence:
  - protocol
- id: coupled_root
  revision: '1'
  latex: \mathcal F\!\left(\theta;\dot M,\mathcal R^{(\beta)},\Delta P^{(\beta)},\beta q_{\rm red}\right)=0,\qquad
    \beta=1.
  description: Solve the complete modified atmosphere, including temperature-dependent radiation, chemistry
    and wind feedback.
  scope: Full composition targets, upper thermal balance including advection/expansion, and the unchanged prescribed
    lower rows at fixed mass loss.
  symbols:
    residual: &id008
      latex: \mathcal F
      description: Complete dimensionless population, thermal and prescribed-boundary residual
      unit: '1'
    state: *id004
    mass_loss:
      latex: \dot M
      description: Fixed planetary mass loss
      unit: g s^-1
    rates: *id005
    packet: *id006
    blend: *id002
    redistribution: *id007
  assumptions:
  - No fixed-temperature or frozen-population iterate is a complete-root result.
  - Acceptance additionally requires fresh residual reproduction, physical/wind/domain flags and independent
    conservation checks.
  evidence:
  - protocol
- id: backend_crosscheck
  revision: '1'
  latex: \|\mathcal F_{\rm CPU}(\theta_*)\|_\infty<10^{-9},\qquad\|\mathcal F_{\rm CPU}(\theta_*)-\mathcal
    F_{\rm GPU}(\theta_*)\|_\infty<10^{-10}.
  description: Independently evaluate the unchanged exported GPU coordinates using the complete CPU operator.
  scope: Required for a GPU-accelerated candidate; changing theta would be a separate CPU polishing solve and
    would not satisfy this unchanged-state check.
  symbols:
    state: *id004
    cpu_residual:
      latex: \mathcal F_{\rm CPU}
      description: Complete CPU residual at the exact exported candidate coordinates
      unit: '1'
    gpu_residual:
      latex: \mathcal F_{\rm GPU}
      description: Recorded complete GPU residual at the same coordinates
      unit: '1'
  assumptions:
  - Use the identical mass loss, physical settings, source inputs and dependencies on both backends.
  - All original physical and conservation guards must pass, with input/source hashes unchanged; temperature,
    electron density, populations and velocity differences are reported.
  evidence:
  - protocol
- id: measured_subspace
  revision: '1'
  latex: Y_i=\frac{\mathcal F(\theta+h_i S_i)-\mathcal F(\theta)}{h_i},\quad S^TS=I,\quad c=\arg\min_z\|\mathcal
    F+Yz\|_2,\quad P_{\rm new}=P+(S-PY)Y^\dagger,\quad \theta_{\rm trial}=\theta+\alpha\kappa Sc.
  description: Measure a same-anchor linear correction and use the retained inverse only to choose search directions.
  scope: Numerical algorithm only; this equation does not change the physical residual or prove convergence
    of the full atmosphere.
  symbols:
    residual: *id008
    state: *id004
    search_inverse:
      latex: P
      description: Approximate inverse used only to choose numerical search directions
      unit: '1'
    search_basis:
      latex: S
      description: Orthonormal columns of numerical coordinate search directions
      unit: '1'
    measured_products:
      latex: Y
      description: Complete-residual finite-difference products at one current anchor
      unit: '1'
    probe_step:
      latex: h_i
      description: Finite-difference increment along the normalized search direction
      unit: '1'
    search_coefficients:
      latex: c
      description: Least-squares coefficients in the current measured direction space
      unit: '1'
    backtrack_fraction:
      latex: \alpha
      description: Backtracking fraction applied to the capped numerical step
      unit: '1'
    coordinate_cap:
      latex: \kappa
      description: Factor limiting the largest coordinate change to 0.5
      unit: '1'
  assumptions:
  - Every product is a fresh complete-residual forward difference at the same anchor; singular product directions
    are discarded.
  - An accepted step requires all domain/physical guards and actual L2 decrease by the line-search criterion;
    a predicted decrease is insufficient.
  - The unchanged final infinity-norm, fresh-evaluation, source-identity and physical/conservation gates determine
    root acceptance.
  evidence:
  - protocol
- id: observed_prediction
  revision: '1'
  latex: m=\mathcal O\!\left[\mathcal S(\theta);a,v\right].
  description: Render the new same-population atmosphere and apply the archived observation operator.
  scope: Recompute H-alpha widths, extinction, emission and continuum from the complete candidate, retaining
    the baseline observer and pixel processing.
  symbols:
    prediction: &id009
      latex: m
      description: Processed native log-ratio prediction from the candidate atmosphere
      unit: '1'
    state: *id004
    amplitude:
      latex: a
      description: Log global planet-contrast amplitude
      unit: '1'
    velocity:
      latex: v
      description: Shared observer radial-velocity offset
      unit: km s^-1
  assumptions:
  - A shared RV and amplitude are nuisance parameters, not new population or source-function multipliers.
  - A fixed-at-baseline nuisance comparison is reported alongside each separately profiled shape.
  evidence:
  - protocol
- id: conditional_score
  revision: '1'
  latex: Q=(y_\perp-m_\perp)^T C_\perp^{-1}(y_\perp-m_\perp),\qquad \Delta Q=Q_{\rm baseline}-Q_{\rm candidate}.
  description: Compare conditional quadratic scores using the same covariance and native independent contrasts.
  scope: Original stride-two offset-zero pixels; complementary offset-one is a separately reported sensitivity
    control.
  symbols:
    data: &id010
      latex: y
      description: Observed native log ratios with the shared-reference projection
      unit: '1'
    prediction: *id009
    covariance:
      latex: C_\perp
      description: Fixed GP plus white covariance in the independent contrast space
      unit: '1'
    score:
      latex: Q
      description: Conditional squared residual with the fixed covariance
      unit: '1'
    score_difference:
      latex: \Delta Q
      description: Baseline minus candidate conditional score
      unit: '1'
  assumptions:
  - Both templates profile the same one RV and one log amplitude with unchanged fixed GP covariance.
  - Positive Delta Q is a descriptive improvement, not posterior evidence, significance or covariance validation.
  evidence:
  - protocol
- id: band_residual
  revision: '1'
  latex: r_b=\Pi_b[y-m-\widehat g],\qquad \overline r_W=10^6\frac{\sum_{b\in W}r_b/\sigma_b^2}{\sum_{b\in W}1/\sigma_b^2}.
  description: Report blue/core/red data-minus-total-prediction means after the common-reference display projection.
  scope: Fixed display windows and white-error weighting; the total prediction includes the conditional GP
    mean.
  symbols:
    data: *id010
    prediction: *id009
    gp_mean:
      latex: \widehat g
      description: Conditional GP mean on the native data at fixed covariance hyperparameters
      unit: '1'
    display_projection:
      latex: \Pi
      description: Common-reference removal and white-error display-bin projection
      unit: '1'
    display_error:
      latex: \sigma_b
      description: White-error scale of each displayed residual bin
      unit: '1'
    band_mean:
      latex: \overline r_W
      description: White-error-weighted displayed data-minus-total-prediction mean
      unit: ppm
  assumptions:
  - These display weights are distinct from the GP covariance used by Q.
  - Blue and core improvement means smaller absolute residual means in both windows, not larger plotted total
    amplitudes.
  evidence:
  - protocol
