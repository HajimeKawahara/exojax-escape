contexts:
- id: eight_cell_spherical_supported_flow
  scope: Conditional eight-cell steady local-SE roots and matched archived observations.
  settings:
    density: rho=q*rho_ref(T,mu), v=v_ref/q; q ramps from 1 at 1.3 Rp to D at 1.725 Rp.
    energy: Native radiative and monatomic flow terms, including transformed expansion/compression.
    transport: Static spherical H-alpha CRD, natural/thermal widths; native other species and radiation.
    observations: Same native operator, fixed GP hyperparameters, two RV/amplitude nuisance parameters; both
      interleaves.
assumptions:
- statement: The extra momentum support is prescribed; all native population and internal-thermal equations
    retain their stated approximations.
  evidence:
  - protocol
domains:
- kind: numerical_evaluation
  status: documented
  description: Saved eight-cell radial states and archived native observation samples.
  conditions:
  - 4000 to 14000 K trial-temperature domain and all retained native guards.
  - Only exact-coordinate CPU-verified roots enter qualified observational conclusions.
  evidence:
  - protocol
  - roots
limitations:
- statement: Required force is reported rather than derived; angular covering, MHD stability, dissipation and
    advected internal excitation/ionization energy remain unresolved.
  evidence:
  - protocol
  - flow_controls
- statement: Eight-cell radial structure and physical transfer adequacy are unqualified. Group-only fixed-state
    quadrature controls do not establish a refined full thermal root.
  evidence:
  - structure
  - transfer_controls
- statement: Finite Q and selected-phase residual differences are descriptive, not calibrated evidence for
    a unique atmospheric mechanism.
  evidence:
  - observer
  - report
claims:
- id: dense_numerical_controls
  revision: '1'
  kind: numerical_verification
  statement: Recorded accepted density cases satisfy the complete residual, conservation, exact-coordinate
    CPU and transformed flow identities.
  scope: Only the accepted factors [1.0, 1.2, 1.3, 1.4, 1.5, 1.75, 2.0, 3.0, 5.0, 6.0, 7.0, 8.0, 9.0, 10.0,
    12.0, 15.0, 20.0]; failed, interrupted or unavailable cases are not physical counterexamples.
- id: dense_native_comparisons
  revision: '1'
  kind: numerical_verification
  statement: The recorded native-observer comparisons preserve the declared support and nuisance protocol and
    trace each candidate to a CPU-verified state.
  scope: Finite profiled and fixed comparisons against both PR13 and D1; no statistical significance claim.
- id: dense_physical_explanation
  revision: '1'
  kind: physical_validation
  statement: A dynamically supported dense outer reservoir explains the observed blue/core contrast with physically
    adequate transport and geometry.
  scope: Prospective physical realization beyond this prescribed spherical family.
- id: sampled_density_contrast_improvement
  revision: '1'
  kind: numerical_verification
  statement: At least one recorded higher-density observer candidate reduces both the absolute blue-minus-core
    residual and full-data Q relative to D1 in both profiled pixel selections.
  scope: Only observer cases ['D1.2', 'D2', 'D5', 'D10', 'D12', 'D15', 'D20']; no claim about untested factors,
    other geometry or calibrated significance.
