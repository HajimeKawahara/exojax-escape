schema_version: '0.2'
model:
  id: escape.hydrogen_populations
  name: Pure-hydrogen continuity and isolated two-level excitation
  description: Computes nH from steady spherical mass flux and the ratio of two excited levels
    from prescribed electron density, temperature, collision strength and photon occupation.
    This module does not determine the ionized fraction or total excited reservoir used by Model
    3.
  implementation:
    repository: https://github.com/HajimeKawahara/exojax-escape
    revision: 421f6a532ced0d0c5614124c4fea902070f93174
    entry_points:
    - src/escape/hydrogen_populations.py:hydrogen_nuclei_density
    - src/escape/hydrogen_populations.py:diluted_blackbody_occupation
    - src/escape/hydrogen_populations.py:two_level_ratio
assumptions:
- statement: 'Pure H with mass per nucleus PROTON_MASS_CGS: nH = mass_loss / (4*pi*r^2*v*m_p),
    with the km/s velocity converted to cm/s.'
  evidence:
  - implementation
- statement: The two levels form an isolated steady balance with Maxwellian electron collisions
    and Einstein radiative rates, including stimulated emission. Radiation and electron density
    are external inputs.
  evidence:
  - implementation
- statement: The de-excitation coefficient is 8.629e-6*Upsilon/(g_upper*sqrt(T)) cm^3/s; upward
    collisions follow detailed balance. The diluted blackbody occupation is W/expm1(hc_over_k*wavenumber/T).
  evidence:
  - implementation
- statement: COLLISION_STRENGTH_23 = 35.52 is a shell-averaged value frozen at kT=1 eV. The
    numerical tests instead supply Upsilon=10 and do not validate the default coefficient or
    its temperature dependence.
  evidence:
  - implementation
  - collision_source
  - population_tests
domains:
- kind: numerical_evaluation
  status: documented
  description: Caller obligations and numerical samples; these are not an atmospheric applicability
    envelope.
  conditions:
  - Finite, broadcast-compatible inputs. Temperature in K, wavenumber in cm^-1, A in s^-1 and
    positive statistical weights; T, wavenumber, A and weights must be positive.
  - Electron density in cm^-3, collision strength and photon occupation must be nonnegative.
    No clipping or runtime physical-domain validation is applied in these functions.
  - Continuity uses radius in cm, positive velocity in km/s and nonnegative mass loss in g/s;
    density is returned in cm^-3.
  - The recorded checks use CPU float64; exact samples and tolerances are in the pinned tests/test_populations.py.
    Extreme numerical densities are algebraic limit tests, not claimed atmospheric conditions.
  evidence:
  - implementation
  - population_tests
- kind: scientific_applicability
  status: unknown
  description: No validated atmospheric temperature/density/radiation domain or H-alpha accuracy
    budget has been established for this isolated closure.
  conditions: []
  evidence:
  - implementation
  - target_paper
claims:
- id: numerical_verification
  revision: '1'
  kind: numerical_verification
  statement: At the recorded samples, pure-H continuity conserves mass flux and the isolated
    excitation ratio recovers its Boltzmann, Einstein-radiation and unpumped limits without
    inversion.
  scope: 'Only the six tests in tests/test_populations.py: mass conservation rtol=2e-14, collision-dominated
    Boltzmann rtol=2e-9, radiation/Planck ratios rtol=2e-14, exact zero and sampled positivity/non-inversion
    assertions. The LTE-named test concerns the two-level Boltzmann ratio, not Saha equilibrium.
    No derivative or spectrum test is included.'
- id: physical_accuracy
  revision: '1'
  kind: physical_validation
  statement: The isolated excitation closure is an adequate approximation to n3/n2 for H-alpha
    formation in the escaping atmosphere of KELT-9b.
  scope: An intended-use hypothesis awaiting a defined observable/error budget and matched multilevel
    or observational comparison. No physical support or validated domain is asserted.
evidence:
- id: implementation
  kind: implementation
  summary: Inspected pure-H density, blackbody occupation and two-level rate formula, including
    the frozen collision-strength declaration.
  sources:
  - src/escape/hydrogen_populations.py
  - src/escape/parker.py
  scope: Source inspection of the population module and its proton mass/Parker test dependency.
    This does not reconstruct the cited collision-strength table.
  subject: implementation_421f6a5
  provenance:
    role: implementation
    location: src/escape/hydrogen_populations.py:1-57; src/escape/parker.py:PROTON_MASS_CGS
    inspection: inspected
    note: Source bytes are pinned in the Subject. Inventory boundaries and links still require
      human review.
- id: population_tests
  kind: numerical_test
  result: passed
  summary: Six existing population tests passed on CPU with JAX float64; no failures, errors
    or skips.
  sources:
  - tests/test_populations.py
  - mceg/evidence/hydrogen_populations_20261117/receipt.json
  - mceg/evidence/hydrogen_populations_20261117/tests.xml
  - mceg/evidence/hydrogen_populations_20261117/tests.log
  scope: The receipt retains the exact test IDs, command, environment, import locations, tested
    revision and hashes. MCEG was absent from the scientific test environment. This is one run,
    not six independent physical validations.
  subject: implementation_421f6a5
  context: population_tests_20261117
  artifacts:
  - source: mceg/evidence/hydrogen_populations_20261117/receipt.json
    sha256: 61d43169bd00c0ff3a08fb13d4567df0c5854159df40695b79a32cebcb70b2fa
  - source: mceg/evidence/hydrogen_populations_20261117/tests.log
    sha256: f1f54cfc68334b6caa5b964156dc5c0e901f29e16e09cd6110c22d6c9ca062ab
  - source: mceg/evidence/hydrogen_populations_20261117/tests.xml
    sha256: 491be67b5da2bd1bb0ce2508af26cf920c5acbd53836c816c9755546b09736cf
  provenance:
    role: primary
    location: mceg/evidence/hydrogen_populations_20261117/receipt.json
    inspection: inspected
    note: Exit status, JUnit outcomes and captured log checked; selected provider files matched
      Git HEAD before execution and were unchanged afterward. The receipt identifies an installed
      ExoJAX constants module, not the sibling development checkout; this is not an environment
      or transitive dependency lock.
- id: collision_source
  kind: literature
  summary: Implementation-reported source of the shell-averaged effective collision strength.
  sources:
  - https://arxiv.org/html/2010.01042v1#A2
  scope: Lehmann et al. Eq. 49 and Table B.3, citing Anderson et al. data, as named in the code.
    No independent table reconstruction was performed during this onboarding.
  provenance:
    role: secondary
    location: Eq. 49 and Table B.3 (HTML Table 7), as cited by hydrogen_populations.py
    inspection: not_inspected
    note: The citation was located in the implementation. Reading that comment does not establish
      the numerical coefficient or its applicability.
- id: target_paper
  kind: literature
  summary: The target escape model couples Cloudy ionization/thermal structure to outflow and
    uses Ly-alpha trapping and H-alpha radiative excitation to explain the emission.
  sources:
  - https://arxiv.org/html/2606.23899v1
  scope: Sections IV-V were inspected to identify missing physical processes. No author atmosphere,
    Cloudy input or quantitative reproduction is supplied by this evidence.
  provenance:
    role: primary
    location: Sections IV.1, IV.2 and V
    inspection: inspected
    note: A requirements comparison only; the current isolated closure is not a reproduction
      of the paper.
limitations:
- statement: No ground-state/excited-state ionization balance, recombination cascades, 2s/2p
    separation, trapped line field or population feedback from radiative transfer is solved.
  evidence:
  - implementation
  - target_paper
- statement: The closure does not predict the absolute n2 and n3 densities, a variable molecular
    weight or temperature. These require additional atmosphere equations and boundary conditions.
  evidence:
  - implementation
  - target_paper
- statement: The default collision strength and shell averaging have not been independently
    audited in this record. The sampled no-inversion and Boltzmann limits do not establish physical
    applicability.
  evidence:
  - collision_source
  - population_tests
- statement: No Cloudy comparison, observation fit, NUTS run or derivative check was performed
    for this evidence snapshot. Other model families remain uncontracted in the inventory.
  evidence:
  - population_tests
