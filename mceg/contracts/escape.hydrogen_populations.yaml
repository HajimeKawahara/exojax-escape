  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: Couple stellar/continuum radiation and Ly-alpha/H-alpha fields to populations, then
    variable-mu winds, H-minus continuum and thermal balance in separately reviewed stages.
  requires:
  - Specified irradiation, radiation closure/geometry, lower boundary and heating/cooling processes.
  completion: Record closure assumptions and grid/angle/frequency convergence; evaluate composition
