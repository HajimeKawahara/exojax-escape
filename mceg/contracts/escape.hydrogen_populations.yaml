- id: implicit_gradients
  target_kind: claim
  target: physical_accuracy
  revision: '1'
  action: For the new coupled solver, differentiate the same converged residual used for the
    physical solution.
  requires:
  - A closed residual including radiation/population feedback and solver diagnostics.
  completion: Retain JVP/VJP versus independent finite-difference checks and synthetic NUTS
