    and charge/nucleus conservation.
  requires:
  - Reviewed atomic data and a specified level truncation, boundary conditions and reaction-time
    versus flow-time assessment.
  completion: Register the new model and retain conservation, detailed-balance and level-convergence
    evidence; keep this historical isolated model distinct.
