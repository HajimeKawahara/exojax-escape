equations:
- id: mass
  revision: '1'
  latex: n_e=n_p=x n_{\rm H},\quad \mu=\frac{1}{1+x},\quad \rho={m_{\mathrm H}} n_{\rm H}=\frac{\dot M}{4\pi
    r^2v},\quad a^2=\frac{P}{\rho}=\frac{{k_{\mathrm B}} T}{\mu{m_{\mathrm H}}}.
  description: Mass continuity and the pure-H equation of state (document label eq:mass).
  scope: The selected native pure-H formulation, not a Cloudy-equivalence claim.
  symbols:
    radius: &id003
      latex: r
      description: Radius
      unit: cm
    density: &id008
      latex: \rho
      description: Mass density
      unit: g cm^-3
    temperature: &id004
      latex: T
      description: Gas temperature
      unit: K
    mu: &id005
      latex: \mu
      description: Mean molecular weight per hydrogen-mass unit
      unit: '1'
    velocity: &id006
      latex: v
      description: Radial velocity
      unit: cm s^-1
    electron: &id007
      latex: n_e
      description: Electron number density; equals proton density
      unit: cm^-3
    mass_loss:
      latex: \dot M
      description: Mass-loss rate
      unit: g s^-1
  assumptions:
  - No helium/metals or nontrace H-minus contribution to mass, charge or pressure.
  evidence:
  - formulation
- id: wind
  revision: '1'
  latex: \left(v-\frac{a^2}{v}\right)\frac{dv}{dr} =\frac{2a^2}{r}-\frac{da^2}{dr}-\frac{GM_p}{r^2}+\kappa
    r, \qquad \kappa=\frac{3GM_\star}{a_{\rm orb}^3}.
  description: Transonic wind with variable T/mu and a linear tide (document label eq:wind).
  scope: The selected native pure-H formulation, not a Cloudy-equivalence claim.
  symbols:
    radius: *id003
    temperature: *id004
    mu: *id005
    velocity: *id006
    sound_squared:
      latex: a^2
      description: Pressure divided by density
      unit: cm^2 s^-2
    tide:
      latex: \kappa
      description: Linear tidal coefficient
      unit: s^-2
  assumptions:
  - One regular sonic point. Log(T/mu) has zero endpoint slopes and is held constant to the outer wind
    boundary.
  evidence:
  - formulation
- id: se
  revision: '1'
  latex: 0=\sum_j(n_jR_{ji}-n_iR_{ij})+n_en_p\alpha_i+n_e^2n_p\beta_i -n_i\Gamma_i-n_en_iq_{i,\mathrm{ion}},
    \qquad \sum_i n_i+n_p=n_{\rm H}.
  description: Local statistical equilibrium with nucleus and charge conservation (document label eq:se).
  scope: The selected native pure-H formulation, not a Cloudy-equivalence claim.
  symbols:
    electron: *id007
    bound: &id009
      latex: n_i
      description: Bound-state number density
      unit: cm^-3
    rates:
      latex: \{R_{ij},\alpha_i,\beta_i,\Gamma_i,q_{i,\rm ion}\}
      description: Atomic rates; units follow each coefficient
      unit: mixed rate units
  assumptions:
  - Resolved lower nl states and configured collapsed shells. No population advection or inverse two-photon
    radiation.
  evidence:
  - formulation
- id: rt
  revision: '1'
  latex: \mu_\Omega\frac{dI_\nu}{dr}=j_\nu-\chi_\nu I_\nu, \quad J_\nu=\frac12\int_{-1}^1I_\nu\,d\mu_\Omega,
    \quad \overline J_{ul}=\int\phi_{ul}(\nu)J_\nu\,d\nu.
  description: Static transfer and profile-averaged mean intensity (document label eq:rt).
  scope: The selected native pure-H formulation, not a Cloudy-equivalence claim.
  symbols:
    mean:
      latex: J_\nu
      description: Mean intensity
      unit: erg s^-1 cm^-2 sr^-1 Hz^-1
    profiles:
      latex: \phi_{ul}
      description: Normalized line profiles
      unit: Hz^-1
    emission:
      latex: j_\nu
      description: Emission coefficient
      unit: erg s^-1 cm^-3 sr^-1 Hz^-1
    extinction:
      latex: \chi_\nu
      description: Extinction coefficient
      unit: cm^-1
  assumptions:
  - Plane-parallel CRD transport; no velocity shifts in the internal radiation solve. The stellar input
    is a normally incident beam.
  evidence:
  - formulation
- id: cell
  revision: '1'
  latex: w_1=(1-e^{-t})/t,\quad w_2=(1-w_1)/t,\quad I_{\rm out}=I_{\rm in}e^{-t}+j_\nu\Delta s\,w_1, \qquad
    \langle I\rangle=I_{\rm in}w_1+j_\nu\Delta s\,w_2.
  description: Exact homogeneous-cell outgoing and average intensities (document label eq:cell).
  scope: The selected native pure-H formulation, not a Cloudy-equivalence claim.
  symbols:
    depth:
      latex: t
      description: Optical depth along a ray
      unit: '1'
    first:
      latex: w_1
      description: First exponential average
      unit: '1'
    second:
      latex: w_2
      description: Second exponential average
      unit: '1'
  assumptions:
  - Nonnegative extinction. Analytic series supply the transparent limit.
  evidence:
  - formulation
- id: thermal
  revision: '1'
  latex: \begin{aligned}q_{\rm adv}&=-\rho v\frac{d}{dr} \left(\frac{{k_{\mathrm B}} T}{(\gamma-1)\mu{m_{\mathrm
    H}}}\right), &q_{\rm exp}&=\frac{{k_{\mathrm B}} T v}{\mu{m_{\mathrm H}}}\frac{d\rho}{dr},\\ q_{\rm
    adv}+q_{\rm exp}+\Gamma_{\rm th}-\Lambda_{\rm th}&=0, &\gamma&=5/3.\end{aligned}
  description: Kinetic thermal balance including advection and expansion (document label eq:thermal).
  scope: The selected native pure-H formulation, not a Cloudy-equivalence claim.
  symbols:
    radius: *id003
    density: *id008
    temperature: *id004
    mu: *id005
    velocity: *id006
  assumptions:
  - Monatomic local-SE closure, gamma=5/3. The prescribed bottom temperature or LTE patch replaces the
    energy equation there; chemical binding energy is not separately advected.
  evidence:
  - formulation
- id: collheat
  revision: '1'
  latex: q_{\rm coll}=n_e\sum_{ij}n_iq_{ij}(E_i-E_j).
  description: Bound-bound collisional kinetic-energy exchange (document label eq:collheat).
  scope: The selected native pure-H formulation, not a Cloudy-equivalence claim.
  symbols:
    electron: *id007
    bound: *id009
    rates:
      latex: q_{ij}
      description: Electron collision coefficients, indexed from/to
      unit: cm^3 s^-1
    energy:
      latex: E_i
      description: Bound-state excitation energy
      unit: erg
  assumptions:
  - The full thermal function adds photoelectron, recombination, ionizing/three-body collision, free-free
    and optional H-minus terms. No extra two-photon thermal loss is added.
  evidence:
  - formulation
- id: ad
  revision: '1'
  latex: \frac{dy}{d\theta}=-\mathcal F_y^{-1}\mathcal F_\theta.
  description: Implicit derivative of a converged atmospheric root (document label eq:ad).
  scope: The selected native pure-H formulation, not a Cloudy-equivalence claim.
  symbols:
    state:
      latex: y
      description: Log-temperature and population-ratio coordinates
      unit: '1'
    parameters:
      latex: \theta
      description: Explicit physical inputs with their declared units
      unit: mixed input units
    residual:
      latex: \mathcal F
      description: Scaled coupled residual
      unit: '1'
  assumptions:
  - A converged admissible root and nonsingular residual Jacobian on a fixed branch are required. An iteration
    history is not the differentiated mathematical model.
  evidence:
  - formulation
bindings:
- id: se_ratios
  equation:
    id: se
    revision: '1'
  subject: connected_observer
  source: src/escape/hydrogen_nlte.py
  symbol: _bound_ratios
  arguments:
    electron_density:
      symbol: electron
    rates:
      symbol: rates
  note: Returns n_i/n_p from the local rate matrix. The actual atmosphere residual recomputes the rates
    from its own internal radiation and supplies this target.
- id: radiation_occupations
  equation:
    id: rt
    revision: '1'
  subject: connected_observer
  source: src/escape/coupled_hydrogen.py
  symbol: CoupledHydrogenModel._occupations
  arguments:
    mean:
      symbol: mean
    profiles:
      symbol: profiles
  note: Integrates the line profiles against the solved J and converts J to photon occupations. Transfer
    itself is a decorated JAX function; this binding does not establish its call graph.
- id: cell_weights
  equation:
    id: cell
    revision: '1'
  subject: connected_observer
  source: src/escape/radiation.py
  symbol: _cell_weights
  arguments:
    depth:
      symbol: depth
  note: Returns only (w1,w2); solve_slab_transfer uses them for outgoing and cell-average intensities.
    This helper mapping does not independently prove the complete transfer solution.
- id: flow_heat
  equation:
    id: thermal
    revision: '1'
  subject: connected_observer
  source: src/escape/atmosphere_wind.py
  symbol: thermal_flow_terms
  arguments:
    radius_cm:
      symbol: radius
    density_g_cm3:
      symbol: density
    temperature_k:
      symbol: temperature
    mean_molecular_weight:
      symbol: mu
    velocity_cm_s:
      symbol: velocity
  note: Returns q_adv and q_exp. The complete atmosphere residual adds kinetic radiative heating/cooling
    and replaces the bottom boundary rows explicitly.
- id: collision_heat
  equation:
    id: collheat
    revision: '1'
  subject: connected_observer
  source: src/escape/hydrogen_continuum.py
  symbol: thermal_energy_exchange
  arguments:
    bound_cm3:
      symbol: bound
    electron_cm3:
      symbol: electron
    rates:
      symbol: rates
  note: The excitation array implements the displayed double sum as one part of the returned total kinetic
    exchange. Energy levels come from atom.excitation_energy_erg.
