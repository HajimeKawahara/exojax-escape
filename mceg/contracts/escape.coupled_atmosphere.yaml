    and 16.72/41.01% at NH=1e21 cm^-2.
  scope: Fixed T=8000 K, nH=1e12 cm^-3, nmax=15, BB10000 K W=.025; native eight-layer slab. This is a
    failed close-matching component comparison, not a matched solved atmosphere.
  sources:
