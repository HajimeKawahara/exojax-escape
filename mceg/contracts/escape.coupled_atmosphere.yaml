contexts:
- id: kelt9b_atmosphere
  scope: Actual HydrogenAtmosphereModel.spectrum plus explicitly qualified numerical controls and intended
    KELT-9b-like use. Each Claim states which evidence applies; no component support is silently promoted
    to physical support.
  settings:
    native_composition: pure-H; optional trace-LTE H-minus
    target_composition: solar, explicitly selected by the user; author composition unknown
    internal_transfer: static slab CRD; normal stellar beam
    thermal_closure: local SE, gamma=5/3; thermal advection and expansion
    wind_outer_radius_rp: 32.0
    physical_inputs: 'review.json: prescribed PHOENIX proxy/profile hashes; not author configuration'
    numerical_control: 'review.json/tests: four layers, nmax=3, blackbody, Mdot=1e15 g/s'
    publication_processing: not recovered
claims:
- id: radiation_connection
  revision: '2'
  kind: numerical_verification
  statement: In the retained numerical controls, the selected spectrum consumes its own coupled radiation/population
    root, with no silent local-SE fallback.
  scope: Actual HydrogenAtmosphereModel.spectrum path plus the separately identified fixed-T coupled-observer
    control. No physical accuracy claim.
  equations:
  - id: se
    revision: '1'
  - id: rt
    revision: '1'
  - id: cell
    revision: '1'
- id: thermal_wind_connection
  revision: '2'
  kind: numerical_verification
  statement: At the retained control point, the selected atmospheric root closes mass/charge conservation
    and kinetic thermal balance with variable-mu transonic flow.
  scope: Four layers, nmax=3 and Mdot=1e15 g/s blackbody control; the fixed bottom temperature is a boundary,
    not a solved energy equation.
  equations:
  - id: mass
    revision: '1'
  - id: wind
    revision: '1'
  - id: thermal
    revision: '1'
  - id: collheat
    revision: '1'
- id: implicit_derivatives
  revision: '2'
  kind: numerical_verification
  statement: The complete spectrum derivative with respect to log mass loss agrees with centered finite
    differences at the retained converged control.
  scope: This one directional derivative is not all-parameter, all-domain or NUTS validation.
  equations:
  - id: ad
    revision: '1'
- id: reference_agreement
  revision: '2'
  kind: numerical_verification
  statement: The solved native atmosphere and observer agree with independently converged, boundary-matched
    Cloudy references within an observable error budget.
  scope: Whole-atmosphere use. Fixed-T component comparisons and unknown author inputs are kept separate.
  equations: []
- id: composition_reduction
  revision: '2'
  kind: numerical_verification
  statement: The pure-H reduction retains the dominant heating channels of the explicitly specified solar-composition
    proxy.
  scope: Prescribed PHOENIX proxy and density/T profiles near 1.1-1.8 Rp. The paper author abundance choice
    remains unknown; this is not a claim about it.
  equations: []
- id: line_closure
  revision: '2'
  kind: physical_validation
  statement: Static CRD transport and an escaping two-photon channel are adequate approximations for the
    target atmospheric radiation and level populations.
  scope: Requires redistribution, moving-medium/geometry and internal two-photon reabsorption error bounds;
    neither a conserved slab nor a resolved frequency grid is sufficient.
  equations:
  - id: rt
    revision: '1'
- id: lower_atmosphere
  revision: '2'
  kind: physical_validation
  statement: The low-temperature rates, optional LTE lower patch and H-minus continuum provide an adequate
    dense lower boundary for the target spectrum.
  scope: Cloudy-style rate extrapolation to 4000 K and a supplied fixed LTE patch are explicit approximations,
    not a solved photosphere.
  equations: []
- id: numerical_resolution
  revision: '2'
  kind: numerical_verification
  statement: Spatial, angular, frequency, atom-size and wind-domain refinement bound errors in the full
    atmospheric solution and selected observable.
  scope: The requested atmospheric domain and observation uncertainties, not only root residuals or profile
    normalization.
  equations: []
- id: observation_operator
  revision: '2'
  kind: physical_validation
  statement: Explicit observation processing reproduces the publication-specific transformation of the
    generated phase spectra.
  scope: Exposure phases and occultation visibility, planet/stellar Doppler shifts, continuum normalization,
    nightly master division, stellar mask and per-pixel weighted coadd, with integration/binning as needed.
  equations: []
evidence:
- id: reference_scope
  kind: literature
  summary: The paper and sunbather require radiation/population feedback, thermal advection/expansion,
    composition-dependent pressure and observation processing.
  scope: Zhang IV-V; Linssen 2.1-2.2.3. Complete customized author inputs, including abundance choice,
    are unavailable.
  sources:
  - https://arxiv.org/html/2606.23899v1
  - https://arxiv.org/html/2404.12775v2
  subject: connected_observer
  context: kelt9b_atmosphere
  artifacts: []
  provenance:
    role: primary
    inspection: inspected
    location: Zhang IV-V; Linssen 2.1-2.2.3. Complete customized author inputs, including abundance choice,
      are unavailable.
    note: Source review and retained measurements are limited to the stated conditions; no general physical
      acceptance follows.
- id: formulation
  kind: theory
  summary: The authored equations distinguish the connected pure-H implementation from physical equivalence.
  scope: doc/coupled_atmosphere.tex labels eq:mass, wind, se, rt, cell, thermal, collheat, ad. Static
    mappings are declarations; selected-path tests check execution.
  sources:
  - doc/coupled_atmosphere.tex
  subject: connected_observer
  context: kelt9b_atmosphere
  artifacts:
