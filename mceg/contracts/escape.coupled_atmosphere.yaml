follow_ups:
- id: verify_reference_agreement
  target_kind: assessment
  target: reference_agreement_review
  action: First resolve controlled-column discrepancies while independently refining Cloudy/native grids,
    then compare the same complete atmosphere and observable under matched boundary conditions.
  completion: Retain independent scoped evidence and update or supersede the Assessment; recording work
    as handled does not make the scientific use ready.
- id: verify_composition_reduction
  target_kind: assessment
  target: composition_reduction_review
  action: Choose and document the intended composition. For a solar target add and validate He/metal ionization,
    multilevel pumping/cascades and collisional energy exchange, or demonstrate a quantitatively adequate
    reduction. Preserve the rejected pure-H assumption.
  completion: Retain independent scoped evidence and update or supersede the Assessment; recording work
    as handled does not make the scientific use ready.
- id: verify_line_closure
  target_kind: assessment
  target: line_closure_review
  action: Compare consistent alternate redistribution/destruction closures and two-photon continuum reabsorption;
    propagate rate and energy differences to the selected spectrum without double counting trapped radiation.
  completion: Retain independent scoped evidence and update or supersede the Assessment; recording work
    as handled does not make the scientific use ready.
- id: verify_lower_atmosphere
  target_kind: assessment
  target: lower_atmosphere_review
  action: Validate low-temperature atomic extrapolations, pressure/domain limits and a thermalized LTE
    join; measure lower-boundary and H-minus chemistry sensitivity.
  completion: Retain independent scoped evidence and update or supersede the Assessment; recording work
    as handled does not make the scientific use ready.
- id: verify_numerical_resolution
  target_kind: assessment
  target: numerical_resolution_review
  action: Refine spatial/angle/frequency/atom grids and wind outer-domain extension on matched roots;
