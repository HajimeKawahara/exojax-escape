- id: composition_experiment
  kind: benchmark
  summary: 'At about 1.1 Rp, database metal bound-bound processes supply 94.65% of molecule-disabled solar
    heating and 84.1% with full chemistry (H-minus: 10.9%). Full-chemistry H+He net heating is -4.68e-4
    and solar is +3.02e-2 erg cm^-3 s^-1.'
  scope: Prescribed PHOENIX proxy and density/T profiles; independently specified Cloudy solar composition,
    not an inferred author abundance. Diagnostic output is unchanged from the unmodified control.
