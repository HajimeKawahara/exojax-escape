schema_version: '0.4'
model:
  id: escape.coupled_atmosphere
  name: 'Connected pure-H atmosphere: implementation and adequacy'
  description: The selected spectrum connects radiation/SE, thermal flow and a variable-mu wind. Numerical
    tests do not establish Cloudy equivalence; the solar-composition heating reduction is contradicted.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exojax-escape
    revision: 4b3fdd651a01eac752e96f3662c611a18940ccf1
    entry_points:
    - src/escape/atmosphere.py:HydrogenAtmosphereModel.spectrum
    - src/escape/hydrogen_nlte.py:_bound_ratios
    - src/escape/coupled_hydrogen.py:CoupledHydrogenModel._occupations
    - src/escape/radiation.py:_cell_weights
    - src/escape/atmosphere_wind.py:thermal_flow_terms
    - src/escape/hydrogen_continuum.py:thermal_energy_exchange
assumptions:
- statement: Pure atomic H, local SE without population advection, kinetic thermal flow, static plane-slab
    CRD radiation and spherical mass continuity. Boundary spectra, LTE patch and H-minus are explicit
    inputs/options.
  evidence:
  - formulation
- statement: The user selected solar composition as the target; the controlled solar proxy is a sensitivity
    test. The published customized author composition and full inputs remain unknown.
  evidence:
  - reference_scope
  - composition_experiment
limitations:
- statement: No full-atmosphere Cloudy equivalence, spatial convergence, validated photospheric join,
    original observation pipeline or NUTS-domain validation is established.
  evidence:
  - column_comparison
  - closure_audit
  - observation_audit
domains:
- kind: scientific_applicability
  status: unknown
  description: 'The intended atmospheric use is not ready: composition is contradicted for the stipulated
    solar proxy; other required physical support remains unresolved.'
  conditions: []
  evidence:
  - composition_experiment
  - column_comparison
- kind: numerical_evaluation
  status: documented
  description: Finite numerical controls only; see retained exact tests and provider validity checks.
  conditions:
  - Float64; finite positive material state; admissible atomic/H-minus rates; nonnegative slab extinction;
    converged atmospheric/wind roots with nonsingular Jacobians.
  - Default Cloudy-style low-temperature extrapolation stops at 4000 K; no silent clipping or fallback
    spectrum.
  - Fixed input/geometry/atom choices are not a validated continuous parameter envelope.
  evidence:
  - formulation
  - execution
