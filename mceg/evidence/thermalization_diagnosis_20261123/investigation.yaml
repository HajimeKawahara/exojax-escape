decisions:
- id: prioritize_coupled_transfer
  revision: '1'
  question: Which next investigation is justified by the current weak PHOENIX spectrum?
  scope: Research priority for this provider snapshot; not adoption of a validated atmosphere.
  options:
  - id: coupled_atom_transfer
    description: Test internally coupled multilevel radiation and populations at fixed material state, then
      energy/composition closure.
  - id: uv_or_extra_opacity
    description: Further tune UV suppression or add opacity before testing the missing internal radiation feedback.
  selected: coupled_atom_transfer
  reasons:
  - The hot retained atmosphere remains strongly underexcited in n2 and nonthermal in H-alpha source; rate
    interventions show that restoring opacity and source brightness are distinct coupled requirements.
  - The toy establishes a possible thermalization/escape contrast but does not repair PHOENIX populations;
    added absorbers or arbitrary UV factors would not resolve this demonstrated structural gap.
  basis:
  - kind: assessment
    id: rate_review
    sha256: 216c5089eafd7e65088b5fa961238d65039839f16aafbd4bde7cdaee0e260653
  - kind: assessment
    id: limit_review
    sha256: eef017dded3242afb12b0a29774490a3ca204dfb1057292b0cc4b4da9f7d7188
  - kind: assessment
    id: slab_review
    sha256: 6671a5c3475aa5d1d8e8e3a0baa770eaff5f9001eda371430f48df74cc080e45
  - kind: assessment
    id: physical_review
    sha256: 164ad1f8409ee1453729db61ec69ede3b25620aa9f67063ad3f3c0cfc567f602
  limitations:
  - Physical repair remains unknown; no fit, posterior or NUTS readiness is claimed.
  - Overlapping beta=0 branches are algebraic counterfactuals, and the isolated slab is not a full-atom transfer
    ablation.
  reconsider_when:
  - Matched full-atom transport fails to maintain both lower emission and upper opacity/source contrast.
  - Thermal/diffuse-continuum or irradiation constraints change the supported explanation.
  subject: retained_diagnosis
  context: intended_atmosphere
