schema_version: '0.4'
model:
  id: escape.thermalization_diagnosis
  name: Deep thermalization and upper-source diagnosis
  description: Research evidence and next-step decision; no runtime model changes or validated planetary repair.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exojax-escape
    revision: 1e4ad8456ef0876a4c377df7cf37e82ca7e3e050; research scripts separately SHA256-pinned
    entry_points:
    - src/escape/nlte_forward.py:HydrogenNLTEForwardModel.population_profiles
    - results/darkening_diagnosis/rates/net_rates.py:budget
    - results/darkening_diagnosis/thermalization/line_scattering.py:solve
assumptions:
- statement: The retained provider solves prescribed-field populations separately from the observer transfer;
    no internal light is returned to this SE path.
  evidence:
  - physics_review
domains:
- kind: scientific_applicability
  status: unknown
  description: Physical adequacy for the observed planet remains unresolved.
  conditions: []
  evidence:
  - physics_review
claims:
- id: net_rate_diagnosis
  revision: '1'
  kind: numerical_verification
  statement: The retained fixed-field atom has the reported net-rate budgets and deep excitation deficits at
    its declared samples.
  scope: Saved blackbody and PHOENIX previous-fit/hot-manual profiles only; no claim about the actual planet.
  equations:
  - id: net_population_budget
    revision: '1'
- id: closure_limits
  revision: '1'
  kind: numerical_verification
  statement: The selected zero-net-radiative-rate counterfactuals produce the recorded population/source responses
    under their algebraic closure.
  scope: Local beta=0 limiting experiments only, not computed escape probabilities, transfer solutions or emergent
    spectra.
- id: two_level_mechanism
  revision: '1'
  kind: numerical_verification
  statement: The frozen-opacity isolated-line calculation demonstrates a bright-deep/dark-upper source in its
    blackbody cases and fails to restore a bright lower source in its PHOENIX cases.
  scope: Static slab, isolated 3d-to-2p two-level CRD closure and the retained discretization checks only.
  equations:
  - id: two_level_source
    revision: '1'
- id: physical_repair
  revision: '1'
  kind: physical_validation
  statement: Coupled radiation, populations and material structure recover the observed KELT-9b H-alpha source
    contrast and spectrum within a declared physical error budget.
  scope: Requires multilevel line/continuum transfer, validated material structure and an appropriate observer
    model; not established by these diagnostics.
evidence:
- id: rate_outputs
  kind: numerical_test
  summary: Frozen-profile gross/net rates, charge/population balance and excitation ratios.
  sources:
  - results/darkening_diagnosis/rates/net_rates.py
  - results/darkening_diagnosis/rates/net_rates.json
  - results/darkening_diagnosis/stellar_input_arrays.npz
  scope: Fixed prescribed radiation; the observer transports light but its result is not returned to the populations.
  subject: retained_diagnosis
  artifacts:
  - source: results/darkening_diagnosis/rates/net_rates.py
    sha256: 8694d922d95cdec21153bea50f1389ca2cace7a7a72fa29ab7c784b1fd6e7b86
  - source: results/darkening_diagnosis/rates/net_rates.json
    sha256: ee211cc12ac9900592fb720d4fdcfbe5988698951927b6f157e7715697451ad3
  - source: results/darkening_diagnosis/stellar_input_arrays.npz
    sha256: 0333197463b309e58eefca7fbc3ed3abb75249a91d0c13bb8fa0a1ac0f2004c0
  provenance:
    role: primary
    location: Retained research outputs and independently inspected scripts
    inspection: inspected
    note: Independently checked the net-bracket identity at every retained line/sample and the shell accounting.
      Source and saved populations match; maximum shell balance residual is 8.68e-15. Relaxation times exclude
      nonlocal radiation response.
  result: passed
- id: limit_outputs
  kind: numerical_test
  summary: Paired upward/downward radiative-rate interventions at the same prescribed material samples.
  sources:
  - results/darkening_diagnosis/rates/trapping_limits.py
  - results/darkening_diagnosis/rates/trapping_limits.json
  scope: Selected line pairs have effective beta=0; unselected lines, collisions, orbital mixing, bound-free
    processes and two-photon decay remain.
  subject: retained_diagnosis
  artifacts:
  - source: results/darkening_diagnosis/rates/trapping_limits.py
    sha256: 998b50828af71a29e28bd0242273f3a71343b8f127456efa69c99601d66f92ad
  - source: results/darkening_diagnosis/rates/trapping_limits.json
    sha256: d2550674e039fbad837d488aa2a6b451d5b9468dce88ef70b5e8da6d471f576d
  provenance:
    role: primary
    location: Retained research outputs and independently inspected scripts
    inspection: inspected
    note: Scaling both radiative directions reproduces the net SE term of J=(1-beta)S+beta Jext, including
      stimulated emission. Effective gross counters are not actual event counts. Independent beta=0 closures
      for overlapping H-alpha branches need not share a realizable Jnu.
  result: passed
- id: slab_outputs
  kind: numerical_test
  summary: Isolated-line formal transfer, source solution, unit-field/transparent checks and retained angle/depth/frequency
    refinements.
  sources:
  - results/darkening_diagnosis/thermalization/line_scattering.py
  - results/darkening_diagnosis/thermalization/metrics.json
  - results/darkening_diagnosis/thermalization/arrays.npz
  - results/darkening_diagnosis/thermalization/interpretation.md
  scope: Frozen opacity and electron density; no multilevel feedback, velocity gradient, continuum opacity
    or spherical geometry.
  subject: retained_diagnosis
  artifacts:
  - source: results/darkening_diagnosis/thermalization/line_scattering.py
    sha256: 5e3e5ff39e02ccad05d3c0a42990a42d7148084e9c658976e14b1f0d618501ae
  - source: results/darkening_diagnosis/thermalization/metrics.json
    sha256: 9480b2675bf5a3309d1499947fb11de731413a757c724c97184fdf5bfb35a497
  - source: results/darkening_diagnosis/thermalization/arrays.npz
    sha256: c213bf5d8d505a5f1fddf3436418752ab4c658c9dc13e870715a3e3f67a6e75c
  - source: results/darkening_diagnosis/thermalization/interpretation.md
    sha256: e0da56e9026426ad4947063b464bb2886465e52aa5684baa430efd0d5004d97e
  provenance:
    role: primary
    location: Retained research outputs and independently inspected scripts
    inspection: inspected
    note: Unit-field error is at most 5.59e-14 and retained source residuals are below 5e-16. Maximum sampled
      refinement changes are 0.12 K (angle), 26.65 K (PHOENIX depth), 0.031 K (blackbody frequency), and 37.43
      K (blackbody depth). No unretained auxiliary check is used.
  result: passed
- id: physics_review
  kind: theory
  summary: Mechanism ranking, illumination direction and independent rate/closure audit.
  sources:
  - results/darkening_diagnosis/notes/physics.md
  scope: Interpretation and proposed discriminating investigation; physical repair remains unknown.
  subject: retained_diagnosis
  artifacts:
  - source: results/darkening_diagnosis/notes/physics.md
    sha256: 8f3ce7064dc5716d16380d63ca60eebad79f446d35ad5563b8e14cdd4c9d6f5e
  provenance:
    role: primary
    location: Retained research outputs and independently inspected scripts
    inspection: inspected
    note: The connected local-SE path loses newly emitted photons from population feedback. Separate coupled
      atom/transfer machinery exists. Missing depth-dependent thermalization is a code-scope finding; real-planet
      causality is not demonstrated.
- id: line_formation_sources
  kind: literature
  summary: Primary definitions of the published planetary mechanism and multilevel source-function contributions.
  sources:
  - https://arxiv.org/html/2606.23899v1#S5
  - https://arxiv.org/html/2407.00384v1
  - https://robrutten.nl/rrweb/rjr-pubs/2017IAUS..327....1R.pdf
  - results/darkening_diagnosis/notes/physics.md
  scope: Zhang Section V motivates the thermalization contrast; solar multilevel examples establish possible
    mechanisms, not transferable planetary numbers.
  artifacts:
  - source: results/darkening_diagnosis/notes/physics.md
    sha256: 8f3ce7064dc5716d16380d63ca60eebad79f446d35ad5563b8e14cdd4c9d6f5e
  provenance:
    role: primary
    location: Cited original papers; exact passages and caveats recorded in physics.md
    inspection: inspected
    note: Gross radiative turnover is distinct from net population control; multilevel interlocking prevents
      a universal two-level interpretation.
limitations:
- statement: No atmospheric repair, optimized fit, optically thick Cloudy validation or NUTS readiness follows
    from these research calculations.
  evidence:
  - physics_review
