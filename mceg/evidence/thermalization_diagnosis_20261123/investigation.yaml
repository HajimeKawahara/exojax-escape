assessments:
- id: rate_review
  subject: retained_diagnosis
  context: sampled_rates
  method: &id002
    id: scoped_diagnosis_review
    revision: '1'
    description: Inspect exact source and retained results, check accounting and limiting-case algebra, and
      distinguish toy mechanisms from a repaired planetary atmosphere.
  evidence:
  - rate_outputs
  - physics_review
  reasons:
  - At hot PHOENIX r/Rp=1.3046875, gas T=13368.477 K while line-center source brightness is 5369.917 K. n2/n1=4.65686556e-9
    is 8.14494249e-6 of its local Boltzmann shell ratio.
  - At that sample Ly-beta is a net n3 sink (-1.7089e9 cm^-3 s^-1), unlike an inference from its gross incoming
    fraction. Ground collisions are a net source. These are local model findings, not measured planetary rates.
  kind: evidence_support
  claim: net_rate_diagnosis
  claim_revision: '1'
  status: supported
  origin: reviewed
  equation_pins:
  - id: net_population_budget
    revision: '1'
    sha256: f1e1c69f6f1d31ca17455d3d592c4b1b1853bafc69d3fdec3e65f5f73f2c8b41
  binding_pins:
  - id: budget_binding
    sha256: 081c34d8503eb63d55925c95714a1f830085b871ba88f494c98d7561abf6caeb
- id: limit_review
  subject: retained_diagnosis
  context: algebraic_limits
  method: *id002
  evidence:
  - limit_outputs
  - physics_review
  reasons:
  - The rate-scaling algebra is exact for the declared independent local closures. Both radiative directions,
    including spontaneous and stimulated terms, are scaled.
  - At hot r/Rp=1.3046875, closing all Lyman net terms raises n2 from 1624 to 2.50e6 cm^-3 but lowers source
    brightness to 3318 K; adding H-alpha closure gives n2=1.25e6 and 7534 K. This motivates coupled opacity/source
    control but is not a physical solution.
  kind: evidence_support
  claim: closure_limits
  claim_revision: '1'
  status: supported
  origin: reviewed
  equation_pins: []
  binding_pins: []
- id: slab_review
  subject: retained_diagnosis
  context: isolated_slab
  method: *id002
  evidence:
  - slab_outputs
  - line_formation_sources
  reasons:
  - The previous-fit blackbody isolated-branch source falls from about 6013 K at 1.055 Rp to 4472 K at 1.805
    Rp although gas remains near 6040-6105 K. Recorded numerical changes are much smaller than this contrast.
  - 'With PHOENIX populations frozen, the lower toy source remains weak: the experiment does not repair the
    atom. Gray full-atom versus blue isolated-line curves change both atom closure and transport, so that comparison
    is not a pure transport ablation.'
  kind: evidence_support
  claim: two_level_mechanism
  claim_revision: '1'
  status: supported
  origin: reviewed
  equation_pins:
  - id: two_level_source
    revision: '1'
    sha256: 2797d94d25bdf50cc65e4bbc760ff3d05dc3d4c235b947ba265b29385fee5820
  binding_pins:
  - id: slab_binding
    sha256: 08f2b325861bfc23bc8b50e40d32bf685cc0911d37e233c4a79cd6da7cc4dfe3
- id: physical_review
  subject: retained_diagnosis
  context: intended_atmosphere
  method: *id002
  evidence:
  - rate_outputs
  - limit_outputs
  - slab_outputs
  - physics_review
  - line_formation_sources
  reasons:
  - No full multilevel line/continuum transfer with population feedback, Cloudy comparison of this optically
    thick atmosphere, physical fit or NUTS inference was performed.
  - The connected temperature law has no upper turnaround or expansion-energy closure; diffuse continuum ionization
    and composition-pressure feedback remain distinct gaps. Direct stellar attenuation acts more strongly deeper
    along the incident column, not selectively at the top.
  - A separate CoupledHydrogenModel exists, but the observer pipeline still uses prescribed-field populations.
    The diagnosis prioritizes testing deep thermalization and the n2 reservoir without declaring a complete
    repair.
  kind: evidence_support
  claim: physical_repair
  claim_revision: '1'
  status: unknown
  origin: reviewed
  equation_pins: []
  binding_pins: []
follow_ups:
- id: test_coupled_thermalization
  target_kind: assessment
  target: physical_review
  action: At fixed density, temperature, atomic data and realistic incident spectrum, couple multilevel line/continuum
    transport to SE and then compare the same observer model. After this controlled comparison, test thermal/composition-pressure
    closure including expansion cooling.
  requires:
  - Explicit angular, line-overlap and redistribution choices, diffuse continua, and independent thin/thick
    controls.
  - Track source contrast together with n2 and H-alpha optical depth/formation radius; dimming the upper layer
    or increasing n2 alone is not a success criterion.
  - Retain numerical convergence, net transition budgets, boundary/energy accounting and a declared physical
    error budget.
  completion: Record the matched full-atom comparison and a new scoped Assessment, preserving this unknown
    physical judgment until evidence supports a narrower conclusion. If source contrast and opacity remain
    inadequate, record the failed hypothesis and test thermal/continuum alternatives before inferring planetary
    parameters.
  sources:
  - results/darkening_diagnosis/notes/physics.md
  - mceg/contracts/escape.stellar_radiation.yaml
follow_up_resolutions: []
equations:
- id: net_population_budget
  revision: '1'
  latex: \mathcal B_{\mathcal S}=\sum_{i\notin\mathcal S,j\in\mathcal S}(n_iP_{ij}-n_jP_{ji})+\sum_{j\in\mathcal
    S}[n_e^2\alpha_j+n_e^3q_j^{3b}-n_j(\Gamma_j+n_eq_j^{ion})]
  description: Net population input to a selected state or shell; internal selected-state transitions cancel.
  scope: Pure hydrogen with ne=np; supplied microscopic rates and fixed external occupations.
  symbols:
    bound:
      latex: n_i
      description: Bound populations
      unit: cm^-3
    electron:
      latex: n_e
      description: Electron and proton density
      unit: cm^-3
    rates:
      latex: \{P,\alpha,q^{3b},\Gamma,q^{ion}\}
      description: Radiative/collisional rate arrays with their existing rate-coefficient units
      unit: mixed rate/coefficient units
    selected:
      latex: \mathcal S
      description: Selected bound-state indices
      unit: dimensionless
    budget:
      latex: \mathcal B_{\mathcal S}
      description: Net budget and its channel decomposition
      unit: cm^-3 s^-1
  assumptions:
  - In/out are microscopic event rates for the baseline; beta-scaled effective rates in the limiting experiment
    have only net-closure meaning.
  evidence:
  - rate_outputs
  - physics_review
- id: two_level_source
  revision: '1'
  latex: \overline{\boldsymbol J}=\boldsymbol\Lambda\boldsymbol S+\boldsymbol b,\qquad[\boldsymbol I-\operatorname{diag}(1-\epsilon)\boldsymbol\Lambda]\boldsymbol
    S=(1-\epsilon)\boldsymbol b+\epsilon\boldsymbol B
  description: Isolated two-level CRD source with fixed opacity and formal-transfer operator.
  scope: Static plane-parallel slab and supplied boundary intensities; not the full hydrogen atom.
  symbols:
    operator:
      latex: \boldsymbol\Lambda
      description: Profile-averaged formal-transfer operator
      unit: dimensionless
    boundary:
      latex: \boldsymbol b
      description: Boundary contribution to profile-averaged intensity
      unit: erg s^-1 cm^-2 Hz^-1 sr^-1
    epsilon:
      latex: \epsilon
      description: Cul(1-exp(-hnu/kT))/(Aul+Cul(1-exp(-hnu/kT)))
      unit: dimensionless
    thermal:
      latex: \boldsymbol B
      description: Planck intensity at each cell temperature
      unit: erg s^-1 cm^-2 Hz^-1 sr^-1
  assumptions:
  - Opacity and electron density remain frozen; interlocking, continuum transport and moving/spherical geometry
    are omitted.
  evidence:
  - slab_outputs
  - line_formation_sources
