decisions:
- id: next_physical_coupling
  revision: '1'
  question: Which physical extension should the diagnostics prioritize?
  scope: The current prescribed-field observer and retained diagnostic evidence; a research priority rather
    than a declaration of successful repair.
  options:
  - id: frequency_dependent_radiation
    description: Resolve internal radiation/population feedback, especially the distinct Lyman channels,
      and assess its coupling to thermal/density structure.
  - id: uniform_radiation_scaling
    description: Use one global attenuation factor as a physical repair.
  - id: broadening_only
    description: Treat natural-width changes as the primary explanation of the fit gap.
  selected: frequency_dependent_radiation
  reasons:
  - The width-only control leaves the legacy fit intact, while joint source, opacity, temperature and
    velocity replacements reproduce the useful profile. A broadening-only change is not supported as the
    leading repair by these controls.
  - Selective Lyman-channel changes cause large, different source and opacity responses. Frequency-dependent
    internal radiation coupled to populations is therefore the next physical dependency to test; uniform
    suppression of UV is not an adequate physical substitute.
  - Expanded local searches and numerical refinements do not eliminate the retained fit gap, while temperature-domain
    and excited-column freedoms still confound comparisons. Radiation feedback must be tested together
    with its implications for thermal and density structure, followed by a matched observation operator.
  - This is a research priority under an explicitly unknown physical-adequacy Assessment. Better counterfactual
    fits and small numerical errors are not promoted to physical validation.
  basis:
  - kind: assessment
    id: profile_review
    sha256: 80d04c21d9a5f8a003f5f3014f081c89afcbdbebc2b9669c406063ed96df238f
