schema_version: '0.4'
model:
  id: escape.physics_diagnosis
  name: Diagnosing the gap between free population models and the prescribed-field atom
  description: Controlled profile and radiation diagnostics identify promising missing couplings without
    promoting a free-model fit to physical validation.
  implementation:
    repository: https://github.com/HajimeKawahara/exojax-escape
    revision: Provider 5898d686202fb83f5bce66a0d44e7f2de8d080a5; diagnostic scripts identified by selected-file
      SHA256
    entry_points:
    - results/physics_diagnosis/hybrid_controls.py:tex
    - results/physics_diagnosis/hybrid_controls.py:score
    - src/escape/nlte_forward.py:HydrogenNLTEForwardModel.population_profiles
    - src/escape/hydrogen_forward.py:HydrogenForwardModel._transfer_line_coefficients
assumptions:
- statement: All spectra use prescribed thermal/dynamical inputs and an incomplete observation comparison.
    The numerical sensitivities do not replace internal radiation transfer.
  evidence:
  - provider_scope
domains:
- kind: scientific_applicability
  status: unknown
  description: Physical adequacy for observational inference is unestablished.
  conditions: []
  evidence:
  - provider_scope
claims:
- id: profile_control_outcomes
  revision: '1'
  statement: The retained source/opacity/temperature/velocity substitutions and width-only controls establish
    the reported finite spectral sensitivities.
  kind: numerical_verification
  scope: Descriptive comparison on the recorded grids and prescribed profiles. A better counterfactual
    spectrum is not a physically realized atmosphere.
  equations:
  - id: source_brightness
    revision: '1'
- id: expanded_fit_outcomes
  revision: '1'
  statement: The retained local searches establish the reported fitting outcomes for their specified starts,
    bounds and numerical configurations.
  kind: numerical_verification
  scope: A scoped local optimization result, not proof of a global minimum, equal model complexity, an
    observational likelihood or physical validity.
  equations: []
- id: selective_lyman_sensitivity
  revision: '1'
  statement: Changing selected prescribed ground-state radiation channels produces the recorded, distinct
    population/source/spectrum responses.
  kind: numerical_verification
  scope: Controlled occupation sensitivities only. Uniform attenuation and selective channel changes are
    hypotheses to diagnose, not solutions of transport.
  equations: []
- id: physical_repair_adequacy
  revision: '1'
  statement: The atmospheric model is sufficiently complete and physically accurate to interpret the processed
    KELT-9b H-alpha observations.
  kind: physical_validation
  scope: Requires coupled radiation/populations and thermal/density/velocity structure plus an adequate
    observation operator and physical error budget. None is established by these diagnostics.
  equations: []
