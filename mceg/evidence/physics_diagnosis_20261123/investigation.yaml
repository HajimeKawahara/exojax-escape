assessments:
- id: profile_review
  subject: diagnostic_snapshot
  context: profile_controls
  method:
    id: scoped_diagnostic_review
    revision: '1'
    description: Inspect retained inputs, process outcomes, source identities, explicit controls and numerical
      limits; distinguish diagnostic sensitivity from physical adequacy.
  evidence:
  - profile_and_hybrid_run
  reasons:
  - The saved legacy spectra yield normalized residual RMS 0.894885, 0.909068 and 1.072241 on the same
    87 observations. Re-evaluation at the common diagnostic grid reproduces these within the documented
    discretization difference.
  - For legacy Model 2, using resolved full-lifetime H-alpha branches changes RMS only from 0.906740 to
    0.903643. This control does not support natural-width changes as the dominant source of the fit gap.
  - For the current fitted profile, source-only substitution worsens RMS from 1.831930 to 5.590320. Source
    plus opacity gives 2.198160; adding temperature gives 1.242875, adding velocity instead gives 1.741623,
    and all four profiles give 0.903656. These are non-equilibrium counterfactuals and establish joint
    structural sensitivity rather than a unique physical repair.
  - Rest-center branch-weighted source brightness and integrated extinction are separately checked. The
    Equation and Binding identify the positive-source brightness conversion; neither establishes LTE or
    a kinetic temperature.
  kind: evidence_support
  claim: profile_control_outcomes
  claim_revision: '1'
  status: supported
  origin: reviewed
  equation_pins:
  - id: source_brightness
    revision: '1'
    sha256: 58d0aa60656019f526445d205a1adcdc30b67140c8cd15abc11cdcc88b2e61c3
  binding_pins:
  - id: source_brightness_diagnostic
    sha256: 32c85938f0078e7039e25252d8f38023e948eaa2b6d5a084e84a625c0f8ef33a
- id: fit_review
  subject: diagnostic_snapshot
  context: local_fits
  method:
    id: scoped_diagnostic_review
    revision: '1'
    description: Inspect retained inputs, process outcomes, source identities, explicit controls and numerical
      limits; distinguish diagnostic sensitivity from physical adequacy.
  evidence:
  - expanded_fit_run
  reasons:
  - Three nonisothermal starts with free mass loss, kinetic top temperature and zonal speed reach RMS
    1.811694. Three isothermal starts with an additional independent wind temperature reach RMS 2.390293,
    1.788410 and 1.788410; the separate low-mass start gives 2.418594. These local outcomes do not close
    the legacy fit gap or prove a global optimum.
  - Both selected best local fits reach the 6000 K kinetic-temperature lower bound and require profiled
    offsets near -2219 and -2176 ppm. Legacy fits allowed independent excited columns, different temperature
    and wind freedoms, and baseline bounds of +/-500 ppm; residual RMS is not equal-complexity model selection.
  - Selected best-fit gradient checks pass rtol 0.003 and atol 1e-7. Layer doubling and nmax 15 to 20
    change spectra by at most 0.024741 of the supplied uncertainty, below the declared numerical 0.1-sigma
    tolerance. This is a numerical comparison at sampled fits, not a physical model-error budget.
  - The retained fit summary labels its coefficient-integrated source diagnostic explicitly. It is not
    substituted for the rest-center branch-weighted source used in the profile/irradiation controls.
  kind: evidence_support
  claim: expanded_fit_outcomes
  claim_revision: '1'
  status: supported
  origin: reviewed
  equation_pins: []
  binding_pins: []
- id: radiation_review
  subject: diagnostic_snapshot
  context: prescribed_irradiation
  method:
    id: scoped_diagnostic_review
    revision: '1'
    description: Inspect retained inputs, process outcomes, source identities, explicit controls and numerical
      limits; distinguish diagnostic sensitivity from physical adequacy.
  evidence:
  - radiation_sensitivity_run
  reasons:
  - At fixed density, kinetic temperature and velocities, reducing Ly-beta and higher ground-state occupations
    by 0.1 lowers the current fitted atmosphere's source brightness at 1.8 Rp from 7628 to 4677 K; reducing
    all Lyman occupations instead raises it to 8274 K. A single UV scaling cannot represent these channel-dependent
    responses.
  - Changing only H-alpha occupation by 0.1 produces a much smaller source response. Local budgets identify
    large gross resonance-pumping flows, but these include repeated absorption/decay and must not be described
    as net escaping H-alpha photon creation.
  - The higher-Lyman 0.1 intervention improves the manual spectrum RMS from 3.746029 to 2.315455 but worsens
    the current fitted spectrum from 1.831930 to 2.380197. Lowering source brightness alone is therefore
    not a demonstrated spectral repair.
  - All full-column controls keep imposed continuum occupations and material profiles fixed while recomputing
    charge and populations. They do not include depth-dependent attenuation, diffuse radiation or energy
    balance. The sampled manual higher-Lyman layer and atom refinements differ by at most 0.002258 sigma.
