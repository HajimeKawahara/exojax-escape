  - kind: assessment
    id: radiation_review
    sha256: 676c0be15d6859b4e3113fc0906a049b38f66c99f8f475f3e6a099a0dcabecf4
  - kind: assessment
    id: physical_review
    sha256: 37023daa8c483e370208e7a194ef6cb6408e681801ba500c7a5d4194a81811ed
  limitations:
  - This choice does not establish the true radiation field, an adequate atmosphere, or a validated likelihood.
  - Single-channel occupation changes can diagnose a dependency but cannot replace attenuation plus internally
    generated radiation.
  - Temperature, density/ionization-pressure feedback, geometric emission and observation processing remain
    separate uncertainties.
  reconsider_when:
  - Matched RT-plus-population calculations fail to produce the required source/opacity structure.
  - A different stellar spectrum, temperature domain, kinetic model or observation operator changes the
    comparison.
