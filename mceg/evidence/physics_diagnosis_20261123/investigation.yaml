    do not count net escaping photons. The supplementary blackbody integral is a spectral-shape diagnostic,
    not the exact stellar input of Zhang et al. No self-consistent internal radiation field or energy/flow
    closure is solved.
  result: passed
  provenance:
    role: primary
    location: Retained local diagnostic scripts and outputs
    inspection: inspected
    note: Reviewed the executed rate-budget and full-column occupation scripts and outputs. All 84 local
      roots are valid/converged, max rate residual is 2.46e-14 and max shell ingress/loss imbalance is
      2.46e-13. The six unmodified local checks recover the saved populations within 3.4e-14 fractionally.
      All ten full-column cases are valid/converged; both unmodified spectra recover the public path below
      5e-16 absolute. Two sampled manual higher-Lyman refinements pass 0.1 sigma. One extreme local ablation
      has a flagged inversion; it is not treated as a positive Planck brightness. The supplementary blackbody
      integral is retained as a convention-specific spectral-shape diagnostic, not an exact comparison
      to the unavailable 2026 stellar SED.
