contexts:
- id: field_sensitivity
  scope: Two prescribed atmospheres and five field variations each; figures use independently fitted constant
    offsets.
  settings:
    mass_loss_cases_g_s: 1e14, 1e15
    temperature_parameters_k: 10000, 14000
    base_temperature_k: 6000.0
    halpha_factors: 1, 0.3, 0.1
    turnover_radius_rp: 1.8
    turnover_width_rp: 0.25
- id: radiative_columns
  scope: Three retained prescribed atmospheres; static outward columns to 3 Rp including half the sampling
    layer.
- id: partial_observation
  scope: 115 selected exposures in two orders and three phase-anchor spectra; stellar mask applied before
    pixelwise normalization.
  settings:
    phase_min: 0.3
    phase_max: 0.45
    planet_semiamplitude_kms: 244.8
    stellar_mask_kms: 110.0
    anchor_phases: 0.30, 0.375, 0.45
- id: intended_atmosphere
  scope: Complete processed phase-averaged observation and a physically closed atmospheric model.
assessments:
- id: field_review
  kind: evidence_support
  claim: sampled_field_sensitivity
  claim_revision: '1'
  status: supported
  origin: reviewed
  subject: diagnostic_snapshot
  context: field_sensitivity
  method:
    id: scoped_assumption_review
    revision: '1'
    description: Review complete numerical artifacts, source identity, scoped controls and missing physical/observational
      components. A sensitivity result does not validate its prescribed fields.
  evidence:
  - sensitivity_run
  reasons:
  - All ten retained calculations converge; the no-cooling, unit-pumping controls reproduce the public
    model to less than 1.2e-17 absolute contrast.
  - For the manual case, line-center contrast after its fitted constant is 1188.51 ppm at the reference,
    1145.33 ppm for pumping x0.1 and 1110.73 ppm for cooling plus pumping x0.3. This particular diagnostic
    does not remove the overbright central region.
  - 'The cooling parameter is not the achieved maximum temperature: amplitude 14000 K gives about 12498
    K. The law remains at or above 6000 K and does not reproduce the paper lower atmosphere or solve expansion
    cooling.'
  - At the two cooling-plus-pumping-x0.3 points, joint layer/atom/wind refinement changes pixels by 0.03061
    and 0.02442 supplied-error units, below the existing 0.1 criterion. A sampled 8193-node sonic-numerator
    check finds one sign crossing from 1 to 32 Rp. This is not a complete topology proof or all-axis convergence
    guarantee.
  equation_pins:
  - id: prescribed_temperature
    revision: '1'
    sha256: a09403fa381e83c73c50e6710bc7bc5e4fc89f07c0b9e42e8e504567aee0a3bc
  - id: halpha_pumping
    revision: '1'
    sha256: 547ad5e17e055a6dc68895a68035b171d2a2b8c20828e8beaa0189870eea8876
  binding_pins:
  - id: temperature_law
    sha256: bf9dd349838d5377a218f7a08a169ee29484b10c6eb6dc7d8b51b39696d3372a
  - id: occupation_ablation
    sha256: 1ce1162dbf23ea19784a050ccf3f545a8ef80b7e894d1b5a5ea2d899bb2c7311
- id: column_review
  kind: evidence_support
  claim: optically_thick_channels
  claim_revision: '1'
  status: supported
  origin: reviewed
  subject: diagnostic_snapshot
  context: radiative_columns
  method:
    id: scoped_assumption_review
    revision: '1'
    description: Review complete numerical artifacts, source identity, scoped controls and missing physical/observational
      components. A sensitivity result does not validate its prescribed fields.
  evidence:
  - optical_depth_run
  reasons:
  - At the baseline representative H-alpha layer near 1.367 Rp, Lyman-edge true-absorption optical depth
    is about 18.67 and static Ly-alpha center optical depth about 1.76e5.
  - At the manual moving-center formation-height sample near 1.633 Rp, corresponding columns are about
    40.62 and 3.22e5. The local Balmer edge remains optically thin there.
  - These are columns computed from prescribed-field populations, not a radiation-population fixed point.
    They motivate a transport calculation without establishing Case B, an escape probability or heating
    dominance.
  equation_pins: []
  binding_pins: []
- id: operator_review
  kind: evidence_support
  claim: partial_operator_changes_spectrum
  claim_revision: '1'
  status: supported
  origin: reviewed
  subject: diagnostic_snapshot
  context: partial_observation
  method:
    id: scoped_assumption_review
    revision: '1'
    description: Review complete numerical artifacts, source identity, scoped controls and missing physical/observational
      components. A sensitivity result does not validate its prescribed fields.
  evidence:
  - partial_operator_run
  - input_reconstruction
  reasons:
  - The normalized phase-anchor weights sum to unity at every pixel to within 1.4e-15. At blue, center
    and red sample velocities, masking selects different exposure counts and mean phases.
  - The previous fixed-horizontal fit has red-minus-blue peak differences about 7.34 ppm at phase 0.375,
    24.99 ppm with unmasked cadence weighting, and 184.48 ppm with the stellar mask.
  - The manual atmosphere includes fixed horizontal velocities in this experiment, so its approximately
    429-to-514 ppm comparison must not be confused with the earlier 312 ppm radial-only candidate.
  - Independent constant offsets are used only for plotting and exploratory residuals; changes over supplied
    error and peak differences are calculated from the unshifted contrast.
  equation_pins:
  - id: partial_phase_coadd
    revision: '1'
    sha256: 25e5b3d98a09aa4beb488893f3d2507976913c16777d913f00a40eb524f2c96b
  binding_pins:
  - id: normalized_phase_weights
    sha256: 4a23911c054529965c2e374aff0b23be585c595be5e493f99319e6d2a0e8e384
- id: intended_use_review
  kind: evidence_support
  claim: intended_use
  claim_revision: '1'
  status: unknown
  origin: reviewed
  subject: diagnostic_snapshot
  context: intended_atmosphere
  method:
    id: scoped_assumption_review
    revision: '1'
    description: Review complete numerical artifacts, source identity, scoped controls and missing physical/observational
      components. A sensitivity result does not validate its prescribed fields.
  evidence:
  - sensitivity_run
  - optical_depth_run
  - partial_operator_run
  - input_reconstruction
  - companion_normalization
  reasons:
  - The prescribed-field tests do not solve the coupled thermal/radiation/ionization/wind problem or demonstrate
    physical adequacy.
  - The partial coadd omits nightly-master division and continuum normalization; its inverse-variance
    weights and wavelength-frame interpretation are explicit assumptions. A companion paper gives a related
    polynomial recipe, but public residual time series do not establish the H-alpha-specific windows,
    weights, coefficients or master.
  - No observational rejection threshold or global parameter search was defined. These diagnostics neither
    establish a calibrated likelihood nor prove that the model family cannot fit the observation.
  equation_pins: []
  binding_pins: []
equations:
- id: prescribed_temperature
  revision: '1'
  latex: T(r)=6000\,{\rm K}+(T_a-6000\,{\rm K})(1-e^{-(r/R_p-1)/0.12})\left[(1-q)+q\,\operatorname{sigmoid}\!\left(\frac{1.8-r/R_p}{0.25}\right)\right],\quad
    q\in\{0,1\}
  description: A bounded diagnostic turnover is applied to the existing rising-temperature family; the
    wind and mass-conserving density are recomputed.
  scope: Prescribed sensitivity law, not a solved energy equation, a fitted paper profile or a validated
    new atmospheric model.
  symbols:
    radius:
      latex: r
      description: Radial coordinate
      unit: cm
    temperature:
      latex: T
      description: Gas temperature
      unit: K
    amplitude:
      latex: T_a
      description: Asymptotic parameter of the no-cooling law, not the achieved peak when q=1
      unit: K
    toggle:
      latex: q
      description: Turnover switch
      unit: '1'
  evidence:
  - sensitivity_run
- id: halpha_pumping
  revision: '1'
  latex: \eta^{\prime}_{ul}=\eta^{\rm BB}_{ul}\left[1+(f_{\rm H\alpha}-1)\mathbf{1}_{n_u=3,n_l=2}\right],\qquad
    \eta^{\prime}_{\nu,{\rm cont}}=\eta^{\rm BB}_{\nu,{\rm cont}}
  description: Only the three incident H-alpha bound-bound occupations are multiplied by 1, 0.3 or 0.1;
    continua and other lines retain the prescribed diluted blackbody.
  scope: A spectral-shape sensitivity, not a measured PHOENIX absorption depth, attenuation solution or
    trapped line field.
  symbols:
    occupation:
      latex: \eta
      description: Photon occupation
      unit: '1'
    factor:
      latex: f_{\rm H\alpha}
      description: H-alpha pumping multiplier
      unit: '1'
  evidence:
  - sensitivity_run
- id: partial_phase_coadd
  revision: '1'
  latex: C_a(v)=\frac{\sum_i B_{ia}w_i(v)}{\sum_i w_i(v)},\quad \widehat f(v)=\sum_a C_a(v)f_a(v),\quad
    w_i(v)=M_i(v)\sum_o\sigma_{io}^{-2}(v+v_{p,i})
  description: Three phase-anchor spectra are linearly interpolated and coadded with wavelength-dependent
    normalized weights. The stellar-frame mask is applied before pixelwise normalization.
  scope: 'Partial operator only: assumed inverse-variance weights and stellar wavelength frame, actual
    archived cadence. Nightly-master division and continuum normalization are absent.'
  symbols:
    anchor_weights:
      latex: C_a(v)
      description: Normalized phase-anchor mixture
      unit: '1'
    weights:
      latex: w_i(v)
      description: Exposure weights after phase and stellar mask
      unit: inverse residual variance
    basis:
      latex: B_{ia}
      description: Linear interpolation weights from exposure phase to three anchors
      unit: '1'
    spectrum:
      latex: \widehat f
      description: Partial phase-averaged line contrast
      unit: '1'
  evidence:
  - partial_operator_run
