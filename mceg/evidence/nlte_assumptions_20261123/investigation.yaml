  scope: Third-degree pre-master and fifth-degree residual normalization are described for the related
    study. Their exact H-alpha-specific transfer, fitting windows and coefficients remain unverified;
    the metal-line smoothing filter is not adopted here.
  provenance:
    role: primary
    location: Zhang et al., arXiv:2601.20849v1, Section II
    inspection: inspected
    note: Inspected by the observation-operator reviewer; used to narrow the missing-information statement,
      not to assert a recovered H-alpha pipeline.
