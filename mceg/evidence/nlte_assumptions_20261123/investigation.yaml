schema_version: '0.4'
model:
  id: escape.nlte_assumptions_investigation
  name: Prescribed-field and partial-observation diagnostics before NUTS
  description: An exploratory script snapshot reusing unchanged provider sources; the new cooling law
    and approximate coadd are not silently promoted to validated production physics.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exojax-escape
    revision: local diagnostic snapshot 2026-11-23; provider a2ff2e7, analysis scripts identified by SHA256
    entry_points:
    - results/nlte_assumptions/sensitivity.py:temperature_law
    - results/nlte_assumptions/sensitivity.py:calculate
    - results/nlte_assumptions/operator_experiment.py:phase_weights
    - results/nlte_assumptions/optical_depth_audit.py
    - results/nlte_assumptions/reconstruct_data.py
assumptions:
- statement: Temperature and irradiation variations are prescribed. The partial observing operator uses
    archived cadence but assumes inverse-variance weights and omits complete reduction.
  evidence:
  - sensitivity_run
  - partial_operator_run
domains:
- kind: scientific_applicability
  status: unknown
  description: No physically validated atmosphere or complete data-processing likelihood is established.
  conditions: []
  evidence:
  - sensitivity_run
  - partial_operator_run
claims:
- id: sampled_field_sensitivity
  revision: '1'
  kind: numerical_verification
  statement: The retained changes of prescribed temperature and H-alpha pumping alter the source and spectrum
    while the ten local-population calculations remain converged.
  scope: Measured finite sensitivity only; no continuum of valid parameters or claim that these prescriptions
    are physically correct.
  equations:
  - id: prescribed_temperature
    revision: '1'
  - id: halpha_pumping
    revision: '1'
- id: optically_thick_channels
  revision: '1'
  kind: numerical_verification
  statement: The retained prescribed atmospheres have optically thick Lyman channels above the representative
    H-alpha line-formation layers.
  scope: Calculated static radial columns of these populations only; optical thickness does not determine
    the true mean field or energy budget.
- id: partial_operator_changes_spectrum
  revision: '1'
  kind: numerical_verification
  statement: At the two retained atmospheres, archived cadence and the stated stellar mask change phase
    weights and red-blue peak differences in the explicitly partial coadd.
  scope: The defined approximate operator is evaluated; correspondence to the authors complete data reduction
    is unverified.
  equations:
  - id: partial_phase_coadd
    revision: '1'
- id: intended_use
  revision: '1'
  kind: physical_validation
  statement: The atmospheric closure and observation operator are physically adequate for inference from
    the processed KELT-9b spectrum.
  scope: Not established by this investigation; exact normalization, self-subtraction, correlated errors
    and coupled radiation/thermal/wind structure remain separate gaps.
