contexts:
- id: manual_candidate
  scope: One illustrative high-mass-loss atmosphere, selected for visible asymmetry rather than observational
    goodness of fit.
  settings:
    temperature_base_k: 6000.0
    temperature_top_k: 14000.0
    mass_loss_g_s: 1000000000000000.0
    tidal_coefficient_s2: 7.243193304369553e-09
    wind_mean_molecular_weight: 0.5
    radiation_dilution: 0.025
    radiation_temperature_k: 10000.0
    phase: 0.375
    rotation_kms: 0.0
    zonal_kms: 0.0
    nmax: 15
    nlayer: 128
    nlon: 12
    nlat: 6
    nnu: 601
    continuum_points: 48
    wind_ngrid: 129
- id: exploratory_fit
  scope: Several deterministic least-squares starts with JAX derivatives, a fitted constant baseline and
    fixed horizontal-velocity scenarios; no NUTS, global-optimum or calibrated-likelihood claim.
  settings:
    start_count: 6
    mass_loss_min_g_s: 100000000000.0
    mass_loss_max_g_s: 1000000000000000.0
    temperature_top_min_k: 6000.0
    temperature_top_max_k: 14000.0
    fit_coordinates: ln(Mdot/1e13), Ttop/1e4
    baseline: analytic weighted constant
    horizontal_scenarios: off; fixed synchronous rotation and zonal 11.6 km/s
    optimizer: scipy least_squares with JAX jacfwd
    max_nfev: 50
- id: intended_atmosphere
  scope: Processed, phase-averaged KELT-9b observations with the physical atmosphere and observation operator
    not independently validated.
assessments:
- id: capability_review
  kind: evidence_support
  claim: red_dominant_capability
  claim_revision: '1'
  status: supported
  origin: reviewed
  subject: spectrum_implementation
  context: manual_candidate
  method: &id001
    id: scoped_exploratory_review
    revision: '1'
    description: Inspect measured spectra, fixed-population controls, solver diagnostics, source identity
      and stated limitations; do not infer global fit adequacy.
  evidence:
  - implementation_identity
  - manual_scan
  - candidate_controls
  reasons:
  - At the exact manual context, red minus blue peak height is +311.846090 ppm; the same populations with
    Doppler shifts off give +0.159567 ppm and reversed radial shifts give -311.536778 ppm. The nearly
    symmetric off control retains a small rest-grid/continuum asymmetry.
  - Both maxima and the intervening trough persist. All local solves converge and spectra are finite;
    the maximum scaled rate residual is 1.9332e-15.
  - Separate 128-to-256-layer and nmax=15-to-20 changes are 0.0246437 and 0.0156815 supplied-error units,
    below the existing 0.1 numerical scale. This does not extend convergence to untested grids or atmospheres.
  - The candidate is an existence demonstration at 1e15 g/s and 14000 K, not an inferred atmosphere or
    a successful observational fit.
- id: intended_use_review
  kind: evidence_support
  claim: atmospheric_accuracy
  claim_revision: '1'
  status: unknown
  origin: reviewed
  subject: spectrum_implementation
  context: intended_atmosphere
  method: *id001
  evidence:
  - implementation_identity
  - manual_scan
  - local_fits
  reasons:
  - The data-processing operator, atmospheric closure and correlated residual likelihood remain unvalidated;
    a single-phase line contrast plus constant offset is only an exploratory comparison.
  - All six starts complete, but the radial-only solution reaches the imposed 6000 K lower bound. The
    local fits retain weak peak-height differences of about 4.54 and 7.34 ppm; numerical derivative/refinement
    checks do not establish physical adequacy.
  - No prespecified observational fit rejection criterion exists. These selected local solutions neither
    prove a global model impossibility nor validate an atmospheric posterior.
limitations:
- statement: Qualitative peak asymmetry is an existential numerical result, not a physically validated
    fit. The manual candidate uses 1e15 g/s and the upper 14000 K atomic-data limit; its wind molecular
    weight remains independent of solved ionization.
  evidence:
  - implementation_identity
  - manual_scan
- statement: The current experiment cannot establish a global optimum or prove that all allowed model
    parameters fail to explain the data.
  evidence:
  - local_fits
