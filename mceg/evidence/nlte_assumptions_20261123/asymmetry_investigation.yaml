schema_version: '0.4'
model:
  id: escape.nlte_asymmetry_investigation
  name: Exploratory NLTE line asymmetry before NUTS
  description: Parameter exploration of the unchanged escape.nlte_spectrum implementation. This local
    result record is not a new physical model or a publication-ready observation fit.
  implementation:
    repository: https://github.com/HajimeKawahara/exojax-escape
    revision: a2ff2e7dc3728600bdfcfdfb2309467dda6335b4
    entry_points:
    - src/escape/nlte_forward.py:HydrogenNLTEForwardModel.population_profiles
    - src/escape/hydrogen_atom.py:atom_natural_width_hz
    - src/escape/nlte_forward.py:halpha_coefficients
    - src/escape/nlte_forward.py:HydrogenNLTEForwardModel._line_profiles
    - src/escape/hydrogen_forward.py:HydrogenForwardModel._transfer_line_coefficients
    - tools/verify_nlte_spectrum.py:uncertainty_scaled_difference
assumptions:
- statement: The atmosphere has prescribed temperature, fixed wind molecular weight and unattenuated blackbody
    irradiation; the observation operator and phase averaging are not implemented.
  evidence:
  - implementation_identity
domains:
- kind: scientific_applicability
  status: unknown
  description: Neither qualitative asymmetry nor a local least-squares solution establishes physical adequacy
    for processed observations.
  conditions: []
  evidence:
  - implementation_identity
claims:
- id: red_dominant_capability
  revision: '1'
  kind: numerical_verification
  statement: At the retained manual parameter set, the unchanged model produces red-dominant double peaks
    whose height difference originates from radial Doppler shifts.
  scope: Existence at one prescribed atmosphere only, checked by retaining its populations and removing
    or reversing only observer-transfer radial velocities.
- id: atmospheric_accuracy
  revision: '1'
  kind: physical_validation
  statement: The complete model is physically adequate for inference from the processed KELT-9b H-alpha
    observation.
  scope: Unverified intended use; a finite manual scan and local gradient optimization do not establish
    or refute this claim.
evidence:
- id: implementation_identity
  kind: implementation
  summary: The subject and selected source hashes are copied unchanged from escape.nlte_spectrum and match
    the current files.
  sources:
  - mceg/contracts/escape.nlte_spectrum.yaml
  subject: spectrum_implementation
  scope: Provider identity only; prior numerical claims are not extended to these new tidal/high-temperature
    conditions.
  artifacts:
  - source: mceg/contracts/escape.nlte_spectrum.yaml
    sha256: c6f10f6db2b60e2f7f2632850c7a131c8d4e8da01cdfc53f27891e1f097c24dc
  provenance:
    role: primary
    location: Unchanged spectrum_implementation subject in mceg/contracts/escape.nlte_spectrum.yaml
    inspection: inspected
    note: Direct inspection of the original contract manifest and a SHA-256 comparison of its 22 selected
      provider files; no scientific source attribution is inferred.
- id: manual_scan
  kind: experiment
  summary: Completed 32-point scan over tides, upper temperature and mass loss; all attempted points are
    retained.
  sources:
  - results/nlte_asymmetry/scan.json
  - results/nlte_asymmetry/scan.npz
  - results/nlte_asymmetry/scan.py
  subject: spectrum_implementation
  context: manual_candidate
  scope: Exploratory finite scan; mass loss extends to 1e15 g/s and is not an inferred value.
  artifacts:
  - source: results/nlte_asymmetry/scan.json
    sha256: e634e9c30eb8b13d91813503881ca2a7998abe43feace9e43d6a17d5f2a55963
  - source: results/nlte_asymmetry/scan.npz
    sha256: 79ad6b4622cfab6463718236047323c6f27ab716914842564b9a48042d8127c5
  - source: results/nlte_asymmetry/scan.py
    sha256: 270836693d97e6be0e9deb2cf498ad6da7cbf9728e8960a284b0b4ef22a327b8
  provenance:
    role: primary
    location: Completed local 32-point scan and retained analysis script
    inspection: inspected
    note: Finite parameters, all rows and exploratory residual scale inspected; this is not a posterior
      or global search.
- id: candidate_controls
  kind: numerical_test
  summary: The manual candidate has red-dominant peaks; suppressing observer Doppler shifts removes the
    height difference and reversing them reverses its sign.
  sources:
  - results/nlte_asymmetry/candidate_metrics.json
  - results/nlte_asymmetry/candidate_arrays.npz
  - results/nlte_asymmetry/candidate_source_hashes.json
  - results/nlte_asymmetry/candidate_check.py
  subject: spectrum_implementation
  context: manual_candidate
  scope: Exactly the retained 128-layer, nmax=15 atmosphere and fixed-population controls; independent
    layer and atom refinements pass 0.1 supplied-error units. Other grid refinements and physical adequacy
    are not established here.
  artifacts:
  - source: results/nlte_asymmetry/candidate_metrics.json
    sha256: 0be3ff18a644d041762759e7a3afa209a47700a6e356252b03654038fbbc9959
  - source: results/nlte_asymmetry/candidate_arrays.npz
    sha256: 99042fe7e0b5533f7ff48283aa84c83489b337314bffe3c707cb3af3659e9e15
  - source: results/nlte_asymmetry/candidate_source_hashes.json
    sha256: bcbe3d24eaec7cf9fc4996fd70d0c1bf66e672b2db2116c7aded8ba346210d2e
  - source: results/nlte_asymmetry/candidate_check.py
    sha256: 486db70a995d71ecfd75c25ae3c99f71ed8f8ff7997544a7a3429a464f28a142
  provenance:
    role: primary
    location: Completed candidate controls, refinement metrics and source hashes
    inspection: inspected
    note: Two maxima and an intervening trough persist. Every local solve converges; positive and reversed
      radial projections use identical populations. Completion and exit 0 were reported by the executing
      agent.
  result: passed
- id: local_fits
  kind: experiment
  summary: Six deterministic gradient fits terminate successfully. At the best point in each horizontal-velocity
    scenario, AD/finite-difference derivatives and 128-to-256-layer refinement pass their recorded numerical
    checks; the resulting peak asymmetry remains small.
  sources:
  - results/nlte_asymmetry/fits.json
  - results/nlte_asymmetry/fit.py
  - results/nlte_asymmetry/fit_checks.json
  - results/nlte_asymmetry/fit_spectra.npz
  - results/nlte_asymmetry/fit_check.py
  subject: spectrum_implementation
  context: exploratory_fit
  scope: 'Two fitted physical parameters: log mass loss in [1e11,1e15] g/s and upper temperature in [6000,14000]
    K. One constant offset is solved analytically. No velocity offset, free amplitude or baseline slope
    is fitted. Numerical checks cover only two selected solutions; no observational fit acceptance/rejection
    threshold is defined.'
  artifacts:
  - source: results/nlte_asymmetry/fits.json
    sha256: b0cfb5f1c7df6ac49840668217a853bcac4db012374ce5c131f0081a5d1a802a
  - source: results/nlte_asymmetry/fit.py
    sha256: 3bfef0c632bbfc6af4f1917ec3e3d9f59c8e2ba988c65d71433ef5b8201f34ab
  - source: results/nlte_asymmetry/fit_checks.json
    sha256: 015da7787ea83ccb3b70d0e7856acc00cb1d55e6dc558f97f968ea9cbd649293
  - source: results/nlte_asymmetry/fit_spectra.npz
    sha256: efdd88f6cf867b7f9998f92014633b137c39385d51cffcf554dad670adb6080d
  - source: results/nlte_asymmetry/fit_check.py
    sha256: 7b607f668779f5af55f5185884487e9ed9b34ec436e835bc97062f77206b282e
  provenance:
    role: primary
    location: Completed six-start optimization and independent selected-point checks
    inspection: inspected
    note: All six optimizer returns report success. Both full-residual AD/finite-difference comparisons
      pass rtol=0.003 and atol=1e-8; both layer changes pass the existing 0.1 supplied-error-unit criterion.
      The executing parent observed both worker exits 0. This is neither a calibrated likelihood test
      nor proof of a global optimum.
