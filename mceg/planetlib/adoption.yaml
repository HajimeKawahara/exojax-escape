contexts:
- id: escape.planetlib.lines
  scope: Only the line contributions inside radiation_state; profile normalization, population closure
    and total continuum remain separately supplied.
- id: escape.planetlib.energy
  scope: coupling=1 only, identical radial edges and spectral weights, full material excitation/ionization
    energy, escaping two-photon cooling counted once; no closure accuracy or nonlinear convergence claim.
- id: escape.planetlib.parker
  scope: No tides; parker_velocity returns km/s and needs a factor 100000 to obtain catalog cm/s. Local
    sonic regularity is separate from global solver accuracy.
- id: escape.planetlib.bound_free
  scope: Common cross section, ordinary frequency and temperature; sums over supplied atom levels and
    quadrature. This does not assert full-atom LTE with one-way two-photon decay.
- id: escape.planetlib.coulomb
  scope: Integer n through 20; relative photon energy E>=1; branch=2 for plus and branch=1 for minus,
    with their distinct q domains. Cross-section normalization and floating-point stability require provider
    checks.
claims:
