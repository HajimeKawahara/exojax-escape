assumptions:
- statement: Interpret each selected model within its own context; these partial models do not automatically
    compose into a complete atmosphere.
  evidence:
  - escape.planetlib.source
domains:
- kind: scientific_applicability
  status: unknown
  description: Adoption does not establish atmospheric accuracy, full-atom LTE, or convergence of the
    coupled nonlinear solve.
  conditions: []
  evidence:
  - escape.planetlib.source
limitations:
- statement: EquationBindings are declarations. Tuple/field projections, transformed inputs and unit conversions
    require explicit source review and tests.
  evidence:
  - escape.planetlib.source
