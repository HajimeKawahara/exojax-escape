  revision: '1'
  kind: theoretical
  statement: Signed line extinction and spontaneous emissivity use ordinary Hz, volume populations and
    per-steradian emission.
  scope: Only the line contributions inside radiation_state; profile normalization, population closure
    and total continuum remain separately supplied.
  equations:
