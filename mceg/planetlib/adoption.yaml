  name: Planetlib definitions adopted by exojax-escape
  description: A companion adoption at a fixed provider source. Historical contracts and scientific judgments
    remain independently scoped.
  implementation: &id001
    repository: https://github.com/HajimeKawahara/exojax-escape
    revision: 18064c9f743c38651b94c2a53d3890d2032852bb
    entry_points:
    - src/escape/coupled_hydrogen.py:CoupledHydrogenModel.radiation_state
