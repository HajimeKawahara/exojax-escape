equations:
- id: planetlib.radiation.line.emission
  revision: '2'
  description: Isotropic spontaneous emission for the same bound-bound line.
  scope: Energy per unit volume, time, solid angle, and ordinary frequency.
  symbols:
    j:
      latex: j_\nu
      description: Spontaneous emissivity per steradian
      unit: erg s^-1 cm^-3 sr^-1 Hz^-1
    h:
      latex: h
      description: Planck constant
      unit: erg s
    nu0:
      latex: \nu_0
      description: Transition frequency
      unit: Hz
    A:
      latex: A_{ul}
      description: Spontaneous downward rate
      unit: s^-1
    nu_population:
      latex: n_u
      description: Upper number density
      unit: cm^-3
    phi:
      latex: \phi_\nu
      description: Normalized frequency profile
      unit: Hz^-1
    frequency:
      latex: \nu
      description: Ordinary frequency coordinate
      unit: Hz
  assumptions:
  - Isotropic emission and the same scalar normalized profile used for extinction.
  - The emitted photon energy is h nu0 under the line-center convention.
  - SymPy symbols are numerical magnitudes in their declared cgs/Hz units; the coefficient
    relation is pointwise in ordinary frequency.
  evidence:
  - planetlib.radiation.line.escape_source
  sympy:
    format: sympy-srepr-v1
    expression: Equality(Symbol('j'), Mul(Rational(1, 4), Pow(pi, Integer(-1)), Symbol('A'),
      Symbol('h'), Symbol('nu0'), Symbol('nu_population'), Symbol('phi')))
- id: planetlib.radiation.line.extinction
  revision: '2'
  description: Absorption and stimulated emission for one bound-bound line.
  scope: Supplied populations and a common normalized frequency profile at one local
    state.
  symbols:
    chi:
      latex: \chi_\nu
      description: Signed extinction
      unit: cm^-1
    c:
      latex: c
      description: Vacuum light speed
      unit: cm s^-1
    A:
      latex: A_{ul}
      description: Spontaneous downward rate
      unit: s^-1
    nu0:
      latex: \nu_0
      description: Transition frequency
      unit: Hz
    gu:
      latex: g_u
      description: Upper statistical weight
      unit: '1'
    gl:
      latex: g_l
      description: Lower statistical weight
      unit: '1'
    nl:
      latex: n_l
      description: Lower number density
      unit: cm^-3
    nu_population:
      latex: n_u
      description: Upper number density
      unit: cm^-3
    phi:
      latex: \phi_\nu
      description: Normalized frequency profile
      unit: Hz^-1
    frequency:
      latex: \nu
      description: Ordinary frequency coordinate
      unit: Hz
  assumptions:
  - Scalar unpolarized coefficients; the same profile applies to absorption and stimulated
    emission.
  - Line-center prefactors are the narrow-line convention; no population law is assumed.
  - Signed extinction is not clipped to zero.
  - SymPy symbols are numerical magnitudes in their declared cgs/Hz units; the coefficient
    relation is pointwise in ordinary frequency.
  evidence:
  - planetlib.radiation.line.escape_source
  sympy:
    format: sympy-srepr-v1
    expression: Equality(Symbol('chi'), Mul(Rational(1, 8), Pow(pi, Integer(-1)),
      Symbol('A'), Pow(Symbol('c'), Integer(2)), Pow(Symbol('nu0'), Integer(-2)),
      Symbol('phi'), Add(Mul(Integer(-1), Symbol('nu_population')), Mul(Pow(Symbol('gl'),
      Integer(-1)), Symbol('gu'), Symbol('nl')))))
- id: planetlib.escape.energy.flux_moment
  revision: '1'
  description: Convert the frequency-integrated first radiation moment to physical
    flux.
  scope: The angular integral contributes 4 pi independently of the spherical surface-area
    factor.
  symbols:
    F:
      latex: F_{\rm rad}
      description: Frequency-integrated physical radial radiative flux; F=4 pi times
        the integrated first moment.
      unit: erg s^-1 cm^-2
    H:
      latex: \overline H
      description: Frequency integral of the radiative first moment, excluding its
        angular factor 4 pi.
      unit: erg s^-1 cm^-2 sr^-1
    r:
      latex: r
      description: Spherical radius increasing outward.
      unit: cm
  assumptions:
  - Steady spherical transport and constant total mass flow; all symbols denote numerical
    magnitudes in their declared cgs units.
  - The transported source S, flux F and first moment H use the same frequency range,
    weights, radiation field and extinction/emissivity; the physical coupling is one,
    not an intermediate continuation value.
  - The material energy includes excitation and ionization; collisional redistribution
    is internal and must not be subtracted as another external cooling term.
  - Two-photon loss C is outside the transported emissivity. If those photons enter
    j_nu, remove the separate C term to avoid double counting.
  - The source-cancellation identity uses only the zeroth radiation moment; it does
    not validate an Eddington closure, angular transport or boundary illumination.
  evidence:
  - planetlib.escape.energy.upstream
  sympy:
    format: sympy-srepr-v1
    expression: Equality(Function('F')(Symbol('r', positive=True)), Mul(Integer(4),
      pi, Function('H')(Symbol('r', positive=True))))
- id: planetlib.escape.energy.material_balance
  revision: '1'
  description: Advected total material-energy flux driven by the net external heating.
  scope: Mass flow is constant and contains the full solid-angle factor 4 pi.
  symbols:
    B:
      latex: \mathcal B
      description: Specific kinetic plus enthalpy plus gravitational energy; material
        enthalpy includes excitation and ionization.
      unit: erg g^-1
    Q:
      latex: \mathcal H
      description: Net external material heating including the separately escaping
        channel.
      unit: erg s^-1 cm^-3
    mdot:
      latex: \dot M
      description: Constant total outward mass flow rate, integrated over the full
        sphere.
      unit: g s^-1
    r:
      latex: r
      description: Spherical radius increasing outward.
      unit: cm
  assumptions:
  - Steady spherical transport and constant total mass flow; all symbols denote numerical
    magnitudes in their declared cgs units.
  - The transported source S, flux F and first moment H use the same frequency range,
    weights, radiation field and extinction/emissivity; the physical coupling is one,
