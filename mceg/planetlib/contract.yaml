mathematical_models:
- id: planetlib.radiation.line.coefficients
  revision: '2'
  description: A coefficient pair sharing populations, transition data, and a frequency
    profile.
  scope: External inputs are both level populations and the normalized profile; transition
    data and physical constants are parameters. LTE, non-LTE population closure, broadening,
    transport, and boundary conditions remain unspecified.
  quantities:
    frequency:
      quantity:
        id: planetlib.radiation.line.frequency
        revision: '1'
      role: coordinate
    nu0:
      quantity:
        id: planetlib.radiation.line.center
        revision: '1'
      role: parameter
    A:
      quantity:
        id: planetlib.radiation.line.einstein_a
        revision: '1'
      role: parameter
    gu:
      quantity:
        id: planetlib.radiation.line.upper_weight
        revision: '1'
      role: parameter
    gl:
      quantity:
        id: planetlib.radiation.line.lower_weight
        revision: '1'
      role: parameter
    upper:
      quantity:
        id: planetlib.radiation.line.upper_density
        revision: '1'
      role: input
    lower:
      quantity:
        id: planetlib.radiation.line.lower_density
        revision: '1'
      role: input
    profile:
      quantity:
        id: planetlib.radiation.line.profile
        revision: '1'
      role: input
    c:
      quantity:
        id: planetlib.radiation.line.light_speed
        revision: '1'
      role: parameter
    h:
      quantity:
        id: planetlib.radiation.line.planck_constant
        revision: '1'
      role: parameter
    extinction:
      quantity:
        id: planetlib.radiation.line.extinction_coefficient
        revision: '1'
      role: derived
    emission:
      quantity:
        id: planetlib.radiation.line.emission_coefficient
        revision: '1'
      role: derived
  relations:
  - id: planetlib.radiation.line.extinction_relation
    equation:
      id: planetlib.radiation.line.extinction
      revision: '2'
    kind: equation
    role: Net extinction including stimulated emission
    quantities:
      chi: extinction
      c: c
      A: A
      nu0: nu0
      gu: gu
      gl: gl
      nl: lower
      nu_population: upper
      phi: profile
      frequency: frequency
  - id: planetlib.radiation.line.emission_relation
    equation:
      id: planetlib.radiation.line.emission
      revision: '2'
    kind: equation
    role: Isotropic spontaneous emission
    quantities:
      j: emission
      h: h
      nu0: nu0
      A: A
      nu_population: upper
      phi: profile
      frequency: frequency
- id: planetlib.escape.energy.continuum
  revision: '1'
  description: Open spherical radiation/material energy budget.
  scope: S and C are supplied shared sources; mdot is supplied. F, H and B require
    a separate transport/material closure and boundary conditions. This model records
    balance and its derived identity only.
  quantities:
    B:
      quantity:
        id: planetlib.escape.energy.quantity.B
        revision: '1'
      role: unknown
    C:
      quantity:
        id: planetlib.escape.energy.quantity.C
        revision: '1'
      role: input
    F:
      quantity:
        id: planetlib.escape.energy.quantity.F
        revision: '1'
      role: unknown
    H:
      quantity:
        id: planetlib.escape.energy.quantity.H
        revision: '1'
      role: unknown
    Q:
      quantity:
        id: planetlib.escape.energy.quantity.Q
        revision: '1'
      role: derived
    S:
      quantity:
