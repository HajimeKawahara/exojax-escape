- id: planetlib.atomic.balance.upstream
  kind: theory
  summary: Closed bound-state balance and a conditional Milne-Saha pair extracted
    from inspected upstream mathematical conventions.
  sources:
  - https://github.com/HajimeKawahara/exojax-escape/blob/18064c9f743c38651b94c2a53d3890d2032852bb/src/escape/hydrogen_nlte.py
  - https://github.com/HajimeKawahara/exojax-escape/blob/18064c9f743c38651b94c2a53d3890d2032852bb/src/escape/hydrogen_atom.py
  - https://github.com/HajimeKawahara/exojax-escape/blob/18064c9f743c38651b94c2a53d3890d2032852bb/src/escape/hydrogen_continuum.py
  - https://github.com/HajimeKawahara/exojax-escape/blob/18064c9f743c38651b94c2a53d3890d2032852bb/mceg/contracts/escape.cloudy_investigation.yaml
  scope: Two bound states form a closed bound-bound example. The separate one-level
    bound-free model adopts Saha populations and Planck radiation at the same positive
    T; it is a conditional inverse-process identity, not a full-atom LTE closure.
    The common supplied cross section is nonnegative above the actual ionization threshold
    and zero below it; no Kramers or Coulomb approximation is selected. One-way two-photon
    loss, external pumps, other levels and advection are excluded from the two-state
    conservation example. Frequency integrands use ordinary Hz and identical quadrature
    weights when integrated.
  result: null
  provenance:
    role: implementation
    location: The selected source files and MCEG equations at the pinned commits.
    inspection: inspected
    note: Sources were read locally; provider test status and empirical support remain
      upstream.
    derived_from: []
  subject: null
  context: null
  artifacts: []
- id: planetlib.atomic.coulomb.upstream
  kind: theory
  summary: Energy-normalized Coulomb recurrence extracted from inspected upstream
    mathematical conventions.
  sources:
  - https://github.com/HajimeKawahara/exojax-escape/blob/18064c9f743c38651b94c2a53d3890d2032852bb/mceg/contracts/escape.cloudy_investigation.yaml
  - https://github.com/HajimeKawahara/exojax-escape/blob/18064c9f743c38651b94c2a53d3890d2032852bb/mceg/contracts/escape.atom_convergence.yaml
  - https://github.com/HajimeKawahara/exojax-escape/blob/18064c9f743c38651b94c2a53d3890d2032852bb/src/escape/hydrogen_bound_free.py
  scope: 'One scalar downward Coulomb recurrence step with branch=2 for the plus channel
    and branch=1 for the minus channel. n is an integer with 1<=n<=20; plus steps
    require 0<=q<=n-3 and minus steps 1<=q<=n-3. All photon energies are at or above
    threshold, E=1+n^2 momentum^2>=1, and Gstar is positive. Seeds are used only when
    their indices exist: plus-next requires n>=2 and minus-next n>=3. The noncontributing
    n=1 minus seed is never used as a dipole. This algebraic rescaling does not evaluate
    logarithms, prescribe clipping below threshold, prove float64 stability or select
    a bound-free cross section. The older unscaled implementation had an n<=5 numerical
    scope; the algebraic identity does not transfer that bound to the current rescaled
    n<=20 implementation.'
  result: null
  provenance:
    role: implementation
    location: The selected source files and MCEG equations at the pinned commits.
    inspection: inspected
    note: Sources were read locally; provider test status and empirical support remain
      upstream.
    derived_from: []
  subject: null
  context: null
  artifacts: []
