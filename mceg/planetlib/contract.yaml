  description: Rescale the next-next radial factor with two fewer energy powers.
  scope: Energy-normalized Coulomb recurrence under the stated assumptions.
  symbols:
    E:
      latex: E
      description: Photon energy divided by the selected threshold.
      unit: '1'
    G2:
      latex: G2
      description: Unscaled radial factor at index q+2 in the same branch.
      unit: '1'
    Gstar:
      latex: G_*
      description: Common Coulomb normalization independent of q.
      unit: '1'
    H2:
      latex: H2
      description: Energy-normalized radial factor at index q+2 in the same branch.
      unit: '1'
    branch:
      latex: branch
      description: Channel selector.
      unit: '1'
    n:
      latex: n
      description: Principal quantum number of the bound shell.
      unit: '1'
    q:
      latex: q
      description: Downward recurrence index.
      unit: '1'
  assumptions:
  - 'One scalar downward Coulomb recurrence step with branch=2 for the plus channel
    and branch=1 for the minus channel. n is an integer with 1<=n<=20; plus steps
    require 0<=q<=n-3 and minus steps 1<=q<=n-3. All photon energies are at or above
    threshold, E=1+n^2 momentum^2>=1, and Gstar is positive. Seeds are used only when
    their indices exist: plus-next requires n>=2 and minus-next n>=3. The noncontributing
    n=1 minus seed is never used as a dipole. This algebraic rescaling does not evaluate
    logarithms, prescribe clipping below threshold, prove float64 stability or select
    a bound-free cross section. The older unscaled implementation had an n<=5 numerical
    scope; the algebraic identity does not transfer that bound to the current rescaled
    n<=20 implementation.'
  - All symbols denote numerical magnitudes in the declared units.
  evidence:
  - planetlib.atomic.coulomb.upstream
  sympy:
    format: sympy-srepr-v1
    expression: Equality(Symbol('G2'), Mul(Pow(Symbol('E', positive=True), Add(Mul(Integer(-1),
      Symbol('branch', integer=True)), Symbol('n', integer=True), Mul(Integer(-1),
      Symbol('q', integer=True)), Integer(-1))), Symbol('Gstar'), Symbol('H2')))
- id: planetlib.atomic.coulomb.minus_next_seed
  revision: '1'
  description: Normalized minus-channel seed at n-2.
  scope: Energy-normalized Coulomb recurrence under the stated assumptions.
  symbols:
    E:
