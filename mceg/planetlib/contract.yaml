- id: planetlib.atomic.coulomb.step
  revision: '1'
  description: Energy-normalized Coulomb recurrence
  scope: 'One scalar downward Coulomb recurrence step with branch=2 for the plus channel
    and branch=1 for the minus channel. n is an integer with 1<=n<=20; plus steps
    require 0<=q<=n-3 and minus steps 1<=q<=n-3. All photon energies are at or above
    threshold, E=1+n^2 momentum^2>=1, and Gstar is positive. Seeds are used only when
    their indices exist: plus-next requires n>=2 and minus-next n>=3. The noncontributing
    n=1 minus seed is never used as a dipole. This algebraic rescaling does not evaluate
    logarithms, prescribe clipping below threshold, prove float64 stability or select
    a bound-free cross section. The older unscaled implementation had an n<=5 numerical
    scope; the algebraic identity does not transfer that bound to the current rescaled
    n<=20 implementation.'
