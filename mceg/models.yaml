inventory_version: '0.1'
scope: >-
  All packaged sources and license notices under src/escape, including the historical population
  closures, the local NLTE atoms, wind and line-center choices. Forward-model families include the
  prescribed temperature, disk geometry, broadening, boundary radiation and
  rotation/zonal-velocity prescriptions; their individual parameter choices
  are not exhaustively enumerated. Examples, observational data, tests and
  external ExoJAX implementations are outside this inventory's scan scope.
  File hashes record source inspection, not scientific validation. Model
  boundaries and contract links remain pending human review.
  Historical contracts retain their reviewed source pins; current repaired
  kernels have a separate investigation contract and source review.
source_roots:
- src/escape
contract_roots:
- mceg/contracts
files:
  src/escape/__init__.py:
    sha256: 68bfd52442b9d98b7c167846961560a5a2f2e9d8d2a74a297a218c8d0efbf631
    role: support
    note: Package description only; no model definitions or imports.
  src/escape/hydrogen_populations.py:
    sha256: c4b913236c6e5384903920d0378fe285563bb46170528f0fe7d2b02e76733289
    role: model
    note: Inspected pure-H continuity, diluted blackbody and two-level rate balance.
  src/escape/parker.py:
    sha256: 0d6b340dd3c47895117b6aa0fbf156ca9eb3f04588170ea99ef7858766004a1e
    role: model
    note: Inspected constant-temperature wind branch, sonic expansion and custom JVP.
  src/escape/nonisothermal.py:
    sha256: 35ab60f683ca96ceda895b186406f481aad3563c6c27e7b8af1a8c4715e1c529
    role: model
    note: Inspected prescribed-temperature wind, optional linear tide and implicit roots.
  src/escape/hydrogen_forward.py:
    sha256: bc10132b58391ae7ffbc763d2259c713e3ccbc776e9628d4a98c76f8887a7a25
    role: model
    note: >-
      Inspected all three population paths, wind dispatch, NIST/Rydberg choices
      and shared temperature, line-transfer, geometry and velocity prescriptions.
      Observer transfer sums branch extinction/emission before applying the existing
      intensity solver, with explicit frequency-dependent extinction validity.
  src/escape/hydrogen_rates.py:
    sha256: a1e1237725284198f8617a828f292d0d92e42ee6824f95c2efcfd68b535b5535
    role: model
    note: 'Six-state hydrogen rates: prescribed radiation, published tables/fits, Gaunt-one bound-free
      and matched inverse rates; restricted temperature domain.'
  src/escape/hydrogen_nlte.py:
    sha256: 697375972fffdc077f9ee2cb131d74a31c1af6e9d8f98fa5e64127fd4b874943
    role: model
    note: >-
      Generic charge-conserving implicit root with a density-dependent rate callback; the
      prescribed-rate six-state API is preserved and separately regression tested.
  src/escape/nlte_forward.py:
    sha256: 9b10a87b552942cb86fd03d8651759a3172bcb560b0863ca85115fef427d5512
    role: model
    note: Extended local atom (default nmax=15 and 128 layers) on the prescribed-temperature/fixed-mu Parker wind;
      threshold-split continuum quadrature, implicit populations, actual H-alpha branch
      weights and full upper/lower lifetime profiles in the existing observer transfer.
  src/escape/hydrogen_atom.py:
    sha256: 1894406d3bbb4cbc3bb4e9d89c56b0db3867ac09a3c1974cf641c9e9b2c02208
    role: model
    note: >-
      Finite nmax3..20 atom (default15), exact-rational static dipoles and high-shell VS80 ionization;
      shared Coulomb bound-free kernels and PSM20 n2/n3 mixing inside the implicit charge root.
      Shared natural widths sum both levels' spontaneous decay rates, including 2s two-photon
      decay. Original n<=5 rates remain available for controlled comparisons.
  src/escape/hydrogen_continuum.py:
    sha256: 61a5669f3a08e6af967d2f1042fa387489224389bddcefd13da576b1cd31e770
    role: model
    note: >-
      Shared orbital-resolved bound-free/Milne transfer kernels, free-free energy kernels and
      optional conditional H-minus trace closure.
  src/escape/radiation.py:
    sha256: 1c56019cb4821f3df7020b0403e1308a83c5d24328de07640d473cb0274df2f3
    role: model
    note: Static spherical/slab Eddington moments, incoming boundaries and signed weak-gain domain.
  src/escape/reactive_flow.py:
    sha256: af160d5ae62c5ebd7b77a4158ecf07768a7638bcdaf659d6caf9fe1b535883df
    role: model
    note: Finite spherical inflow branch with variable composition, chemical energy and advected populations.
  src/escape/coupled_hydrogen.py:
    sha256: 9c9152632147e26b039cdc1c3193c1257f5c45a69e8dd9d1aefca2419466cce8
    role: model
    note: Joint radiation/SE/thermal and finite-flow residuals with implicit derivatives and separate energy
      diagnostics; default nmax15, with prior small-atom numerical scopes retained explicitly.
      The existing natural-width expression now uses the shared atomic lifetime helper.
  src/escape/_licenses/Cloudy.txt:
    sha256: 225136d0a6ec8a56ab39dc876bb2c85de47537d783d3fa66fb14322907f986de
    role: support
    note: Retained zlib notice for the explicitly altered Cloudy collision-rate adaptation.
  src/escape/hydrogen_bound_free.py:
    sha256: 90170626731551946dfeac40f47b87afd369fb9d8f10d378c2f2e5d23de5f5fc
    role: model
    note: Energy-scaled Brocklehurst Coulomb recurrences with logarithmic assembly for resolved sublevels
      and statistically collapsed shells through n<=20; anchored to independent source tables.
  src/escape/hydrogen_mixing.py:
    sha256: 78bf474551b07a6641c471f4403fae44d0de6c07311858e4ecfe0928c99c3b8f
    role: model
    note: Continuous lifetime/Debye PSM20 proton n2/n3 mixing with inverse-pair convention, protium reduced
      mass and differentiable screening.
models:
- id: escape.hydrogen_populations
  description: >-
    Pure-H mass continuity, externally diluted blackbody occupation and isolated
    two-level collisional/radiative balance. No ionization or multilevel solution.
  review_pending: true
  bindings:
  - path: src/escape/hydrogen_populations.py
    symbol: hydrogen_nuclei_density
  - path: src/escape/hydrogen_populations.py
    symbol: diluted_blackbody_occupation
  - path: src/escape/hydrogen_populations.py
    symbol: two_level_ratio
  - path: src/escape/parker.py
  contracts:
  - path: mceg/contracts/escape.hydrogen_populations.yaml
    model_id: escape.hydrogen_populations
- id: escape.wind.isothermal
  description: Spherical accelerating isothermal Parker wind with constant mu and no tides.
  review_pending: true
  bindings:
  - path: src/escape/parker.py
    symbol: parker_velocity
  - path: src/escape/parker.py
    symbol: sonic_radius_cm
  contracts:
  - path: mceg/contracts/escape.parker_wind.yaml
    model_id: escape.parker_wind
- id: escape.wind.isothermal_tidal
  description: >-
    Constant-temperature, constant-mu transonic wind with positive linear tidal
    acceleration, selected by the forward model's isothermal mode and nonzero
    tidal_coefficient_s2. Spherical continuity; not full Roche geometry.
  review_pending: true
  bindings:
  - path: src/escape/hydrogen_forward.py
    symbol: HydrogenForwardModel.radial_velocity
    settings: {wind_model: isothermal}
  - path: src/escape/nonisothermal.py
    symbol: nonisothermal_parker_velocity
  contracts:
  - path: mceg/contracts/escape.parker_wind.yaml
    model_id: escape.parker_wind
- id: escape.wind.prescribed_temperature
  description: >-
    Transonic wind with prescribed smooth temperature, constant mu and zero
    tidal acceleration; no energy equation. The forward model supplies its
    prescribed kinetic-temperature profile.
  review_pending: true
  bindings:
  - path: src/escape/nonisothermal.py
    symbol: nonisothermal_parker_velocity
    settings: {tidal_coefficient_s2: 0.0}
  - path: src/escape/hydrogen_forward.py
    symbol: HydrogenForwardModel.radial_velocity
    settings: {wind_model: nonisothermal, tidal_coefficient_s2: 0.0}
  contracts:
  - path: mceg/contracts/escape.parker_wind.yaml
    model_id: escape.parker_wind
- id: escape.wind.prescribed_temperature_tidal
  description: >-
    Prescribed-temperature, constant-mu transonic wind with positive linear
    tidal acceleration; spherical continuity and no energy equation. The
    temperature callback and tidal coefficient remain explicit input choices.
  review_pending: true
  bindings:
  - path: src/escape/nonisothermal.py
    symbol: nonisothermal_parker_velocity
  - path: src/escape/hydrogen_forward.py
    symbol: HydrogenForwardModel.radial_velocity
    settings: {wind_model: nonisothermal}
  contracts:
  - path: mceg/contracts/escape.parker_wind.yaml
    model_id: escape.parker_wind
- id: escape.spectrum.model1
  description: >-
    Model 1: exponential n2 profile independent of total density, with Boltzmann
    ratio times a prescribed sigmoid. Includes selectable Parker winds or the
    radial_wind=false static comparison and the shared spectrum prescriptions.
  review_pending: true
  bindings:
  - path: src/escape/hydrogen_forward.py
    symbol: HydrogenForwardModel.prescribed_spectrum
  contracts: []
- id: escape.spectrum.model2
  description: >-
    Model 2: continuity-shaped excited reservoir, prescribed Boltzmann/sigmoid
    ratio and selectable Parker wind. The n2 column sets normalization; mass
    loss and excited fraction are not independently determined.
  review_pending: true
  bindings:
  - path: src/escape/hydrogen_forward.py
    symbol: HydrogenForwardModel.continuity_profiles
  - path: src/escape/hydrogen_forward.py
    symbol: HydrogenForwardModel.continuity_spectrum
  contracts: []
- id: escape.spectrum.model3
  description: >-
    Model 3: pure-H mass continuity and isolated two-level balance with prescribed
    ionized and excited fractions, temperature and irradiation. Includes selectable
    Parker winds and shared spectrum prescriptions; not a multilevel NLTE model.
    The local population contract does not validate this full forward model.
  review_pending: true
  bindings:
  - path: src/escape/hydrogen_forward.py
    symbol: HydrogenForwardModel.population_profiles
  - path: src/escape/hydrogen_forward.py
    symbol: HydrogenForwardModel.spectrum
  - path: src/escape/hydrogen_populations.py
    symbol: two_level_ratio
  contracts: []
- id: escape.halpha.nist
  description: >-
    One unresolved NIST H-alpha transition with shell weights 8 and 18, using
    ExoJAX AdbNist. Line data acquisition and upstream atomic physics are external.
  review_pending: true
  bindings:
  - path: src/escape/hydrogen_forward.py
    symbol: HydrogenForwardModel.__init__
    settings: {wavelength_model: nist}
  contracts: []
- id: escape.halpha.rydberg
  description: >-
    Local Rydberg H-alpha center comparison at fixed NIST oscillator strength;
    energy gap, A and LTE strength are adjusted. This does not reproduce every
    coefficient of the former AdbHydrogen implementation.
  review_pending: true
  bindings:
  - path: src/escape/hydrogen_forward.py
    symbol: _use_rydberg_center
  - path: src/escape/hydrogen_forward.py
    symbol: HydrogenForwardModel.__init__
    settings: {wavelength_model: rydberg}
  contracts: []
- id: escape.hydrogen_nlte
  description: Six-state pure-H atomic rates, local statistical equilibrium and actual-population
    H-alpha branch weights. External T/nH/radiation; no coupled atmosphere or empirical validation.
  review_pending: true
  bindings:
  - path: src/escape/hydrogen_rates.py
    symbol: hydrogen_rate_coefficients
  - path: src/escape/hydrogen_rates.py
    symbol: blackbody_hydrogen_rates
  - path: src/escape/hydrogen_nlte.py
    symbol: solve_statistical_equilibrium
  - path: src/escape/nlte_forward.py
    symbol: halpha_coefficients
  contracts:
  - path: mceg/contracts/escape.hydrogen_nlte.yaml
    model_id: escape.hydrogen_nlte
- id: escape.spectrum.nlte
  description: Extended local NLTE populations (six resolved states plus shells n=4..15 by default)
    on a prescribed-temperature/fixed-mu Parker wind, with branch lifetime profiles and
    existing observer transfer. Finite sampled numerical checks are separate from
    atmospheric accuracy, observational processing and posterior convergence.
  review_pending: true
  bindings:
  - path: src/escape/nlte_forward.py
    symbol: HydrogenNLTEForwardModel.population_profiles
  - path: src/escape/nlte_forward.py
    symbol: HydrogenNLTEForwardModel.spectrum
  - path: src/escape/nlte_forward.py
    symbol: HydrogenNLTEForwardModel._line_profiles
  - path: src/escape/hydrogen_forward.py
    symbol: HydrogenForwardModel._transfer_line_coefficients
  contracts:
  - path: mceg/contracts/escape.nlte_spectrum.yaml
    model_id: escape.nlte_spectrum
- id: escape.coupled_hydrogen
  description: >-
    Finite-atom static Eddington radiation, static SE/thermal benchmarks and a
    distinct finite spherical inflow branch with composition-dependent pressure,
    chemical energy and population advection. No transonic mass-flux eigenvalue,
    moving/angularly resolved transfer or validated KELT-9b atmosphere is implied.
  review_pending: true
  bindings:
  - path: src/escape/hydrogen_atom.py
    symbol: make_hydrogen_atom
  - path: src/escape/hydrogen_continuum.py
    symbol: total_radiative_energy
  - path: src/escape/radiation.py
    symbol: solve_moment_transfer
  - path: src/escape/reactive_flow.py
    symbol: reactive_flow_residual
  - path: src/escape/coupled_hydrogen.py
    symbol: CoupledHydrogenModel.solve_equilibrium
  - path: src/escape/coupled_hydrogen.py
    symbol: CoupledHydrogenModel.solve_flow
  contracts:
  - path: mceg/contracts/escape.coupled_hydrogen.yaml
    model_id: escape.coupled_hydrogen
  - path: mceg/contracts/escape.atom_convergence.yaml
    model_id: escape.atom_convergence
- id: escape.cloudy_investigation
  description: Finite-atom Coulomb bound-free and density-dependent PSM20 n2/n3 mixing closures.
    Historical eight-case small-atom repair plus enlarged-atom convergence and fourteen matched
    Cloudy comparisons have distinct contracts and source scopes. Agreement does not validate
    every rate or a planetary atmosphere.
  review_pending: true
  bindings:
  - path: src/escape/hydrogen_bound_free.py
    symbol: hydrogenic_cross_section
  - path: src/escape/hydrogen_mixing.py
    symbol: proton_l_mixing_psm20
  - path: src/escape/hydrogen_atom.py
    symbol: solve_atom_populations
  - path: src/escape/hydrogen_nlte.py
    symbol: _solve_equilibrium_with_rates
  - path: src/escape/hydrogen_continuum.py
    symbol: continuum_coefficients
  contracts:
  - path: mceg/contracts/escape.cloudy_investigation.yaml
    model_id: escape.cloudy_investigation
  - path: mceg/contracts/escape.atom_convergence.yaml
    model_id: escape.atom_convergence
