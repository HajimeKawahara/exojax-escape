name: Planetlib adoption
on:
  pull_request:
    paths: ['mceg/planetlib/**', 'src/escape/**', '.github/workflows/planetlib.yml']
  push:
    branches: [main]
    paths: ['mceg/planetlib/**', 'src/escape/**', '.github/workflows/planetlib.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: HajimeKawahara/planetlib
          ref: a83b3fb255c7a383c6a8ef502328266f4dd16bff
          path: .planetlib-upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r mceg/planetlib/requirements.txt -e '.[test]'
      - name: Reproduce the native snapshot from the fixed catalog
        run: |
          python .planetlib-upstream/tools/planetlib.py build mceg/planetlib/adoption.yaml --lock mceg/planetlib/imports.lock.json --output "$RUNNER_TEMP/escape-planetlib.yaml"
          diff -u mceg/planetlib/contract.yaml "$RUNNER_TEMP/escape-planetlib.yaml"
      - name: Check native pins, source identity and selected correspondences
        env:
          JAX_PLATFORMS: cpu
        run: python -m pytest mceg/planetlib/test_adoption.py -q
